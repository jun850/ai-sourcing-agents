<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Fabrics, Trims, Accessories &amp; OEM — Atelix</title>
<meta name="description" content="Explore verified fabrics, accessories, trims, yarns and OEM services. Filter by material, price, MOQ and certifications, and source from audited factories.">
<link rel="canonical" href="https://marketplace-three-peach.vercel.app/pages/category.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Atelix">
<meta property="og:title" content="Browse Fabrics, Trims, Accessories & OEM — Atelix">
<meta property="og:description" content="Explore verified fabrics, accessories, trims, yarns and OEM services. Filter by material, price, MOQ and certifications.">
<meta property="og:url" content="https://marketplace-three-peach.vercel.app/pages/category.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Browse Fabrics, Trims, Accessories & OEM — Atelix">
<meta name="twitter:description" content="Verified fabrics, trims, accessories, yarns and OEM services — filter by material, price, MOQ and certifications.">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body data-catalog data-marketplace-search data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap">
  <a class="mobile-context-back" id="catalogMobileBack" href="/categories" aria-label="Back to all categories"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m14 5-7 7 7 7M7 12h13"/></svg><span>All categories</span></a>
  <nav class="crumbs" id="catalogCrumbs" aria-label="Breadcrumb"><ol></ol></nav>
  <section class="catalog-level-nav" id="catalogLevelNav" aria-label="Subcategories"></section>

  <div class="listing">
    <!-- filter rail -->
    <aside class="filter-rail" aria-label="Product filters">
        <div class="frl-head"><b data-i18n="cat.filters">Filters</b><span><button type="button" id="clearFilters" data-i18n="cat.reset">Reset</button><button class="sheet-close" type="button" data-close-filters aria-label="Close filters">×</button></span></div>
      <div class="frl-block">
        <h5 data-i18n="cat.oemavail">OEM availability</h5>
        <label class="frl-opt"><input type="radio" name="avail" value="all" checked> <span data-i18n="cat.all">All</span></label>
        <label class="frl-opt"><input type="radio" name="avail" value="oem"> <span data-i18n="cat.oemAvailable">OEM available</span></label>
        <label class="frl-opt"><input type="radio" name="avail" value="nonoem"> <span data-i18n="cat.nonoem">Non-OEM</span></label>
      </div>
      <div class="frl-block">
        <h5 data-i18n="cat.material">Material</h5>
        <div id="matOpts"></div>
      </div>
      <div class="frl-block">
        <h5 data-i18n="cat.price">Price ($ / unit)</h5>
        <div class="frl-price"><input type="number" id="pmin" aria-label="Minimum price" placeholder="Min" min="0"><span class="muted">–</span><input type="number" id="pmax" aria-label="Maximum price" placeholder="Max" min="0"></div>
      </div>
      <div class="frl-block" id="countryBlock">
        <h5>Country of Origin</h5>
        <div id="countryOpts"></div>
      </div>
      <div class="frl-block" id="regionBlock" style="display:none">
        <h5>Region</h5>
        <div id="regionOpts"></div>
      </div>
      <div class="frl-block">
        <h5 data-i18n="cat.certs">Certifications</h5>
        <label class="frl-opt"><input type="checkbox" disabled> GRS <span class="cnt">128</span></label>
        <label class="frl-opt"><input type="checkbox" disabled> Oeko-Tex <span class="cnt">340</span></label>
        <label class="frl-opt"><input type="checkbox" disabled> GOTS <span class="cnt">92</span></label>
      </div>
    </aside>

    <!-- main -->
    <div class="listing-main">
      <div class="mobile-list-tools" role="group" aria-label="Catalog controls">
        <div class="mobile-filter-chips" role="group" aria-label="Quick filters and sort">
          <button class="mobile-filter-chip on" type="button" data-quick-avail="all">All</button>
          <button class="mobile-filter-chip" type="button" data-quick-avail="oem">OEM available</button>
          <button class="mobile-filter-chip" type="button" data-quick-avail="nonoem">Non-OEM</button>
          <button class="mobile-filter-chip on" type="button" data-quick-sort="rec">Recommended</button>
          <button class="mobile-filter-chip" type="button" data-quick-sort="new">Newest</button>
          <button class="mobile-filter-chip" type="button" data-quick-sort="moq">MOQ: Low</button>
          <button class="mobile-filter-chip" type="button" data-quick-sort="price">Price: Low</button>
        </div>
        <span id="mobileResCount" aria-live="polite"></span>
      </div>
      <div class="sortbar">
        <span class="lbl" data-i18n="cat.sort">Sort</span>
        <div class="sort-chips" id="sortChips">
          <button type="button" class="sort-chip on" data-sort="rec" data-i18n="sort.rec">Recommended</button>
          <button type="button" class="sort-chip" data-sort="new" data-i18n="sort.new">Newest</button>
          <button type="button" class="sort-chip" data-sort="moq" data-i18n="sort.moq">MOQ: Low</button>
          <button type="button" class="sort-chip" data-sort="price" data-i18n="sort.price">Price: Low</button>
        </div>
        <span class="count" id="resCount"></span>
        <button class="sheet-close" type="button" data-close-sort aria-label="Close sort">×</button>
      </div>
      <div class="prod-grid" id="grid"></div>
      <nav class="catalog-pagination" id="catalogPagination" aria-label="Catalogue pages" hidden></nav>
      <section class="oem-material-sources" id="oemMaterialSources" hidden aria-labelledby="oem-material-sources-title"></section>
    </div>
  </div>
  <div class="page-end-space" aria-hidden="true"></div>
</main>

<div id="ftr"></div>
<script src="/js/data.js"></script>
<script src="/js/catalog-taxonomy.js"></script>
<script src="/js/copilot.js"></script>
<script src="/js/components.js"></script>
<script defer src="/js/analytics.bundle.js"></script>
<script src="/js/supabase-client.bundle.js"></script>
<script src="/js/api.js"></script>
<script src="/js/copilot-llm.js"></script>
<script>
window.ARCANA_PAGE = async function({ASSET,IC,Store,toast}){
  // This file renders category browsing and the two explicit assisted modes.
  // Plain keyword search has its own neutral /search route.
  // keep them straight when touching filters, sort, badges or pricing below:
  //   · Category page — category.html?cat=<slug>            (default browse/listing)
  //   · Copilot SRP   — category.html?copilot=1              (Athelia results)
  //   · Design Match  — category.html?design-match=1         (tech-pack / reference results)
  const qsAll=new URLSearchParams(location.search);
  if(qsAll.get('q')){ location.replace('/search?q='+encodeURIComponent(qsAll.get('q'))); return; }
  const pageMode = qsAll.get('design-match')==='1' ? 'design-match' : (qsAll.get('copilot')==='1' ? 'copilot-srp' : 'category');
  document.body.dataset.pageMode = pageMode;
  if(pageMode!=='category'){
    const label=pageMode==='copilot-srp'?'Athelia sourcing':'Design match';
    document.querySelector('#catalogCrumbs ol').innerHTML=`<li><a href="/">Home</a></li><li><a href="/search">Search</a></li><li><span aria-current="page">${label}</span></li>`;
    document.getElementById('catalogLevelNav').hidden=true;
  }
  const filterRail=document.querySelector('.filter-rail'), sortbar=document.querySelector('.sortbar');
  document.querySelector('[data-close-filters]').addEventListener('click',()=>{filterRail.classList.remove('sheet-open');document.body.classList.remove('sheet-active');});
  document.querySelector('[data-close-sort]').addEventListener('click',()=>{sortbar.classList.remove('sheet-open');document.body.classList.remove('sheet-active');});

  // ---- Design Match ----
  if(pageMode==='design-match'){ return runDesignMatch(); }

  function runDesignMatch(){
    const match=window.ARCANA_getDesignMatch&&window.ARCANA_getDesignMatch();
    const main=document.querySelector('main.wrap'), listing=document.querySelector('.listing');
    document.querySelector('.filter-rail').style.display='none';
    document.querySelector('.sortbar').style.display='none';
    listing.style.display='block';
    const grid=document.getElementById('grid'); grid.className='design-match-results';
    if(!match || !match.brief || !match.results){
      grid.innerHTML=`<section class="dm-empty"><span>${IC.document}</span><h1>No active design match</h1><p>Upload a tech pack or reference from the search bar to create a private sourcing brief.</p><button class="btn btn-green" data-dm-start>Upload a design reference</button></section>`;
      grid.querySelector('[data-dm-start]').addEventListener('click',()=>window.ARCANA_openDesignMatch&&window.ARCANA_openDesignMatch()); return;
    }
    const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const brief=match.brief, results=match.results;
    const files=(match.files||[]).map(file=>`<span>${IC.document}${esc(file.name)}</span>`).join('');
    const bar=document.createElement('section'); bar.className='dm-result-bar'; main.insertBefore(bar,listing);
    const categoryNames={fabrics:'Fabrics',buttons:'Buttons',zippers:'Zippers',labels:'Labels & tags',trims:'Trims',yarns:'Yarns & thread',accessories:'Other accessories'};
    const categoryOptions=Object.entries(categoryNames).map(([value,label])=>`<option value="${value}">${label}</option>`).join('');
    const bomRows=()=>brief.bomItems&&brief.bomItems.length?brief.bomItems.map((item,index)=>`<div class="dm-bom-row" data-dm-bom-row>
      <select data-dm-bom-category aria-label="Category for BOM item ${index+1}">${categoryOptions.replace(`value="${esc(item.category)}"`,`value="${esc(item.category)}" selected`)}</select>
      <input data-dm-bom-name value="${esc(item.name)}" aria-label="BOM item ${index+1}" placeholder="Component">
      <input data-dm-bom-spec value="${esc([item.composition,item.specification,item.color,item.code].filter(Boolean).join(' · '))}" aria-label="Specification for ${esc(item.name)}" placeholder="Material, size, color or code">
    </div>`).join(''):`<p class="dm-no-bom">No BOM rows were readable. Add clearer source pages in a new match.</p>`;
    function renderBar(){
      const documentLabel=brief.documentType==='tech_pack'?'Tech pack':brief.documentType==='fabric_reference'?'Fabric reference':brief.documentType==='design_reference'?'Design reference':'Design document';
      bar.innerHTML=`<div class="dm-result-title"><span class="dm-mark">${IC.document}</span><div><p>Athelia Design Match <span>${documentLabel}</span></p><h1>${esc(brief.garmentType)}</h1><small>Source files are private to this browser session.</small></div><button class="btn btn-out" data-dm-new>New match</button></div>
        <div class="dm-file-strip">${files}</div>
        <details class="dm-brief-details"><summary><span>Review what Athelia read</span><small>${(brief.bomItems||[]).length} BOM items</small></summary>
        <form class="dm-brief-form" data-dm-brief><div class="dm-brief-copy"><h2>Sourcing brief</h2><p>Confirm the garment type, design notes, and BOM. Refine the recommendations with the result filters below.</p></div>
          <label class="dm-garment">Garment type<input name="garmentType" value="${esc(brief.garmentType)}"></label><label class="dm-wide">Design notes<textarea name="description">${esc(brief.description||'')}</textarea></label>
          <div class="dm-bom-editor"><div class="dm-bom-head"><b>Bill of materials</b><span>Category</span><span>Component</span><span>Specification</span></div>${bomRows()}</div>
          ${brief.unsupportedOrUnclear&&brief.unsupportedOrUnclear.length?`<p class="dm-unclear">Needs confirmation: ${brief.unsupportedOrUnclear.map(esc).join(' · ')}</p>`:''}
          <div class="dm-brief-actions"><button type="submit" class="btn btn-green">Update matches</button><a href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent('Sourcing help — '+brief.garmentType)}" class="btn btn-out">Request sourcing help</a></div>
        </form></details>`;
      bar.querySelector('[data-dm-new]').addEventListener('click',()=>{window.ARCANA_clearDesignMatch&&window.ARCANA_clearDesignMatch();window.ARCANA_openDesignMatch&&window.ARCANA_openDesignMatch();});
      bar.querySelector('[data-dm-brief]').addEventListener('submit',async event=>{
        event.preventDefault(); const form=new FormData(event.currentTarget);
        ['garmentType','description'].forEach(key=>brief[key]=String(form.get(key)||'').trim());
        brief.bomItems=[...bar.querySelectorAll('[data-dm-bom-row]')].map(row=>({
          category:row.querySelector('[data-dm-bom-category]').value,
          name:row.querySelector('[data-dm-bom-name]').value.trim(),
          specification:row.querySelector('[data-dm-bom-spec]').value.trim(),
          composition:'',color:'',code:'',
          quantity:'',unit:'',confidence:'medium'
        })).filter(item=>item.name);
        const button=bar.querySelector('[type=submit]');button.disabled=true;button.textContent='Updating…';
        const api=window.ARCANA_API; const response=api&&api.rematchDesign?await api.rematchDesign(brief):{error:{message:'unavailable'}};
        button.disabled=false;button.textContent='Update matches';
        if(response.error||!response.data||!response.data.ok){toast('Could not update supplier matches. Try again.');return;}
        match.brief=response.data.brief;match.results=response.data.results;sessionStorage.setItem('arcana_design_match',JSON.stringify(match));location.reload();
      });
    }
    const supplierCard=f=>`<a class="dm-supplier" href="supplier.html?id=${encodeURIComponent(f.id)}"><div class="dm-supplier-top"><span>${IC.factory}</span><div><b>${esc(f.name)}</b><small>${esc(f.type||'Verified supplier')} · ${esc(f.loc||f.region||'')}</small></div><em>${f.coverage||0}/${f.requirementCount||0} needs</em></div><p>${esc(f.bio||'Verified supplier matched against your design requirements.')}</p><div class="dm-supplier-meta"><span>${IC.shield} Verified</span><span>MOQ <b>${esc(f.moq||'On request')}</b></span><span>Lead <b>${esc(f.lead||'On request')}</b></span></div></a>`;
    const sourcingLink=label=>`<a href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent('Sourcing help — '+label)}">Contact our sourcing team</a>`;
    const baseCategories=results.categories||[{category:'fabrics',groups:results.fabrics||[]},{category:'trims',groups:results.trims||[]}].filter(item=>item.groups.length);
    const uniqueProducts=[...new Map(baseCategories.flatMap(item=>item.groups.flatMap(group=>group.matches||[])).map(product=>[product.id,product])).values()];
    const dmState={avail:'all',materials:new Set(),min:null,max:null,country:'all',sort:'rec'};
    const filtersActive=()=>dmState.avail!=='all'||dmState.materials.size>0||dmState.min!=null||dmState.max!=null||dmState.country!=='all';
    const numberFrom=value=>{const match=String(value||'').match(/[\d.]+/);return match?Number(match[0]):Number.POSITIVE_INFINITY;};
    const applyDesignControls=()=>baseCategories.map(category=>({...category,groups:category.groups.map(group=>{
      let matches=(group.matches||[]).filter(product=>{
        const isOem=String(product.badge||'').toLowerCase()==='oem';
        const price=Number(product.price||0);
        return (dmState.avail==='all'||(dmState.avail==='oem'&&isOem)||(dmState.avail==='nonoem'&&!isOem))&&
          (!dmState.materials.size||[...dmState.materials].some(material=>String(product.comp||'').toLowerCase().includes(material.toLowerCase())))&&
          (dmState.min==null||(price>0&&price>=dmState.min))&&(dmState.max==null||(price>0&&price<=dmState.max))&&
          (dmState.country==='all'||product.country===dmState.country);
      });
      if(dmState.sort==='price')matches.sort((a,b)=>(Number(a.price)||Infinity)-(Number(b.price)||Infinity));
      else if(dmState.sort==='moq')matches.sort((a,b)=>numberFrom(a.moq)-numberFrom(b.moq));
      else matches.sort((a,b)=>a.matchQuality===b.matchQuality?(b.matchScore||0)-(a.matchScore||0):a.matchQuality==='exact'?-1:1);
      return {...group,originalMatchCount:(group.matches||[]).length,matches};
    })}));
    const requirementSection=(category,groups,hasFilters)=>`<section class="dm-result-section" data-dm-kind="${category}"><div class="dm-section-head"><div><h2>${categoryNames[category]||category}</h2><p>Catalog matches for the related BOM requirements.</p></div><span>${groups.reduce((total,group)=>total+group.matches.length,0)} matches</span></div>${groups.length?groups.map(group=>{const exact=group.matches.filter(product=>product.matchQuality==='exact').length,partial=group.matches.length-exact,filteredEmpty=hasFilters&&!group.matches.length&&group.originalMatchCount>0;return `<div class="dm-product-group"><h3>${esc(group.requirement.name)}${group.requirement.specification?` <span>${esc(group.requirement.specification)}</span>`:''}</h3>${filteredEmpty?`<p class="dm-match-gap">No matches under these filters. <button type="button" data-dm-reset>Reset filters</button></p>`:!exact?`<p class="dm-match-gap">${partial?`No exact catalog match. Showing ${partial} relevant partial ${partial===1?'match':'matches'}.`:'No exact or relevant partial catalog match is available.'} ${sourcingLink(group.requirement.name)}</p>`:''}<div class="prod-grid">${group.matches.length?group.matches.map(product=>window.ARCANA_card(product,{href:'product.html?id='+encodeURIComponent(product.id),fabricSpec:product.cat==='fabrics'})).join(''):''}</div></div>`;}).join(''):`<p class="dm-no-match">No requirements identified.</p>`}</section>`;
    function renderResults(){
      const categories=applyDesignControls();
      const suppliers=results.suppliers||results.oems||[];
      const productCount=categories.reduce((total,item)=>total+item.groups.reduce((n,group)=>n+group.matches.length,0),0);
      const chips=[{key:'all',label:'All',count:productCount+suppliers.length},...categories.map(item=>({key:item.category,label:categoryNames[item.category]||item.category,count:item.groups.reduce((total,group)=>total+group.matches.length,0)})),{key:'suppliers',label:'OEM suppliers',count:suppliers.length}];
      grid.innerHTML=`<nav class="dm-result-filter" aria-label="Design match result types">${chips.map((chip,index)=>`<button type="button" class="${index===0?'active':''}" data-dm-filter="${chip.key}" aria-pressed="${index===0}">${esc(chip.label)} <span>${chip.count}</span></button>`).join('')}</nav>${categories.map(item=>requirementSection(item.category,item.groups,filtersActive())).join('')}<section class="dm-result-section dm-oem" data-dm-kind="suppliers"><div class="dm-section-head"><div><h2>OEM suppliers</h2><p>Verified garment manufacturers ranked against the complete design brief.</p></div><span>${suppliers.length} verified matches</span></div><div class="dm-supplier-grid">${suppliers.length?suppliers.map(supplierCard).join(''):`<p class="dm-no-match">No relevant verified OEM supplier is available. ${sourcingLink(brief.garmentType)}</p>`}</div></section>`;
      grid.querySelector('.dm-result-filter').addEventListener('click',event=>{const button=event.target.closest('[data-dm-filter]');if(!button)return;const filter=button.dataset.dmFilter;grid.querySelectorAll('[data-dm-filter]').forEach(item=>{const active=item===button;item.classList.toggle('active',active);item.setAttribute('aria-pressed',String(active));});grid.querySelectorAll('[data-dm-kind]').forEach(section=>section.hidden=filter!=='all'&&section.dataset.dmKind!==filter);});
      grid.querySelectorAll('[data-dm-reset]').forEach(button=>button.addEventListener('click',resetDesignControls));
      document.getElementById('resCount').textContent=`${productCount} product ${productCount===1?'match':'matches'}`;
      document.getElementById('mobileResCount').textContent=`${productCount} ${productCount===1?'match':'matches'}`;
      window.ARCANA_wireCards(grid);
    }
    function resetDesignControls(){
      dmState.avail='all';dmState.materials.clear();dmState.min=null;dmState.max=null;dmState.country='all';dmState.sort='rec';
      document.querySelector('[name=avail][value=all]').checked=true;
      document.querySelectorAll('#matOpts input').forEach(input=>input.checked=false);
      document.querySelectorAll('#countryOpts input').forEach(input=>input.checked=input.value==='all');
      document.getElementById('pmin').value='';document.getElementById('pmax').value='';
      document.querySelectorAll('[data-quick-avail]').forEach(button=>button.classList.toggle('on',button.dataset.quickAvail==='all'));
      document.querySelectorAll('.sort-chip,[data-quick-sort]').forEach(button=>button.classList.toggle('on',(button.dataset.sort||button.dataset.quickSort)==='rec'));
      renderResults();
    }
    function setupDesignControls(){
      document.querySelector('.filter-rail').style.display='';
      document.querySelector('.sortbar').style.display='';
      document.querySelector('.mobile-list-tools').style.display='';
      listing.style.display='';
      document.querySelector('[data-sort=new]').hidden=true;
      document.getElementById('regionBlock').style.display='none';
      const certBlock=[...document.querySelectorAll('.frl-block')].find(block=>block.querySelector('[data-i18n="cat.certs"]'));if(certBlock)certBlock.hidden=true;
      const materials=[...new Set(uniqueProducts.flatMap(product=>String(product.comp||'').split(/[,/·]/).map(value=>value.trim()).filter(Boolean)))].sort();
      document.getElementById('matOpts').innerHTML=materials.map(material=>`<label class="frl-opt"><input type="checkbox" value="${esc(material)}"> ${esc(material)}</label>`).join('')||'<span class="cnt">No material facets</span>';
      const countries=[...new Set(uniqueProducts.map(product=>product.country).filter(Boolean))].sort();
      document.getElementById('countryOpts').innerHTML=`<label class="frl-opt"><input type="radio" name="country" value="all" checked> All</label>${countries.map(country=>`<label class="frl-opt"><input type="radio" name="country" value="${esc(country)}"> ${esc(country)}</label>`).join('')}`;
      document.querySelectorAll('[name=avail]').forEach(input=>input.addEventListener('change',()=>{dmState.avail=input.value;renderResults();}));
      document.querySelectorAll('#matOpts input').forEach(input=>input.addEventListener('change',()=>{input.checked?dmState.materials.add(input.value):dmState.materials.delete(input.value);renderResults();}));
      document.querySelectorAll('#countryOpts input').forEach(input=>input.addEventListener('change',()=>{dmState.country=input.value;renderResults();}));
      ['pmin','pmax'].forEach(id=>document.getElementById(id).addEventListener('change',event=>{dmState[id==='pmin'?'min':'max']=event.target.value===''?null:Number(event.target.value);renderResults();}));
      document.querySelectorAll('.sort-chip:not([hidden]),[data-quick-sort]:not([hidden])').forEach(button=>button.addEventListener('click',()=>{dmState.sort=button.dataset.sort||button.dataset.quickSort;document.querySelectorAll('.sort-chip,[data-quick-sort]').forEach(item=>item.classList.toggle('on',(item.dataset.sort||item.dataset.quickSort)===dmState.sort));renderResults();}));
      document.querySelectorAll('[data-quick-avail]').forEach(button=>button.addEventListener('click',()=>{dmState.avail=button.dataset.quickAvail;document.querySelectorAll('[data-quick-avail]').forEach(item=>item.classList.toggle('on',item===button));const input=document.querySelector(`[name=avail][value="${dmState.avail}"]`);if(input)input.checked=true;renderResults();}));
      document.getElementById('clearFilters').addEventListener('click',event=>{event.preventDefault();resetDesignControls();});
    }
    renderBar();setupDesignControls();renderResults();
  }

  // ---- Copilot SRP ----
  if(pageMode==='copilot-srp'){ return runCopilot(); }

  function runCopilot(){
    const Cop=window.ARCANA_Copilot;

    // Copilot is a signed-in perk (basic catalog search stays open to everyone).
    // Defense in depth: components.js already gates the entry points that link
    // here, but a direct/shared ?copilot=1 link must be gated too.
    if(!Store.session()){
      document.querySelector('.filter-rail').style.display='none';
      document.querySelector('.sortbar').style.display='none';
      document.querySelector('.listing').style.display='block';
      const grid=document.getElementById('grid'); grid.className='';
      grid.innerHTML=`<div class="panel cart-empty cop-invite" style="max-width:520px;margin:40px auto">
        <div class="cop-gate-art" style="margin:0 auto 20px"><img src="${ASSET('copilot-gate.webp')}" alt="" width="168" height="168" loading="lazy"></div>
        <h3>Sign in to use Athelia</h3>
        <p>Athelia matches your brief against every verified SKU in the catalog and explains why. It's free for brand owners — sign in or create an account to see your ranked results.</p>
        <div style="display:flex;gap:12px;justify-content:center">

  const routeL3=categoriesAt>=0 ? routeParts[categoriesAt+2] : '';
  let cat=(qsAll.get('l2')||qsAll.get('cat')||routeL2||'').toLowerCase(); if(!META[cat])cat='fabrics';

  // L2 names the category; L3 names the selected material family. Keeping

  // the correct family until their structured fields are completed.
  const l3Terms={cotton:['cotton'],linen:['linen'],polyester:['polyester'],viscose:['viscose','rayon','modal','cupro'],knits:['knit','jersey','rib','fleece'],denim:['denim','indigo'],zippers:['zipper'],buttons:['button'],labels:['label','tag','patch','badge'],hardware:['hardware','grommet','rivet','buckle','hook','logo plate'],interlining:['interlining'],lining:['lining'],"simple-trims":['tape','ribbon','elastic','lace','bias','cord','piping'],wool:['wool','merino','cashmere'],nylon:['nylon'],clothing:['jacket','shirt','garment','apparel','clothing'],accessories:['bag','accessor','wallet','glove','hat'],socks:['sock','hosiery']};
  const productSearchText=p=>[p.name,p.comp,p.spec,p.description,p.subcategory,p.construction,p.applications,p.color_family,p.style_code].filter(Boolean).join(' ').toLowerCase();
  // Marketplace search is deliberately plain text: no operators, no hidden

  const requestedPage=Math.max(1,Number(qsAll.get('page'))||1);

  const regionOf=p=>{const parts=String(p.loc||'').split(',').map(s=>s.trim().replace(/\s*\(.*?\)/g,''));return parts.length>=3?parts[parts.length-2]:parts[0];};

      const useSupplierMark=cat==='oem'&&!window.ATELIX_factoryHasLinkedProducts(f);
      const useLogo=useSupplierMark&&Boolean(f.logo_img);
      const initials=name.split(/\s+/).filter(Boolean).slice(0,2).map(word=>word[0]).join('').toUpperCase();
      const media=useSupplierMark
        ? (useLogo?`<img src="${esc(window.ATELIX_factoryAsset(f))}" alt="${esc(name)}" loading="lazy">`:`<span class="factory-card-initials" aria-hidden="true">${esc(initials)}</span>`)
        : `<img src="${esc(window.ATELIX_factoryCardAsset(f))}" alt="${esc(name)}" loading="lazy">`;
      return `<a class="fcard" href="/pages/supplier.html?id=${encodeURIComponent(f.id)}">
        <div class="fthumb${useSupplierMark?' fthumb-logo':''}">${media}<span class="fveric">${IC.shield} ${T('Verified')}</span></div>
        <div class="fbody"><div class="fname">${esc(name)}</div><span class="ftype">${esc(type)}</span>
        <div class="floc">${IC.pin}<span>${esc(window.ATELIX_factoryLocation(f)||T('Contact supplier'))}</span></div>
        <div class="ffoot"><div>MOQ<b>${esc(window.ATELIX_publicValue(f.moq))}</b></div><div>${T('Lead Time')}<b>${esc(window.ATELIX_publicValue(f.lead))}</b></div></div>
        <span class="btn btn-out btn-block">${T('View supplier')}</span></div></a>`;
    };
    const cardHtml=[...list.map(p=>window.ARCANA_card(p,{href:'/pages/product.html?id='+p.id, fabricSpec:isFabric})),...supplierList.map(supplierCard)].join('');
    const emptyForL3=!!l3&&(remotePage?resultTotal===0:items.length===0)&&supplierItems.length===0;
    grid.innerHTML = resultCount
      ? cardHtml
      : emptyForL3
        ? `<section class="catalog-empty"><span aria-hidden="true">⌁</span><h2>No ${heTitle.toLowerCase()} listed yet</h2><p>Verified suppliers have not listed this material family yet. Browse the wider category or tell us what you need.</p><div><a class="btn btn-out" href="/categories/${cat}">Browse all ${TR(meta.title).toLowerCase()}</a><a class="btn btn-green" href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent(`Sourcing request: ${heading}`)}">Request sourcing</a></div></section>`
        : `<section class="catalog-empty"><span aria-hidden="true">⌁</span><h2>No matching ${meta.noun}</h2><p>Try a different quick filter to see more verified supplier listings.</p><button class="btn btn-out" type="button" id="reset2">Reset filters</button></section>`;

    window.ARCANA_wireCards(grid);
    if(oemMaterialSources){
      const showMaterials=cat==='oem'&&!l3;
      oemMaterialSources.hidden=!showMaterials;
      if(showMaterials){
        const materialList=window.ARCANA_PRODUCTS.filter(isRecentlyListed).slice(0,6);
        oemMaterialSources.innerHTML=`<div class="sec-head"><div><h2 id="oem-material-sources-title">Material partners for OEM projects</h2><p class="muted" style="margin-top:5px">Source fabrics and components separately from your finished-goods manufacturer.</p></div><a class="link-arrow" href="/categories/fabrics">Browse all materials ${IC.chevR}</a></div><div class="prod-grid">${materialList.map(p=>window.ARCANA_card(p,{href:'/pages/product.html?id='+p.id})).join('')}</div>`;
        window.ARCANA_wireCards(oemMaterialSources);
      }
    }
    const r2=document.getElementById('reset2'); if(r2) r2.addEventListener('click',e=>{e.preventDefault();resetAll();});
  }

  function resetAll(){ avail='all'; sort='rec'; mat=[]; pmin=pmax=null; country='all'; regionSel=[];
    document.querySelector('[name=avail][value=all]').checked=true;
    document.querySelectorAll('#matOpts input').forEach(c=>c.checked=false);
    document.getElementById('pmin').value=''; document.getElementById('pmax').value='';
    document.querySelectorAll('.sort-chip,[data-quick-sort]').forEach(c=>c.classList.toggle('on',(c.dataset.sort||c.dataset.quickSort)==='rec'));
    const allCtry=document.querySelector('[name=ctry][value=all]'); if(allCtry) allCtry.checked=true;
    populateRegions();
    refreshRemote(1);
  }

  document.querySelectorAll('[name=avail]').forEach(r=>r.addEventListener('change',()=>{avail=r.value;refreshRemote(1);}));
  document.querySelectorAll('[data-quick-avail]').forEach(chip=>chip.addEventListener('click',()=>{
    avail=chip.dataset.quickAvail;
    const radio=document.querySelector(`[name=avail][value="${avail}"]`);
    if(radio) radio.checked=true;
    document.querySelectorAll('[data-quick-avail]').forEach(item=>item.classList.toggle('on',item===chip));
    refreshRemote(1);
  }));
  document.getElementById('matOpts').addEventListener('change',()=>{mat=[...document.querySelectorAll('#matOpts input:checked')].map(c=>c.value);refreshRemote(1);});
  document.getElementById('countryOpts').addEventListener('change',e=>{
    const r=e.target; if(r.name==='ctry'){country=r.value;populateRegions();refreshRemote(1);}
  });
  document.getElementById('regionOpts').addEventListener('change',()=>{regionSel=[...document.querySelectorAll('#regionOpts input:checked')].map(c=>c.value);refreshRemote(1);});
  let priceTimer=null;
  const refreshPrice=()=>{clearTimeout(priceTimer);priceTimer=setTimeout(()=>refreshRemote(1),250);};
  document.getElementById('pmin').addEventListener('input',e=>{pmin=e.target.value?+e.target.value:null;refreshPrice();});
  document.getElementById('pmax').addEventListener('input',e=>{pmax=e.target.value?+e.target.value:null;refreshPrice();});
  document.querySelectorAll('.sort-chip,[data-quick-sort]').forEach(c=>c.addEventListener('click',()=>{sort=c.dataset.sort||c.dataset.quickSort;document.querySelectorAll('.sort-chip,[data-quick-sort]').forEach(x=>x.classList.toggle('on',(x.dataset.sort||x.dataset.quickSort)===sort));refreshRemote(1);}));
  pagination.addEventListener('click',event=>{const button=event.target.closest('[data-catalog-page]');if(button&&!button.disabled)refreshRemote(Number(button.dataset.catalogPage));});
  document.getElementById('clearFilters').addEventListener('click',e=>{e.preventDefault();resetAll();});
  render();
  window.ARCANA_onLang(render);
};
</script>
</body>
</html>
