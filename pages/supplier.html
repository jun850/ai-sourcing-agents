<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Supplier Profile — ARCANA</title>
<meta name="description" content="Explore a verified factory's capabilities, certifications, MOQ, lead time and catalog, and contact them directly on ARCANA.">
<link rel="canonical" href="https://marketplace-three-peach.vercel.app/pages/supplier.html">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="ARCANA">
<meta property="og:title" content="Verified Supplier Profile — ARCANA">
<meta property="og:description" content="A verified factory's capabilities, certifications, MOQ, lead time and catalog on ARCANA.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Verified Supplier Profile — ARCANA">
<meta name="twitter:description" content="A verified factory's capabilities, certifications, MOQ, lead time and catalog on ARCANA.">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
<style>.map-svg{position:absolute;inset:0;width:100%;height:100%}</style>
</head>
<body data-catalog data-root=".." data-search="Search fabrics, trims, accessories, factories…">
<div id="hdr"></div>
<main class="wrap"><div id="supRoot"></div><div style="height:40px"></div></main>
<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/copilot.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script>
window.ARCANA_PAGE = function({ASSET,IC,Store,toast}){
  const FMAP=window.ARCANA_FACTORY_MAP, PRODUCTS=window.ARCANA_PRODUCTS;
  const DEAL=Object.fromEntries((window.ARCANA_DEALS||[]).map(d=>[d.id,d]));
  const money=n=>'US$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const rnd=(id,a,b)=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return a+(h%(Math.round((b-a)*10)+1))/10;};
  const soldOf=id=>['500+','1rb+','2rb+','5rb+','800+'][id.charCodeAt(4)%5];

  let id=new URLSearchParams(location.search).get('id'); if(!FMAP[id]) id=Object.keys(FMAP)[0];
  const f=FMAP[id];
  document.title = (f ? f.name : 'Supplier') + ' — ARCANA';
  const initials=f.name.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

  const own=PRODUCTS.filter(p=>p.seller===f.name);
  const feat=(own.length?own:PRODUCTS.filter(p=>p.cat==='fabrics')).slice(0,5);

  const card=x=>window.ARCANA_card(x,{href:'product.html?id='+x.id, shop:false});

  const capIcons=['M4 4h16v16H4zM4 9h16M4 14h16M9 4v16M14 4v16','M12 3s5 6 5 10a5 5 0 0 1-10 0c0-4 5-10 5-10z','M4 7h16v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z','M11 4a7 7 0 1 0 0 14'];
  const caps=[['Weaving','Advanced looms for a wide range of constructions.',f.capacity],['Dyeing','Eco-friendly yarn & piece dyeing.','800K m/mo'],['Finishing','Functional & aesthetic treatments.','900K m/mo'],['Inspection','4-stage QC to AQL 2.5 standard.',f.certs.join(', ')]];

  document.getElementById('supRoot').innerHTML=`
  <nav class="crumbs"><a href="../index.html">Home</a>${IC.chevR}<a href="factories.html">Factories</a>${IC.chevR}<span class="cur">${f.name}</span></nav>
  <div class="sup-hero">
    <section class="panel sup-main">
      <div class="sup-top">
        <div class="sup-name">
          <h1>${f.name}${f.verified?`<span class="verified-mark" title="Verified Factory" aria-label="Verified Factory">${IC.check}</span>`:''}</h1>
          <div class="role">${f.type} · ${f.loc}</div>
          <p class="bio">${f.bio}</p>
          <div class="sup-tags">${f.tags.map(t=>`<span class="pill-tag">${t}</span>`).join('')}${f.certs.map(c=>`<span class="pill-tag">${c}</span>`).join('')}</div>
        </div>
        <div class="sup-contact" style="min-width:230px">
          <div class="sc-row"><span class="ci">${IC.user}</span><div><span>Sales Contact</span><b>${f.sales}</b><div class="muted" style="font-size:12px">${f.phone}</div></div></div>
          <div class="sc-row"><span class="ci">${IC.globe}</span><div><span>Website</span><b>${f.web}</b></div></div>
          <div class="sc-row"><span class="ci">${IC.factory}</span><div><span>Business Type</span><b>${f.type}</b></div></div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><span>MOQ</span><b>${f.moq}</b></div>
        <div class="metric"><span>Lead Time</span><b>${f.lead}</b></div>
        <div class="metric"><span>Rating</span><b>★ ${f.rating.toFixed(1)}</b></div>
        <div class="metric"><span>Orders</span><b>${f.orders}</b></div>
        <div class="metric"><span>In Business</span><b>${f.years} yrs</b></div>
      </div>
      <div class="sup-actions">
        <button class="btn btn-green" data-toast="Message sent to ${f.name}">${IC.msg||''} Contact Supplier</button>
        <button class="btn btn-out fav" data-fac-fav>${IC.bookmark} Save Supplier</button>
        <button class="btn btn-out" data-share>Share</button>
      </div>
    </section>
    <section class="panel map-panel">
      <h3>Factory Location</h3>
      <div class="map-box">
        <svg class="map-svg" viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice"><rect width="400" height="210" fill="#eef1ec"/><path d="M250 0 L285 40 L300 90 L285 140 L320 210 L400 210 L400 0 Z" fill="#cfe0ec"/><path d="M0 60 Q90 55 150 90 T280 120" stroke="#dcdcd2" stroke-width="2" fill="none"/><path d="M120 20 L200 100 L160 200" stroke="#e2c9a0" stroke-width="2" fill="none"/></svg>
        <div class="pin" style="left:56%;top:52%"><div style="background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;display:flex;gap:8px;align-items:center"><span style="color:var(--green)"><svg viewBox="0 0 24 24" fill="var(--green)" width="18" height="18"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/></svg></span><span style="font-size:12px"><b>${f.name}</b><br><span class="muted">${f.loc}</span></span></div></div>
      </div>
      <div class="map-facts">
        <div class="map-fact">${IC.pin}<span>Region</span><b>${f.region}</b></div>
        <div class="map-fact">${IC.factory}<span>Factory Area</span><b>${f.area}</b></div>
        <div class="map-fact">${IC.user}<span>Employees</span><b>${f.employees}</b></div>
      </div>
    </section>
  </div>

  <section class="panel capabilities">
    ${caps.map((c,i)=>`<div class="cap"><span class="cap-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="${capIcons[i]}"/></svg></span><h4>${c[0]}</h4><p>${c[1]}</p><div class="cap-cap">Capacity<b>${c[2]}</b></div></div>`).join('')}
  </section>

  <div class="feat-fabrics">
    <section class="panel" style="padding:26px 28px">
      <div class="sec-head" style="margin-bottom:20px"><h2 style="font-family:var(--serif);font-size:24px;font-weight:600">Products from this factory</h2><a class="link-arrow" href="category.html?cat=${feat[0]?feat[0].cat:'fabrics'}">View all ${IC.chevR}</a></div>
      <div class="prod-grid">${feat.map(card).join('')}</div>
    </section>
    <aside class="panel overview">
      <h3>Company Overview</h3>
      <p>${f.bio}</p>
      <div style="margin-top:16px">
        <div class="ov-row" style="border:0">${IC.factory}<span class="k">Factory Area</span><span class="v">${f.area}</span></div>
        <div class="ov-row">${IC.user}<span class="k">Employees</span><span class="v">${f.employees}</span></div>
        <div class="ov-row">${IC.medal}<span class="k">Established</span><span class="v">${f.founded}</span></div>
        <div class="ov-row">${IC.globe}<span class="k">Main Region</span><span class="v">${f.region}</span></div>
      </div>
      <button class="btn btn-green btn-block" style="margin-top:18px" data-toast="Message sent to ${f.name}">Contact this factory</button>
    </aside>
  </div>`;

  // interactions
  const facFav=document.querySelector('[data-fac-fav]'); facFav.classList.toggle('on',Store.isSaved(f.id));
  facFav.addEventListener('click',()=>{const on=Store.toggleSaved(f.id);facFav.classList.toggle('on',on);toast(on?'Supplier saved':'Removed');});
  document.querySelector('[data-share]').addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);toast('Factory link copied');});
  document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',()=>toast(b.dataset.toast)));
  window.ARCANA_wireCards(document.querySelector('.prod-grid'));
};
</script>
</body>
</html>
