version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace
    ports:
      - "8090:8090"
    environment:
      - NODE_ENV=production
      - PORT=8090
    volumes:
      - ./js:/app/js
      - ./pages:/app/pages
      - ./css:/app/css
      - ./categories:/app/categories
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8090', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
