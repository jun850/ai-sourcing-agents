<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCANA</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-hdr="b" data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap">
  <nav class="crumbs"><a href="../index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span class="cur">Cart</span></nav>

  <div id="cartRoot"></div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/copilot.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script>
window.ARCANA_PAGE = function({ASSET,IC,Store,toast}){
  const M=window.ARCANA_PRODUCT_MAP, root=document.getElementById('cartRoot');
  const money=n=>window.ARCANA_money(n);
  const TR=window.ARCANA_TR, T=window.ARCANA_T;

  function render(){
    const cart=Store.cart().filter(i=>M[i.id]);
    if(!cart.length){
      root.innerHTML=`<div class="panel cart-empty">
        <span class="ce-ic">${IC.cart}</span>
        <h3>${T('Your cart is empty')}</h3>
        <p>${T('Browse verified fabrics and OEM services to start your next collection.')}</p>
        <a class="btn btn-green" href="category.html">${T('Browse fabrics')}</a>
      </div>`;
      return;
    }
    const rows=cart.map(i=>{const p=M[i.id];const sub=p.price*i.qty;return `
      <div class="cart-line" data-row="${p.id}">
        <img src="${ASSET(p.img+'.webp')}" alt="${TR(p.name)}">
        <div class="cl-info">
          <h4><a href="product.html?id=${p.id}">${TR(p.name)}</a></h4>
          <div class="m">${TR(p.comp)} · ${TR(p.spec)}</div>
          <div class="seller">${IC.factory}${TR(p.seller)} · ${TR(p.loc)}</div>
        </div>
        <div class="qty" data-qty data-id="${p.id}"><button data-dec aria-label="Decrease">−</button><input value="${i.qty}" inputmode="numeric" aria-label="${T('Quantity')}"><button data-inc aria-label="Increase">+</button></div>
        <div class="cl-price">${money(p.price)}<small>/${TR(p.unit)}</small></div>
        <div style="text-align:right"><div class="cl-price">${money(sub)}</div><a class="ci-remove" href="#" data-remove="${p.id}">${T('Remove')}</a></div>
      </div>`;}).join('');

    const subtotal=cart.reduce((s,i)=>s+M[i.id].price*i.qty,0);
    const fee=+(subtotal*0.05).toFixed(2), ship=120;
    const ad=Store.addons();
    const rates=window.ARCANA_addonRates(subtotal);
    const qcAmt=+(subtotal*rates.qc).toFixed(2), insAmt=+(subtotal*rates.ins).toFixed(2);
    const qcFee=ad.qc?qcAmt:0, insFee=ad.ins?insAmt:0;
    const total=subtotal+fee+ship+qcFee+insFee;

    root.innerHTML=`<div class="cart-wrap">
      <div>
        <section class="panel" style="padding:24px 26px">
          <h3 style="font-family:var(--serif);font-size:24px;font-weight:600">${T('Your Cart')} <span class="muted" style="font-size:15px;font-family:var(--sans)">(${cart.length} ${T(cart.length===1?'item':'items')})</span></h3>
          <div style="margin-top:8px">${rows}</div>
          <div class="cart-actions"><a class="add-pkg" href="category.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg> ${T('Continue shopping')}</a></div>
        </section>

        <section class="panel addon-panel" style="padding:22px 26px;margin-top:20px">
          <div class="sec-title" style="margin-bottom:14px"><span class="ti">${IC.shield}</span><h2 style="font-family:var(--serif);font-size:20px;font-weight:600">${T('Add-on services')}</h2></div>
          <label class="addon${ad.qc?' on':''}"><input type="checkbox" data-addon="qc" ${ad.qc?'checked':''}>
            <span class="ad-body"><b>${T('ARCANA QC Inspection')} <span class="ad-tag">${T('recommended')}</span></b><span>${T('Independent quality check by ARCANA before dispatch')}</span></span>
            <span class="ad-fee">+${money(qcAmt)}</span></label>
          <label class="addon${ad.ins?' on':''}"><input type="checkbox" data-addon="ins" ${ad.ins?'checked':''}>
            <span class="ad-body"><b>${T('Shipment Insurance')}</b><span>${T('Covers loss or damage in transit')}</span></span>
            <span class="ad-fee">+${money(insAmt)}</span></label>
        </section>
      </div>
      <aside>
        <section class="panel summary" style="position:sticky;top:88px">
          <h3>${T('Order Summary')}</h3>
          <div class="sum-row"><span class="k">${T('Subtotal')}</span><span>${money(subtotal)}</span></div>
          <div class="sum-row"><span class="k">${T('Service fee (5%)')}</span><span>${money(fee)}</span></div>
          ${qcFee?`<div class="sum-row"><span class="k">${T('QC Inspection')} (${rates.qc*100}%)</span><span>${money(qcFee)}</span></div>`:''}
          ${insFee?`<div class="sum-row"><span class="k">${T('Insurance')} (${rates.ins*100}%)</span><span>${money(insFee)}</span></div>`:''}
          <div class="sum-row"><span class="k">${T('Estimated shipping')}</span><span>${money(ship)}</span></div>
          <div class="promo"><input placeholder="${T('Promo code')}"><button class="btn btn-out" data-promo-btn>${T('Apply')}</button></div>
          <div class="total-box"><div class="lbl">${T('Total')}</div><div class="amt">${money(total)}<small>${T('Taxes may apply at checkout')}</small></div></div>
          <button class="btn btn-gold btn-block" style="margin-top:16px;padding:15px" data-checkout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> ${T('Proceed to Checkout')}</button>
          <div class="secure-note"><span>${IC.shield} ${T('Secure checkout')}</span> · <span>${T('SSL encrypted')}</span></div>
        </section>
      </aside>
    </div>`;

    // wire dynamic controls
    root.querySelectorAll('[data-qty]').forEach(q=>{
      const id=q.dataset.id, inp=q.querySelector('input');
      const commit=v=>{Store.setQty(id,v);render();};
      q.querySelector('[data-dec]').onclick=()=>commit(Math.max(1,(+inp.value||1)-1));
      q.querySelector('[data-inc]').onclick=()=>commit((+inp.value||1)+1);
      inp.onchange=()=>commit(Math.max(1,parseInt(inp.value)||1));
    });
    root.querySelectorAll('[data-addon]').forEach(c=>c.addEventListener('change',()=>{Store.setAddon(c.dataset.addon,c.checked);render();}));
    root.querySelectorAll('[data-remove]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();Store.remove(a.dataset.remove);toast(T('Item removed'));render();}));
    root.querySelector('[data-promo-btn]').addEventListener('click',()=>toast('Promo codes apply at checkout'));
    root.querySelector('[data-checkout]').addEventListener('click',()=>location.href='checkout.html');
  }
  render();
  window.ARCANA_onLang(render);
};
</script>
</body>
</html>
