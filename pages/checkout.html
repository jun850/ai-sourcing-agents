<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Atelix</title>
<meta name="description" content="Review shipping details and submit an Atelix sourcing order.">
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-catalog data-hdr="b" data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap" style="padding-bottom:40px">
  <nav class="crumbs"><a href="../index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><a href="cart.html">Cart</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span class="cur">Checkout</span></nav>
  <div id="coRoot"></div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script>
window.ARCANA_PAGE = async function({ASSET,IC,Store,toast}){
  const M=window.ARCANA_PRODUCT_MAP, root=document.getElementById('coRoot');
  const money=n=>window.ARCANA_money(n);
  const productMoney=(p,qty=1)=>window.ATELIX_productMoney(p,qty);
  const productAmount=(p,qty=1)=>window.ATELIX_productAmount(p,qty);
  const currencyMoney=n=>window.ATELIX_currencyMoney(n);
  const TR=window.ARCANA_TR, T=window.ARCANA_T;
  const text=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const optionSummary=item=>Object.entries(item.options||{}).map(([name,value])=>`${text(name)}: ${text(value)}`).join(' · ');
  const cart=Store.cart().filter(i=>M[i.id]);
  cart.forEach(i=>{
    const minimum=Math.max(1,Math.ceil(Number.parseFloat(M[i.id].moq)||1));
    if(i.qty<minimum){i.qty=minimum;Store.setQty(i.key||i.id,minimum);}
  });
  const subtotal=cart.reduce((sum,item)=>sum+productAmount(M[item.id],item.qty),0);
  const fee=+(subtotal*0.05).toFixed(2);
  const total=subtotal+fee;
  let step=1;
  const terms={name:'',company:'',addr:'',city:'',country:''};

  if(!cart.length){
    root.innerHTML=`<div class="panel cart-empty"><span class="ce-ic">${IC.cart}</span><h1>${T('Nothing to check out')}</h1><p>${T('Your cart is empty.')}</p><a class="btn btn-green" href="/categories/fabrics">${T('Browse fabrics')}</a></div>`;
    return;
  }
  if(cart.some(item=>M[item.id].pricingMode==='quote'||!(M[item.id].price>0))){
    root.innerHTML=`<div class="panel cart-empty"><span class="ce-ic">${IC.msg}</span><h1>${T('Contact supplier')}</h1><p>${T('Volume pricing shared on quote')}</p><a class="btn btn-green" href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent('Quote request from cart')}">${T('Contact supplier')}</a><a class="btn btn-out" href="cart.html">${T('View cart')}</a></div>`;
    return;
  }

  // Checkout requires a signed-in buyer because place_order is account-scoped.
  const profile = await window.ARCANA_API.getSessionProfile();
  if(!profile){
    root.innerHTML=`<div class="panel cart-empty" style="max-width:520px;margin:0 auto">
      <span class="ce-ic">${IC.lock}</span>
      <h1>Log in to check out</h1>
      <p>Sign in to your Atelix account to submit this order. Your cart is saved.</p>
      <a class="btn btn-green" href="login.html?next=checkout.html">Log in to continue</a>
      <p style="margin-top:14px;font-size:.9375rem;color:var(--muted)">New to Atelix? <a href="signup.html" style="color:var(--green);font-weight:600">Create an account</a></p>
    </div>`;
    return;
  }
  if(!terms.company && profile.name) terms.company = profile.name;

  const summaryRail=()=>`<aside><section class="panel summary" style="position:sticky;top:88px">
    <h3>${T('Order Summary')}</h3>
    ${cart.map(i=>{const p=M[i.id],options=optionSummary(i);return `<div class="sum-row"><span class="k">${text(TR(p.name))} × ${i.qty}${options?`<small class="checkout-options">${options}</small>`:''}</span><span>${productMoney(p,i.qty)}</span></div>`}).join('')}
    <div class="sum-row strong"><span class="k">${T('Subtotal')}</span><span>${currencyMoney(subtotal)}</span></div>
    <div class="sum-row"><span class="k">${T('Service fee')}</span><span>${currencyMoney(fee)}</span></div>
    <div class="sum-row"><span class="k">${T('Shipping')}</span><span>Quoted separately</span></div>
    <div class="total-box"><div class="lbl">${T('Total')}</div><div class="amt">${currencyMoney(total)}<small>${T('Taxes may apply')}</small></div></div>
    <div class="secure-note" style="margin-top:14px"><span>${IC.lock} Order details are sent over an encrypted connection</span></div>
  </section></aside>`;

  const stepper=()=>{const items=[['Shipping',1],['Review & Place',2]];
    return `<div class="stepper">${items.map((it,idx)=>{const n=it[1];const cls=step>n?'done':step===n?'active':'';
      return `<div class="step ${cls}"><span class="sn">${step>n?'✓':n}</span>${it[0]}</div>${idx<items.length-1?'<span class="step-line"></span>':''}`;}).join('')}</div>`;}

  function view(){
    root.innerHTML=`${stepper()}<div class="co-wrap"><div class="panel co-panel" id="stepPanel"></div>${summaryRail()}</div>`;
    const panel=document.getElementById('stepPanel');
    if(step===1) panel.innerHTML=stepShipping();
    if(step===2) panel.innerHTML=stepReview();
    bind();
  }

  const stepShipping=()=>`
    <h2>Shipping</h2><p class="ph">Where should this order ship?</p>
    <div class="co-grid">
      <div class="field-lg full" data-field><label>Contact name</label><input data-t="name" value="${terms.name}" placeholder="Jessica Smith"><span class="err">Required.</span></div>
      <div class="field-lg full" data-field><label>Company</label><input data-t="company" value="${terms.company}" placeholder="Luxe Apparel Co."><span class="err">Required.</span></div>
      <div class="field-lg full" data-field><label>Ship-to address</label><input data-t="addr" value="${terms.addr}" placeholder="Street, building, unit"><span class="err">Required.</span></div>
      <div class="field-lg" data-field><label>City</label><input data-t="city" value="${terms.city}" placeholder="New York"><span class="err">Required.</span></div>
      <div class="field-lg" data-field><label>Country</label><input data-t="country" value="${terms.country}" autocomplete="country-name" placeholder="Destination country"><span class="err">Required.</span></div>
    </div>
    <div class="co-nav"><a class="btn btn-out" href="cart.html">Back to cart</a><button class="btn btn-green" data-next>Continue to review</button></div>`;

  const stepReview=()=>`
    <h2>Review &amp; place order</h2><p class="ph">Check everything is right before you place the order.</p>
    <div class="co-review">
      <div class="co-rev-block"><div class="rt"><b>Items (${cart.length})</b></div>
        ${cart.map(i=>{const p=M[i.id],options=optionSummary(i);return `<div class="rl" style="display:flex;justify-content:space-between"><span>${text(p.name)} × ${i.qty} · ${text(p.seller)}${options?`<small class="checkout-options">${options}</small>`:''}</span><span>${productMoney(p,i.qty)}</span></div>`}).join('')}</div>
      <div class="co-rev-block"><div class="rt"><b>Shipping</b><button class="edit" type="button" data-goto="1">Edit</button></div>
        <div class="rl">${terms.name||'—'}, ${terms.company||'—'}<br>${terms.addr||'—'}, ${terms.city||''} ${terms.country}</div></div>
      <div class="co-rev-block"><div class="rt"><b>Payment</b></div>
        <div class="rl">Verified payment instructions will appear on the order page when they are available. Do not transfer funds using details received through an unverified message.</div></div>
    </div>
    <div class="co-nav"><button class="btn btn-out" data-back>Back</button><button class="btn btn-gold" data-place><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> Place order · ${currencyMoney(total)}</button></div>`;

  async function placeOrder(){
    const place=root.querySelector('[data-place]');
    const orig = place ? place.innerHTML : '';
    if(place){ place.disabled=true; place.textContent='Placing order…'; }
    const shipAddress=[terms.name,terms.company,terms.addr,terms.city].filter(Boolean).join(', ');
    const { orderNo, error } = await window.ARCANA_API.placeOrder({
      items: cart.map(i=>({id:i.id,qty:i.qty,key:i.key||i.id,options:i.options||{}})),
      shipCountry: terms.country,
      shipAddress,
      notes: null,
      qc: false, insurance: false
    });
    if(error || !orderNo){
      const msg=(error && error.message) || 'Please try again.';
      toast(`Could not place order — ${msg}`);
      if(place){ place.disabled=false; place.innerHTML=orig; }
      return;
    }
    // place_order cleared the DB cart server-side; clear the local mirror too.
    Store.clearCart();
    location.href='order.html?no='+encodeURIComponent(orderNo);
  }

  function bind(){
    root.querySelectorAll('[data-t]').forEach(el=>el.addEventListener('input',()=>terms[el.dataset.t]=el.value));
    const nextBtn=root.querySelector('[data-next]');
    if(nextBtn) nextBtn.addEventListener('click',()=>{
      if(step===1){ let ok=true;
        root.querySelectorAll('[data-field]').forEach(f=>{const inp=f.querySelector('[data-t]');if(!inp)return;const req=['name','company','addr','city','country'].includes(inp.dataset.t);const bad=req&&!inp.value.trim();f.classList.toggle('invalid',bad);if(bad)ok=false;});
        if(!ok){toast('Please complete the required fields');return;}
      }
      step++; view();
    });
    const backBtn=root.querySelector('[data-back]'); if(backBtn) backBtn.addEventListener('click',()=>{step--;view();});
    root.querySelectorAll('[data-goto]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();step=+a.dataset.goto;view();}));
    const place=root.querySelector('[data-place]'); if(place) place.addEventListener('click',placeOrder);
  }
  view();
};
</script>
</body>
</html>
