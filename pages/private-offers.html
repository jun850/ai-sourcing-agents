<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Private offers — Atelix</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body data-root=".." data-catalog>
    <div id="hdr"></div>
    <main class="wrap private-offers">
      <nav class="crumbs">
        <a href="../index.html">Home</a
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="m9 6 6 6-6 6" /></svg
        ><span class="cur">Private offers</span>
      </nav>
      <header>
        <p class="directory-eyebrow">Shared directly with your brand</p>
        <h1>Private sourcing offers</h1>
        <p>
          Custom products and OEM packages assigned specifically to your
          account.
        </p>
      </header>
      <div id="privateOffersGrid" class="prod-grid" aria-live="polite"></div>
    </main>
    <div id="ftr"></div>
    <script src="../js/data.js"></script>
    <script src="../js/components.js"></script>
    <script defer src="../js/analytics.bundle.js"></script>
    <script src="../js/supabase-client.bundle.js"></script>
    <script src="../js/api.js"></script>
    <script>
      window.ARCANA_PAGE = async function () {
        const api = window.ARCANA_API,
          grid = document.getElementById("privateOffersGrid"),
          profile = await api.getSessionProfile();
        if (!profile) {
          grid.innerHTML =
            '<div class="panel private-offers-empty"><h2>Log in to view private offers</h2><p>Private custom products are available only to the brand accounts they are assigned to.</p><a class="btn btn-green" href="login.html?next=private-offers.html">Log in</a></div>';
          return;
        }
        const result = await api.getMyPrivateProducts();
        if (result.error) {
          grid.innerHTML =
            '<div class="panel private-offers-empty"><h2>Could not load private offers</h2><p>Please refresh, or contact Atelix for help.</p></div>';
          return;
        }
        if (!result.products.length) {
          grid.innerHTML =
            '<div class="panel private-offers-empty"><h2>No private offers yet</h2><p>When Atelix assigns a custom SKU or OEM package to your brand, it will appear here.</p></div>';
          return;
        }
        window.ARCANA_PRODUCTS = [
          ...(window.ARCANA_PRODUCTS || []),
          ...result.products,
        ];
        window.ARCANA_PRODUCT_MAP = Object.fromEntries(
          window.ARCANA_PRODUCTS.map((p) => [p.id, p]),
        );
        grid.innerHTML = result.products
          .map((p) =>
            window.ARCANA_card(p, {
              href: "product.html?id=" + encodeURIComponent(p.id),
            }),
          )
          .join("");
        window.ARCANA_wireCards(grid);
      };
    </script>
  </body>
</html>
