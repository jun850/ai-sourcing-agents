<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Factories &amp; Mills — Atelix</title>
<meta name="description" content="Browse verified fabric mills and OEM factories, audited for identity, license and capability. Filter by business type, region and certifications.">
<link rel="canonical" href="https://atelix.app/pages/factories.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Atelix">
<meta property="og:title" content="Verified Factories &amp; Mills — Atelix">
<meta property="og:description" content="Browse verified fabric mills and OEM factories, audited for identity, license and capability.">
<meta property="og:url" content="https://atelix.app/pages/factories.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Verified Factories &amp; Mills — Atelix">
<meta name="twitter:description" content="Verified fabric mills and OEM factories, audited for identity, license and capability.">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-catalog data-root=".." data-search="Search factories, mills, suppliers…">
<div id="hdr"></div>

<main class="wrap">
  <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><span aria-current="page">Factories</span></li></ol></nav>

  <div class="listing">
    <aside class="filter-rail">
      <div class="frl-head"><b>Filters</b><button type="button" id="clearFilters">Reset</button></div>
      <div class="frl-block">
        <h5>Business type</h5>
        <div id="typeOpts"></div>
      </div>
      <div class="frl-block">
        <h5>Region</h5>
        <div id="regionOpts"></div>
      </div>
      <div class="frl-block">
        <h5>Certifications</h5>
        <div id="certOpts"></div>
      </div>
    </aside>

    <div class="listing-main">
      <div class="list-top">
        <h1>Factories</h1>
        <div class="cnt" id="factoryDirectorySummary">Verified material and production companies</div>
      </div>
      <div class="sortbar">
        <span class="lbl">Sort</span>
        <div class="sort-chips" id="sortChips">
          <button class="sort-chip on" type="button" data-sort="rec">Recommended</button>
          <button class="sort-chip" type="button" data-sort="orders">Most orders</button>
          <button class="sort-chip" type="button" data-sort="years">Most established</button>
        </div>
        <span class="count" id="resCount"></span>
      </div>
      <div class="fac-grid" id="grid"></div>
    </div>
  </div>
  <div class="page-end-space" aria-hidden="true"></div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/copilot.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script src="../js/copilot-llm.js"></script>
<script>
window.ARCANA_PAGE = function({ASSET,IC,Store,toast}){
  const F=window.ARCANA_FACTORIES;
  const catalogStats=window.ATELIX_catalogStats;
  const factoryImage=window.ATELIX_factoryCardAsset;
  const factoryLocation=window.ATELIX_factoryLocation;
  const supplierText=window.ATELIX_supplierText;
  const esc=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const uniq=(k)=>[...new Set(F.map(f=>f[k]))];
  const types=uniq('type'), regions=uniq('region');
  const certs=[...new Set(F.flatMap(f=>f.certs))];
  const optRow=(name,val,n)=>`<label class="frl-opt"><input type="checkbox" name="${name}" value="${val}"> ${val} <span class="cnt">${n}</span></label>`;
  document.getElementById('typeOpts').innerHTML=types.map(t=>optRow('type',t,F.filter(f=>f.type===t).length)).join('');
  document.getElementById('regionOpts').innerHTML=regions.map(r=>optRow('region',r,F.filter(f=>f.region===r).length)).join('');
  document.getElementById('certOpts').innerHTML=certs.map(c=>optRow('cert',c,F.filter(f=>f.certs.includes(c)).length)).join('');

  let sort='rec';
  const sel=name=>[...document.querySelectorAll(`[name=${name}]:checked`)].map(c=>c.value);
  const grid=document.getElementById('grid'), resCount=document.getElementById('resCount');

  function render(){
    const T=window.ARCANA_T;
    document.getElementById('factoryDirectorySummary').innerHTML=`<b style="color:var(--ink)">${catalogStats.factories}</b> ${T('verified material and production companies across')} <b style="color:var(--ink)">${catalogStats.countries}</b> ${T('countries')}`;
    const ty=sel('type'), rg=sel('region'), ct=sel('cert');
    let list=F.filter(f=>(!ty.length||ty.includes(f.type))&&(!rg.length||rg.includes(f.region))&&(!ct.length||ct.some(c=>f.certs.includes(c))));
    const isNewFactory=f=>+String(f.id).split('-')[1]>=14;
    if(sort==='rec') list=[...list].sort((a,b)=>Number(isNewFactory(b))-Number(isNewFactory(a)) || (b.years||0)-(a.years||0));
    else if(sort==='orders') list=[...list].sort((a,b)=>parseInt(b.orders)-parseInt(a.orders));
    else if(sort==='years') list=[...list].sort((a,b)=>b.years-a.years);
    resCount.textContent=`${list.length} factor${list.length===1?'y':'ies'}`;
    grid.innerHTML=list.map(f=>{
      const isNewFactory=+String(f.id).split('-')[1]>=14;
      const orderDetail=f.orders==='New'?T('Recently listed'):(f.orders?`${f.orders} ${T('orders')}`:T('Contact supplier'));
      const ageDetail=f.years?`${f.years} ${T('sp.years')}`:(f.founded?`${T('sp.established')} ${f.founded}`:T('Established supplier'));
      const supplierName=supplierText(f,'name');
      return `
      <a class="fcard" href="supplier.html?id=${encodeURIComponent(f.id)}">
        <div class="fthumb"><img src="${esc(factoryImage(f))}" alt="${esc(supplierName)}" loading="lazy">${f.verified?`<span class="fveric">${IC.shield} ${T('Verified Factory')}</span>`:''}${isNewFactory?`<span class="fnew">${T('New source')}</span>`:''}</div>
        <div class="fbody">
          <div class="fname">${esc(supplierName)}</div>
          <span class="ftype">${esc(f.type)}</span>
          <div class="fmeta">${orderDetail} <span class="dot">·</span> ${ageDetail}</div>
          <div class="floc">${IC.pin}<span>${esc(factoryLocation(f))}</span></div>
          <div class="ffoot"><div>MOQ<b>${esc(window.ATELIX_publicValue(f.moq))}</b></div><div>Lead time<b>${esc(window.ATELIX_publicValue(f.lead))}</b></div></div>
          <span class="btn btn-out btn-block">${T('View factory')}</span>
        </div></a>`;
    }).join('');
  }
  render();
  document.querySelectorAll('.filter-rail input').forEach(i=>i.addEventListener('change',render));
  document.querySelectorAll('.sort-chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.sort-chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');sort=c.dataset.sort;render();}));
  document.getElementById('clearFilters').addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('.filter-rail input').forEach(i=>i.checked=false);sort='rec';document.querySelectorAll('.sort-chip').forEach(x=>x.classList.toggle('on',x.dataset.sort==='rec'));render();});
  window.ARCANA_onLang(render);
};
</script>
</body>
</html>
