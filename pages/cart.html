<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Atelix</title>
<meta name="description" content="Review your sourcing cart and proceed to secure checkout on Atelix.">
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-catalog data-hdr="b" data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap">
  <div id="cartRoot"></div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/copilot.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script src="../js/copilot-llm.js"></script>
<script>
window.ARCANA_PAGE = function({ASSET,IC,Store,toast}){
  const M=window.ARCANA_PRODUCT_MAP, root=document.getElementById('cartRoot');
  const productAsset=window.ATELIX_productAsset;
  const productMoney=(p,qty=1)=>window.ATELIX_productMoney(p,qty);
  const productAmount=(p,qty=1)=>window.ATELIX_productAmount(p,qty);
  const currencyMoney=n=>window.ATELIX_currencyMoney(n);
  const TR=window.ARCANA_TR, T=window.ARCANA_T;
  const text=value=>String(TR(value)||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const reco=window.ARCANA_recommended(8); // computed once so it doesn't reshuffle on re-render

  function render(){
    const cart=Store.cart().filter(i=>M[i.id]);
    if(!cart.length){
      root.innerHTML=`<div class="panel cart-empty">
        <span class="ce-ic">${IC.cart}</span>
        <h1>${T('Your cart is empty')}</h1>
        <p>${T('Browse verified fabrics and OEM services to start your next collection.')}</p>
        <a class="btn btn-green" href="../index.html">${T('Start shopping')}</a>
      </div>
      <section class="section" style="margin-top:32px">
        <div class="sec-head"><h2>${T('Recommended for you')}</h2></div>
        <div class="prod-grid" id="cartRecoGrid">${reco.map(p=>window.ARCANA_card(p)).join('')}</div>
      </section>`;
      window.ARCANA_wireCards(document.getElementById('cartRecoGrid'));
      return;
    }
    cart.forEach(i=>{
      const minimum=Math.max(1,Math.ceil(Number.parseFloat(M[i.id].moq)||1));
      if(i.qty<minimum){i.qty=minimum;Store.setQty(i.key||i.id,minimum);}
    });
    const hasQuoteOnly=cart.some(i=>M[i.id].pricingMode==='quote'||!(M[i.id].price>0));
    const groups=[];
    cart.forEach(item=>{
      const product=M[item.id];
      const key=product.factoryId||product.seller||'supplier';
      let group=groups.find(entry=>String(entry.key)===String(key));
      if(!group){group={key,name:product.seller||T('Supplier'),location:product.loc||'',items:[]};groups.push(group);}
      group.items.push(item);
    });
    const groupMarkup=groups.map(group=>`<section class="cart-supplier-group panel">
      <header class="cart-supplier-head">
        <span class="cart-supplier-icon" aria-hidden="true">${IC.factory}</span>
        <div><h2>${text(group.name)}</h2>${group.location?`<p>${text(group.location)}</p>`:''}</div>
      </header>
      <div class="cart-supplier-items">${group.items.map(i=>{
        const p=M[i.id],quoteOnly=p.pricingMode==='quote'||!(p.price>0);
        const productMeta=[p.comp,p.spec].filter(Boolean).map(text).join(' · ');
        const optionMeta=Object.entries(i.options||{}).map(([name,value])=>`${text(name)}: ${text(value)}`).join(' · ');
        return `<article class="cart-product" data-row="${text(i.key||p.id)}">
          <a class="cart-product-image" href="product.html?id=${encodeURIComponent(p.id)}"><img src="${productAsset(p)}" alt="${text(p.name)}"></a>
          <div class="cart-product-body">
            <h3><a href="product.html?id=${encodeURIComponent(p.id)}">${text(p.name)}</a></h3>
            ${productMeta?`<p class="cart-product-meta">${productMeta}</p>`:''}
            ${optionMeta?`<p class="cart-variant">${optionMeta}</p>`:''}
            <div class="cart-product-unit">${quoteOnly?T('Contact supplier'):`${productMoney(p)} <small>/${text(p.unit)}</small>`}</div>
          </div>
          <div class="cart-product-controls">
            <div class="qty" data-qty data-id="${p.id}" data-key="${text(i.key||p.id)}"><button type="button" data-dec aria-label="Decrease ${text(p.name)} quantity">−</button><input value="${i.qty}" inputmode="numeric" aria-label="${T('Quantity')}"/><button type="button" data-inc aria-label="Increase ${text(p.name)} quantity">+</button></div>
            <button class="ci-remove" type="button" data-remove="${text(i.key||p.id)}">${T('Remove')}</button>
          </div>
          <div class="cart-product-total"><span>${T('Line total')}</span><strong>${quoteOnly?T('Contact supplier'):productMoney(p,i.qty)}</strong></div>
        </article>`;
      }).join('')}</div>
    </section>`).join('');

    const subtotal=cart.reduce((sum,item)=>sum+productAmount(M[item.id],item.qty),0);
    const fee=+(subtotal*0.05).toFixed(2);
    const total=subtotal+fee;

    root.innerHTML=`<header class="cart-page-head"><div><h1>${T('Your Cart')}</h1><p>${cart.length} ${T(cart.length===1?'item':'items')} from ${groups.length} ${T(groups.length===1?'supplier':'suppliers')}</p></div><a class="btn btn-out" href="category.html">${T('Continue shopping')}</a></header>
    <div class="cart-wrap">
      <div class="cart-groups">${groupMarkup}</div>
      <aside>
        <section class="panel summary cart-summary">
          <h3>${T('Order Summary')}</h3>
          <div class="sum-row"><span class="k">${T('Subtotal')}</span><span>${currencyMoney(subtotal)}</span></div>
          <div class="sum-row"><span class="k">${T('Service fee (5%)')}</span><span>${currencyMoney(fee)}</span></div>
          <div class="sum-row"><span class="k">${T('Shipping')}</span><span>${T('Calculated at checkout')}</span></div>
          <div class="cart-summary-total"><span>${T('Total before shipping')}</span><strong>${currencyMoney(total)}</strong></div>
          ${hasQuoteOnly?`<a class="btn btn-gold btn-block cart-summary-action" href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent('Quote request from cart')}">${T('Contact supplier')}</a><p class="cart-summary-help">${T('Remove quote-only items to place the remaining order online.')}</p>`:`<button class="btn btn-gold btn-block cart-summary-action" data-checkout><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg> ${T('Proceed to Checkout')}</button><p class="cart-summary-help">${T('Choose a saved address to see the final shipping total.')}</p>`}
          <div class="secure-note"><span>${IC.shield} ${T('Encrypted order details')}</span></div>
        </section>
      </aside>
    </div>`;

    // wire dynamic controls
    root.querySelectorAll('[data-qty]').forEach(q=>{
      const id=q.dataset.id,key=q.dataset.key||id,inp=q.querySelector('input');
      const minimum=Math.max(1,Math.ceil(Number.parseFloat(M[id].moq)||1));
      inp.min=minimum;
      const commit=v=>{Store.setQty(key,v);render();};
      q.querySelector('[data-dec]').onclick=()=>commit(Math.max(minimum,(+inp.value||minimum)-1));
      q.querySelector('[data-inc]').onclick=()=>commit((+inp.value||minimum)+1);
      inp.onchange=()=>commit(Math.max(minimum,parseInt(inp.value)||minimum));
    });
    root.querySelectorAll('[data-remove]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();Store.remove(a.dataset.remove);toast(T('Item removed'));render();}));
    const checkout=root.querySelector('[data-checkout]');if(checkout)checkout.addEventListener('click',()=>{Store.beginCheckout();location.href='checkout.html';});
  }
  render();
  window.ARCANA_onLang(render);
};
</script>
</body>
</html>
