<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search — Atelix</title>
<meta name="description" content="Search products and verified factories across the Atelix sourcing marketplace.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://atelix.app/search">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body data-catalog data-marketplace-search data-root=".." data-search="Search products and factories…">
<div id="hdr"></div>
<main class="wrap search-results-page">
  <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="/">Home</a></li><li><span aria-current="page">Search results</span></li></ol></nav>
  <header class="search-results-head">
    <h1 id="searchResultsTitle">Search Atelix</h1>
    <p id="searchResultsSummary">Products and verified factories, in one search.</p>
  </header>
  <div class="search-type-tabs" role="tablist" aria-label="Search result type">
    <button type="button" role="tab" id="productsTab" aria-controls="searchResultsPanel" aria-selected="true" data-result-type="products">Products <span id="productTabCount"></span></button>
    <button type="button" role="tab" id="factoriesTab" aria-controls="searchResultsPanel" aria-selected="false" tabindex="-1" data-result-type="factories">Factories <span id="factoryTabCount"></span></button>
  </div>
  <div class="search-quick-filters" id="searchQuickFilters" role="group" aria-label="Quick filters"></div>
  <div class="search-results-layout">
    <aside class="search-filter-rail" id="searchFilterRail" aria-label="Search filters"></aside>
    <section class="search-results-content" id="searchResultsPanel" role="tabpanel" aria-labelledby="productsTab">
      <div class="search-result-tools"><p id="searchResultCount" aria-live="polite">Searching…</p><label>Sort <select id="searchSort"><option value="relevance">Recommended</option><option value="price">Price: low</option><option value="moq">MOQ: low</option></select></label></div>
      <div class="prod-grid search-product-grid" id="searchProductGrid" aria-busy="true"></div>
      <div class="search-factory-list" id="searchFactoryList" hidden aria-busy="true"></div>
      <div class="search-results-status" id="searchResultsStatus" role="status"><span aria-hidden="true"></span><p>Searching verified listings…</p></div>
    </section>
  </div>
</main>
<div id="ftr"></div>
<script src="/js/data.js"></script>
<script src="/js/copilot.js"></script>
<script src="/js/components.js"></script>
<script defer src="/js/analytics.bundle.js"></script>
<script src="/js/supabase-client.bundle.js"></script>
<script src="/js/api.js"></script>
<script>
window.ARCANA_PAGE=async function({IC}){
  const params=new URLSearchParams(location.search);
  const query=(params.get('q')||'').trim();
  let activeType=params.get('type')==='factories'?'factories':'products';
  let activeFilter='all',sort='relevance',productHits=[],factoryHits=[];
  const T=window.ARCANA_T,TR=window.ARCANA_TR;
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const title=document.getElementById('searchResultsTitle'),summary=document.getElementById('searchResultsSummary');
  const grid=document.getElementById('searchProductGrid'),factoryList=document.getElementById('searchFactoryList');
  const status=document.getElementById('searchResultsStatus'),count=document.getElementById('searchResultCount');
  const rail=document.getElementById('searchFilterRail'),quick=document.getElementById('searchQuickFilters');
  const sortSelect=document.getElementById('searchSort');
  const headerInput=document.getElementById('site-search'); if(headerInput) headerInput.value=query;
  function localizeStatic(){
    title.textContent=query?`${T('Results for')} “${query}”`:T('Explore the marketplace');
    summary.textContent=T(query?'Search across every public product and verified factory.':'Browse recommended products and verified sourcing partners.');
    document.title=query?`${query} — ${T('Search results')} — Atelix`:`${T('Search Atelix')} — Atelix`;
    document.querySelector('.crumbs a').textContent=T('Home');document.querySelector('.crumbs [aria-current="page"]').textContent=T('Search results');
    document.getElementById('productsTab').firstChild.nodeValue=T('Products')+' ';
    document.getElementById('factoriesTab').firstChild.nodeValue=T('Factories')+' ';
    document.querySelector('.search-result-tools label').firstChild.nodeValue=T('Sort')+' ';
    [...sortSelect.options].forEach(option=>{option.textContent=T({relevance:'Recommended',price:'Price: low',moq:'MOQ: low'}[option.value]);});
    status.querySelector('p').textContent=T('Searching verified listings…');
  }
  localizeStatic();

  // Remote index hits must exist in the hydrated catalog before the UI gives
  // them a destination. This prevents an out-of-date Algolia object from
  // producing the product/factory pages' legacy fallback destination.
  const localProduct=hit=>window.ARCANA_PRODUCT_MAP?.[hit.objectID]||null;
  const localFactory=hit=>window.ARCANA_FACTORY_MAP?.[hit.objectID]||null;
  const searchableProduct=product=>[product.id,product.name,product.comp,product.spec,product.seller,product.cat,product.country].filter(Boolean).join(' ').toLowerCase();
  const searchableFactory=factory=>[factory.name,factory.type,factory.region,factory.loc].filter(Boolean).join(' ').toLowerCase();
  const localMatch=(text,value)=>!value||text.includes(value.toLowerCase())||value.toLowerCase().split(/\s+/).filter(word=>word.length>2).some(word=>text.includes(word));

  function factoryCard(factory){
    const location=window.ATELIX_factoryLocation(factory),image=window.ATELIX_factoryAsset(factory);
    const href=window.ATELIX_factoryRoute(factory.id); if(!href) return '';
    return `<a class="search-factory-card" href="${href}"><img src="${image}" alt="" loading="lazy"><span class="search-factory-copy"><span class="search-factory-title"><b>${esc(TR(factory.name))}</b><em>${IC.check} ${T('Verified')}</em></span><span>${esc(TR(factory.type||T('Supplier')))} · ${esc(TR(location))}</span></span><span class="search-factory-action" aria-hidden="true">→</span></a>`;
  }
  const categoryLabels={fabrics:'Fabrics',accessories:'Accessories',trims:'Trims',yarns:'Yarns & Threads',oem:'OEM Services'};
  function productFilters(){return [{key:'all',label:T('All')},...Object.keys(categoryLabels).map(key=>({key,label:TR(categoryLabels[key])}))];}
  function factoryFilters(){
    const countries=[...new Set(factoryHits.map(factory=>factory.region).filter(Boolean))].slice(0,3);
    return [{key:'all',label:T('All')},...countries.map(value=>({key:`country:${value}`,label:TR(value)})),{key:'type:fabric',label:T('Fabric mills')},{key:'type:garment',label:T('OEM factories')},{key:'type:accessories',label:TR('Accessories')}].slice(0,8);
  }
  function filters(){return activeType==='products'?productFilters():factoryFilters();}
  function paintFilters(){
    const options=filters();
    if(!options.some(option=>option.key===activeFilter))activeFilter='all';
    const mobileOptions=activeType==='products'
      ? [...options.filter(option=>['all','fabrics','accessories','trims','oem'].includes(option.key)).map(option=>({...option,kind:'filter'})),
        {key:'relevance',label:T('Recommended'),kind:'sort'},{key:'price',label:T('Price: low'),kind:'sort'},{key:'moq',label:T('MOQ: low'),kind:'sort'}]
      : options.map(option=>({...option,kind:'filter'}));
    quick.innerHTML=mobileOptions.slice(0,8).map(option=>{
      const selected=option.kind==='sort'?option.key===sort:option.key===activeFilter;
      return `<button type="button" class="${selected?'on':''}" data-search-${option.kind}="${esc(option.key)}" aria-pressed="${selected}">${esc(option.label)}</button>`;
    }).join('');
    rail.innerHTML=`<div class="search-filter-head"><b>${T('Filters')}</b>${activeFilter!=='all'?`<button type="button" data-search-filter="all">${T('Reset')}</button>`:''}</div><fieldset><legend>${T(activeType==='products'?'Category':'Supplier type and location')}</legend>${options.map(option=>`<label><input type="radio" name="searchFilter" value="${esc(option.key)}" ${option.key===activeFilter?'checked':''}><span>${esc(option.label)}</span></label>`).join('')}</fieldset>`;
  }
  function visibleProducts(){
    let list=activeFilter==='all'?productHits:productHits.filter(product=>product.cat===activeFilter);
    if(sort==='price')list=[...list].sort((a,b)=>(a.price||Infinity)-(b.price||Infinity));
    if(sort==='moq')list=[...list].sort((a,b)=>(parseFloat(a.moq)||Infinity)-(parseFloat(b.moq)||Infinity));
    return list;
  }
  function visibleFactories(){
    if(activeFilter==='all')return factoryHits;
    const [kind,value]=activeFilter.split(':');
    return factoryHits.filter(factory=>kind==='country'?factory.region===value:String(factory.type||'').toLowerCase().includes(value));
  }
  function emptyState(type){
    const heading=T(type==='products'?'No products found':'No factories found');
    return `<section class="search-empty"><span aria-hidden="true">${IC.search}</span><h2>${heading}${query?` — “${esc(query)}”`:''}</h2><p>${T('Try a broader material, product, supplier, city or country name.')}</p><button type="button" class="btn btn-out" data-clear-search>${T('Clear search')}</button></section>`;
  }
  function render(){
    paintFilters();
    const isProducts=activeType==='products',list=isProducts?visibleProducts():visibleFactories();
    grid.hidden=!isProducts;factoryList.hidden=isProducts;sortSelect.closest('label').hidden=!isProducts;
    document.getElementById('productsTab').setAttribute('aria-selected',String(isProducts));document.getElementById('productsTab').tabIndex=isProducts?0:-1;
    document.getElementById('factoriesTab').setAttribute('aria-selected',String(!isProducts));document.getElementById('factoriesTab').tabIndex=isProducts?-1:0;
    document.getElementById('searchResultsPanel').setAttribute('aria-labelledby',isProducts?'productsTab':'factoriesTab');
    count.textContent=`${list.length} ${T(list.length===1?'result':'results')}`;
    if(isProducts){grid.innerHTML=list.length?list.map(product=>window.ARCANA_card(product,{href:window.ATELIX_productRoute(product.id),fabricSpec:product.cat==='fabrics'})).join(''):emptyState('products');window.ARCANA_wireCards(grid);}
    else factoryList.innerHTML=list.length?list.map(factoryCard).join(''):emptyState('factories');
    document.querySelectorAll('[data-clear-search]').forEach(button=>button.addEventListener('click',()=>{location.href='/search';}));
  }
  async function load(){
    status.hidden=false;grid.hidden=true;factoryList.hidden=true;
    try{
      const [products,factories]=await Promise.all([window.ATELIX_searchPublicAlgolia('products',query,{hitsPerPage:100}),window.ATELIX_searchPublicAlgolia('factories',query,{hitsPerPage:100})]);
      productHits=(products.hits||[]).map(localProduct).filter(Boolean);factoryHits=(factories.hits||[]).map(localFactory).filter(Boolean);
      const indexedProducts=new Set(productHits.map(product=>product.id)), indexedFactories=new Set(factoryHits.map(factory=>factory.id));
      productHits.push(...window.ARCANA_PRODUCTS.filter(product=>!indexedProducts.has(product.id)&&localMatch(searchableProduct(product),query)));
      factoryHits.push(...window.ARCANA_FACTORIES.filter(factory=>!indexedFactories.has(factory.id)&&localMatch(searchableFactory(factory),query)));
    }catch(_){
      productHits=window.ARCANA_PRODUCTS.filter(product=>localMatch(searchableProduct(product),query));
      factoryHits=window.ARCANA_FACTORIES.filter(factory=>localMatch(searchableFactory(factory),query));
    }
    status.hidden=true;grid.setAttribute('aria-busy','false');factoryList.setAttribute('aria-busy','false');
    document.getElementById('productTabCount').textContent=productHits.length;document.getElementById('factoryTabCount').textContent=factoryHits.length;
    render();
  }
  document.querySelector('.search-type-tabs').addEventListener('click',event=>{const button=event.target.closest('[data-result-type]');if(!button)return;activeType=button.dataset.resultType;activeFilter='all';params.set('type',activeType);history.replaceState(null,'','/search?'+params.toString());render();});
  document.querySelector('.search-type-tabs').addEventListener('keydown',event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const target=activeType==='products'?'factories':'products';document.querySelector(`[data-result-type="${target}"]`).click();document.querySelector(`[data-result-type="${target}"]`).focus();});
  quick.addEventListener('click',event=>{
    const button=event.target.closest('[data-search-filter],[data-search-sort]');if(!button)return;
    if(button.dataset.searchSort){sort=button.dataset.searchSort;sortSelect.value=sort;}
    else activeFilter=button.dataset.searchFilter;
    render();
  });
  rail.addEventListener('change',event=>{if(event.target.name==='searchFilter'){activeFilter=event.target.value;render();}});
  rail.addEventListener('click',event=>{const button=event.target.closest('[data-search-filter]');if(button){activeFilter=button.dataset.searchFilter;render();}});
  sortSelect.addEventListener('change',()=>{sort=sortSelect.value;render();});
  await load();
  if(query) window.ARCANA_API?.recordRecentSearch?.(query);
  window.ARCANA_onLang(()=>{localizeStatic();render();});
};
</script>
</body>
</html>
