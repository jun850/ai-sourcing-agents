<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users &amp; Orders — ARCANA Admin</title>
<meta name="description" content="Admin: browse every account on ARCANA and manage order status.">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-root="..">
<div id="hdr"></div>

<div id="adminGate" class="wrap" hidden style="padding:80px 0;text-align:center;max-width:520px"></div>

<main class="wrap" id="adminMain" style="padding-top:24px;padding-bottom:40px" hidden>
  <div class="acct-head">
    <h1>Users &amp; Orders</h1>
    <p class="sub">Every account on ARCANA. Click a user to see their orders and update status — every change emails the buyer.</p>
  </div>

  <section class="panel" style="padding:0;overflow:hidden;margin-bottom:20px">
    <div style="padding:20px 24px 0"><h2 style="font-family:var(--serif);font-size:19px;font-weight:600">Users</h2></div>
    <div style="overflow-x:auto">
      <table class="admin-tbl">
        <thead>
          <tr><th>Name</th><th>Company</th><th>Email</th><th>Role</th><th>Orders</th><th>Joined</th></tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
    <p id="usersEmpty" class="muted" style="padding:24px;text-align:center" hidden>No users yet.</p>
  </section>

  <section class="panel" style="padding:0;overflow:hidden">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:20px 24px 0">
      <div>
        <h2 style="font-family:var(--serif);font-size:19px;font-weight:600">Orders</h2>
        <p class="muted" id="ordersFilterLabel" style="font-size:12.5px;margin-top:4px">Every order on ARCANA.</p>
      </div>
      <button class="btn btn-out" type="button" id="clearUserFilter" style="padding:8px 14px;font-size:12.5px" hidden>Show all orders</button>
    </div>
    <div style="overflow-x:auto">
      <table class="admin-tbl">
        <thead>
          <tr><th>Order</th><th>Buyer</th><th>Items</th><th>Total</th><th>Placed</th><th>Status</th><th>Update</th></tr>
        </thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
    <p id="ordersEmpty" class="muted" style="padding:24px;text-align:center" hidden>No orders yet.</p>
  </section>
</main>

<!-- confirmation modal — replaces native confirm()/prompt() for finalizing a status change -->
<div class="modal-overlay" id="statusModal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Update order status</h3>
    <p id="modalDesc" class="muted" style="font-size:13.5px;margin-top:6px"></p>
    <div class="field-lg" style="margin-top:16px">
      <label>Note to buyer <span class="hint">optional, shown in the email</span></label>
      <textarea id="modalNote" rows="3" placeholder="e.g. Delayed due to customs inspection"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-out" type="button" id="modalCancel">Cancel</button>
      <button class="btn btn-green" type="button" id="modalConfirm">Confirm update</button>
    </div>
  </div>
</div>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script>
window.ARCANA_PAGE=async function({toast}){
  const api=window.ARCANA_API;
  const gate=document.getElementById('adminGate');
  const main=document.getElementById('adminMain');
  const money=n=>window.ARCANA_money(n);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const STATUSES=['awaiting_payment','payment_declared','payment_verified','fulfilling','completed','cancelled','disputed','refunded'];
  const STATUS_META={
    awaiting_payment:{label:'Awaiting payment', cls:'b-prem'},
    payment_declared:{label:'Payment declared', cls:'b-prem'},
    payment_verified:{label:'Payment verified', cls:'b-std'},
    fulfilling:{label:'In fulfillment', cls:'b-std'},
    completed:{label:'Completed', cls:'b-ok'},
    cancelled:{label:'Cancelled', cls:'b-nonoem'},
    disputed:{label:'Disputed', cls:'b-nonoem'},
    refunded:{label:'Refunded', cls:'b-nonoem'}
  };
  const ROLE_LABEL={admin:'Admin', seller:'Seller', buyer:'Buyer'};

  function showGate(title, body, cta){
    gate.innerHTML=`<h2 style="font-family:var(--serif);font-size:24px;margin-bottom:10px">${title}</h2><p class="muted">${body}</p>${cta||''}`;
    gate.hidden=false;
  }

  const profile=await api.getSessionProfile();
  if(!profile){
    showGate('Log in to continue','Sign in to your ARCANA admin account.',
      '<a class="btn btn-green" href="login.html?next=admin-orders.html" style="margin-top:14px;display:inline-block">Log in</a>');
    return;
  }
  if(profile.role!=='admin'){
    showGate('Admin access only','This page is restricted to ARCANA admins.', '');
    return;
  }
  main.hidden=false;

  /* ---- Users ---- */
  let users=[], activeUserId=null, activeUserLabel='';
  async function loadUsers(){
    users=await api.adminListUsers();
    renderUsers();
  }
  function renderUsers(){
    const body=document.getElementById('usersBody');
    document.getElementById('usersEmpty').hidden=!!users.length;
    body.innerHTML=users.map(u=>`
      <tr data-user-row="${u.id}" style="cursor:pointer">
        <td>${u.role==='seller' && u.factory_id
          ? `<a href="admin-supplier.html?id=${encodeURIComponent(u.factory_id)}" style="color:var(--green);font-weight:600" title="Manage supplier">${esc(u.full_name||'—')} <span aria-hidden="true">↗</span></a>`
          : `<b>${esc(u.full_name||'—')}</b>`}</td>
        <td>${esc(u.company_name||'—')}</td>
        <td>${esc(u.email)}</td>
        <td><span class="badge b-std">${ROLE_LABEL[u.role]||u.role}</span></td>
        <td>${u.order_count}</td>
        <td>${new Date(u.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</td>
      </tr>`).join('');
    body.querySelectorAll('[data-user-row]').forEach(row=>row.addEventListener('click',()=>{
      const u=users.find(x=>x.id===row.dataset.userRow);
      selectUser(u.id, u.full_name||u.company_name||u.email);
    }));
  }

  /* ---- Orders (optionally filtered to one user) ---- */
  let allOrders=[], orders=[];
  async function loadOrders(){
    allOrders=await api.adminListOrders();
    applyOrderFilter();
  }
  function applyOrderFilter(){
    orders=activeUserId ? allOrders.filter(o=>o.buyer_profile_id===activeUserId) : allOrders;
    renderOrders();
  }
  function selectUser(id, label){
    activeUserId=id; activeUserLabel=label;
    document.getElementById('ordersFilterLabel').textContent=`Showing orders for ${label}.`;
    document.getElementById('clearUserFilter').hidden=false;
    applyOrderFilter();
    document.getElementById('ordersFilterLabel').closest('section').scrollIntoView({behavior:'smooth', block:'start'});
  }
  document.getElementById('clearUserFilter').addEventListener('click',()=>{
    activeUserId=null;
    document.getElementById('ordersFilterLabel').textContent='Every order on ARCANA.';
    document.getElementById('clearUserFilter').hidden=true;
    applyOrderFilter();
  });

  function renderOrders(){
    const body=document.getElementById('ordersBody');
    document.getElementById('ordersEmpty').hidden=!!orders.length;
    body.innerHTML=orders.map(o=>{
      const meta=STATUS_META[o.status]||STATUS_META.awaiting_payment;
      return `<tr>
        <td><a href="order.html?no=${encodeURIComponent(o.order_no)}" style="color:var(--green);font-weight:600">${esc(o.order_no)}</a></td>
        <td><b>${esc(o.buyer_name||'—')}</b><br><span class="muted" style="font-size:12px">${esc(o.buyer_email||'')}</span></td>
        <td>${o.item_count}</td>
        <td>${money(o.total)}</td>
        <td>${new Date(o.placed_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</td>
        <td><span class="badge ${meta.cls}">${meta.label}</span></td>
        <td>
          <div style="display:flex;gap:6px;align-items:center">
            <select data-status="${o.order_no}" style="border:1px solid var(--line);border-radius:var(--radius-sm);padding:6px 8px;font-size:12.5px;font-family:inherit">
              ${STATUSES.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${STATUS_META[s].label}</option>`).join('')}
            </select>
            <button class="btn btn-out" type="button" data-apply="${o.order_no}" style="padding:6px 12px;font-size:12px">Update</button>
          </div>
        </td>
      </tr>`;
    }).join('');
    body.querySelectorAll('[data-apply]').forEach(btn=>btn.addEventListener('click', ()=>{
      const orderNo=btn.dataset.apply;
      const select=body.querySelector(`select[data-status="${CSS.escape(orderNo)}"]`);
      const newStatus=select.value;
      const order=orders.find(o=>o.order_no===orderNo);
      if(order && order.status===newStatus){ toast('Already ' + STATUS_META[newStatus].label); return; }
      openStatusModal(orderNo, order?order.status:null, newStatus);
    }));
  }

  /* ---- Confirmation modal ---- */
  const modal=document.getElementById('statusModal');
  const modalNote=document.getElementById('modalNote');
  const modalConfirm=document.getElementById('modalConfirm');
  let pending=null;
  function openStatusModal(orderNo, currentStatus, newStatus){
    pending={orderNo, newStatus};
    document.getElementById('modalTitle').textContent=`Update ${orderNo}`;
    const fromLabel=currentStatus?STATUS_META[currentStatus].label:'its current status';
    document.getElementById('modalDesc').innerHTML=`Change status from <b>${fromLabel}</b> to <b>${STATUS_META[newStatus].label}</b>? This emails the buyer.`;
    modalNote.value='';
    modal.hidden=false;
    modalNote.focus();
  }
  function closeModal(){ modal.hidden=true; pending=null; }
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !modal.hidden) closeModal(); });
  modalConfirm.addEventListener('click', async ()=>{
    if(!pending) return;
    const { orderNo, newStatus }=pending;
    const note=modalNote.value.trim();
    modalConfirm.disabled=true; modalConfirm.textContent='Saving…';
    const { error }=await api.adminUpdateOrderStatus(orderNo, newStatus, note||null);
    modalConfirm.disabled=false; modalConfirm.textContent='Confirm update';
    if(error){ toast(error.message||'Could not update order'); return; }
    toast(`${orderNo} → ${STATUS_META[newStatus].label}`);
    closeModal();
    loadOrders();
  });

  await Promise.all([loadUsers(), loadOrders()]);
};
</script>
</body>
</html>
