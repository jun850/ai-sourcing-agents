<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Product Details — Atelix</title>
<meta name="description" content="View composition, GSM, MOQ, lead time and unit pricing for verified apparel materials, then order or email the supplier through Atelix.">
<link rel="canonical" href="https://marketplace-three-peach.vercel.app/pages/product.html">
<meta property="og:type" content="product">
<meta property="og:site_name" content="Atelix">
<meta property="og:title" content="Product Details — Atelix">
<meta property="og:description" content="Composition, GSM, MOQ, lead time and unit pricing for verified apparel materials on Atelix.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Product Details — Atelix">
<meta name="twitter:description" content="Composition, GSM, MOQ, lead time and unit pricing for verified apparel materials on Atelix.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-catalog data-catalog-defer data-marketplace-search data-product-detail data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>
<main class="wrap"><div id="pdpRoot" class="pdp-loading" aria-busy="true" aria-live="polite"><div class="pdp-loading-gallery" aria-hidden="true"></div><div class="pdp-loading-panel" aria-hidden="true"><i class="pdp-loading-line pdp-loading-line--eyebrow"></i><i class="pdp-loading-line pdp-loading-line--title"></i><i class="pdp-loading-line pdp-loading-line--title short"></i><i class="pdp-loading-line"></i><i class="pdp-loading-line short"></i><i class="pdp-loading-price"></i><i class="pdp-loading-action"></i></div><div class="pdp-loading-details" aria-hidden="true"><i class="pdp-loading-line"></i><i class="pdp-loading-line"></i><i class="pdp-loading-line short"></i></div><span class="sr-only">Loading product details</span></div><div class="page-end-space" aria-hidden="true"></div></main>
<div id="ftr"></div>
<script defer src="../js/data.js"></script>
<script defer src="../js/catalog-taxonomy.js"></script>
<script defer src="../js/product-options.js"></script>
<script defer src="../js/copilot.js"></script>
<script defer src="../js/components.js?v=20260816-swatch"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script defer src="../js/supabase-client.bundle.js"></script>
<script defer src="../js/api.js"></script>
<script defer src="../js/copilot-llm.js"></script>
<script>
window.ARCANA_PAGE = async function({ASSET,IC,Store,toast}){
  const M=window.ARCANA_PRODUCT_MAP, PRODUCTS=window.ARCANA_PRODUCTS;
  const productAsset=window.ATELIX_productAsset;
  const leadMap={fabrics:'7–14 days',accessories:'7–12 days',trims:'7–12 days',yarns:'10–15 days',oem:'—'};

  // Discount pricing only exists on the 11.11 sale page (campaign.html) — the PDP
  // always shows the real unit price, whichever surface the shopper arrived from.
  const id=new URLSearchParams(location.search).get('id');
  const bundledProduct=id?M[id]:null;
  let p=null;
  if(id&&window.ARCANA_API?.getPublicProduct){
    p=await window.ARCANA_API.getPublicProduct(id).catch(()=>null);
    if(p){M[id]=p;if(!PRODUCTS.some(product=>product.id===p.id))PRODUCTS.push(p);}
  }
  if(!p) p=bundledProduct;
  if(!p && id && window.ARCANA_API?.getMyPrivateProducts){
    const result=await window.ARCANA_API.getMyPrivateProducts().catch(()=>({products:[]}));
    p=(result.products||[]).find(product=>product.id===id)||null;
    if(p){ M[id]=p; PRODUCTS.push(p); }
  }
  if(!p){
    document.title='Product not found — Atelix';
    const root=document.getElementById('pdpRoot');
    root.classList.remove('pdp-loading');
    root.setAttribute('aria-busy','false');
    root.innerHTML='<section class="panel empty-state"><h1>Product not found</h1><p>This product may have been removed or the link may be incorrect.</p><a class="btn btn-green" href="/categories">Browse categories</a></section>';
    return;
  }
  const isOEM=p.badge==='oem';
  const productOptions=(window.ATELIX_normalizeProductOptions?.(p.options||p.variants)||[]);
  const selectedOptions=Object.fromEntries(productOptions.map(option=>[option.name,option.values[0]]));
  const galleryImages=[...(Array.isArray(p.images)?p.images:[]),p.img].filter(Boolean).filter((image,index,all)=>all.indexOf(image)===index);
  const minimumOrder=Math.max(1,Math.ceil(Number.parseFloat(p.moq)||1));
  const purchasable=p.price>0&&!p.isPrivate;
  const swatchable=p.cat==='fabrics'&&!p.isPrivate;
  const facId=p.factorySlug||Object.values(window.ARCANA_FACTORY_MAP||{}).find(item=>item.databaseId===p.factoryId)?.id||null;
  const factory=facId?window.ARCANA_FACTORY_MAP[facId]:null;
  const catUrl='/categories/'+p.cat;
  const productSubcategories={
    fabrics:[['cotton','Cotton',['cotton']],['linen','Linen',['linen']],['polyester','Polyester',['polyester']],['viscose','Viscose & Rayon',['viscose','rayon','modal']],['knits','Knits',['knit','jersey','rib','fleece']],['denim','Denim',['denim','indigo']]],
    accessories:[['labels','Labels & Tags',['label','tag','patch','badge']],['hardware','Garment Hardware',['hardware','grommet','rivet','buckle','hook','logo plate']]],
    trims:[['zippers','Zippers',['zipper']],['buttons','Buttons',['button']],['interlining','Interlining',['interlining']],['lining','Lining',['lining']],['simple-trims','Tapes & Elastic',['tape','ribbon','elastic','lace','bias','cord','piping']]],
    yarns:[['cotton','Cotton yarn',['cotton']],['polyester','Polyester thread',['polyester']],['viscose','Viscose yarn',['viscose','rayon','modal','cupro']],['wool','Wool yarn',['wool','merino','cashmere']],['nylon','Nylon yarn',['nylon']]],
    oem:[['clothing','Clothing',['jacket','shirt','garment','apparel','clothing']],['accessories','Accessories',['bag','accessor','wallet']],['socks','Socks',['sock','hosiery']]]
  };
  function productSubcategory(product){
    const text=[product.subcategory,product.name,product.comp,product.spec].filter(Boolean).join(' ').toLowerCase();
    return (productSubcategories[product.cat]||[]).find(([slug,label,terms])=>String(product.subcategory||'').toLowerCase()===slug||String(product.subcategory||'').toLowerCase()===label.toLowerCase()||terms.some(term=>text.includes(term)));
  }

  const applicationIconPaths={
    'T-shirt':'<path d="M8 5 4 7l-2 4 4 2v8h12v-8l4-2-2-4-4-2c-.6 1.2-2 2-4 2S8.6 6.2 8 5Z"/>',
    Shirt:'<path d="m8 4-5 3 2 5 3-1v10h8V11l3 1 2-5-5-3c-.5 1.3-2 2-4 2S8.5 5.3 8 4Z"/><path d="m10 7 2 2 2-2M12 9v12"/>',
    Jacket:'<path d="m8 4-4 3-2 6 4 2 2-4v10h8V11l2 4 4-2-2-6-4-3-4 3Z"/><path d="M12 7v14M9 15h2M13 15h2"/>',
    Coat:'<path d="m8 3-4 4-2 7 4 2 2-5v10h8V11l2 5 4-2-2-7-4-4-4 4Z"/><path d="M12 7v14M9 11l3 3 3-3"/>',
    Pants:'<path d="M7 3h10l1 18h-5l-1-10-1 10H6L7 3Z"/><path d="M7 7h10"/>',
    Skirt:'<path d="M8 3h8l3 18H5L8 3Z"/><path d="M7 7h10"/>',
    Dress:'<path d="m9 3 3 3 3-3 2 6-2 2 4 10H5l4-10-2-2 2-6Z"/>',
    Suit:'<path d="m8 3-4 4 2 14h12l2-14-4-4-4 4-4-4Z"/><path d="m9 7 3 5 3-5M12 12v9"/>',
    Knitwear:'<path d="m8 4-5 4 3 5 2-2v10h8V11l2 2 3-5-5-4c-.5 1.2-2 2-4 2S8.5 5.2 8 4Z"/><path d="M9 14h6M9 17h6"/>',
    Bag:'<path d="M5 8h14l1 13H4L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
    Footwear:'<path d="M4 5h6c0 6 3 8 9 9 2 .4 3 1.5 3 3.5S20.5 21 18 21H5c-2 0-3-1-3-3l2-13Z"/>'
  };
  function applicationTypes(product){
    const stored=Array.isArray(product.applicationTypes)?product.applicationTypes:[];
    const legacy=String(product.applications||'').trim();
    if(stored.length)return [...new Set(stored)].filter(type=>applicationIconPaths[type]);
    if(legacy&&legacy!=='Multiple apparel types')return applicationIconPaths[legacy]?[legacy]:[];
    const text=[product.name,product.description,product.subcategory,product.comp].filter(Boolean).join(' ').toLowerCase();
    const rules=[
      ['Coat',/\b(coat|overcoat)\b/],['T-shirt',/\b(t-?shirt|jersey|pique)\b/],
      ['Shirt',/\b(shirt|shirting)\b/],['Jacket',/\b(jacket|varsity|parka|shell|outer layer)\b/],
      ['Pants',/\b(pants|trousers|chino|jeans|denim|corduroy)\b/],['Skirt',/\bskirt\b/],
      ['Dress',/\bdress\b/],['Suit',/\b(suit|tuxedo|formal|herringbone)\b/],
      ['Knitwear',/\b(knit|fleece|boa|cashmere|merino|yarn)\b/],['Bag',/\b(bag|handbag)\b/],
      ['Footwear',/\b(footwear|shoe|boot)\b/]
    ];
    return rules.filter(([,pattern])=>pattern.test(text)).map(([type])=>type).slice(0,3);
  }
  function applicationIcons(product,T,TR,html){
    const types=applicationTypes(product);
    if(!types.length)return '';
    return `<span class="application-icons" role="list" aria-label="${html(T('Best for'))}">${types.map(type=>{
      const translated=TR(type), tooltip=`For ${translated}`;
      return `<span class="application-icon" role="listitem" tabindex="0" data-application="${html(type)}" data-tooltip="${html(tooltip)}" aria-label="${html(tooltip)}" title="${html(tooltip)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${applicationIconPaths[type]}</svg></span>`;
    }).join('')}</span>`;
  }

  function build(){
    const TR=window.ARCANA_TR, T=window.ARCANA_T, money=window.ARCANA_money, productMoney=window.ATELIX_productMoney;
    const publicValue=value=>TR((window.ATELIX_publicValue||((item)=>item||T('Contact supplier')))(value));
    const html=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const nm=TR(p.name), comp=TR(p.comp), seller=TR(p.seller), loc=TR(p.loc);
    const certs=(p.certs||[]).map(TR).join(' · ');
    const supplierHighlight=factory&&factory.highlight ? TR(factory.highlight) : '';
    const requester=Store.session()?.name||T('Guest');
    const productLines=(quantity,extra)=>[
      `${T('Product')}: ${nm} (SKU: ${p.id})`,
      ...Object.entries(selectedOptions).map(([name,value])=>`${name}: ${value}`),
      ...(quantity?[`${T('Quantity requested')}: ${quantity} ${TR(p.unit)}`]:[]),
      `${T('Composition')}: ${publicValue(comp)}`,
      `${T('Specification')}: ${publicValue(p.spec||p.construction)}`,
      `MOQ: ${publicValue(p.moq)}`,
      `${T('Supplier')}: ${seller}, ${loc}`,
      ...(extra||[]),
    ];
    const contactHref=(subjectPrefix,quantity,extra)=>{
      const subject=`${subjectPrefix} - ${requester}`;
      const body=productLines(quantity,extra).filter(Boolean).join('\n');
      return `mailto:info@arcanawangsa.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    };
    document.title = `${nm} — ${seller} — Atelix`;
    const catLabel=TR({fabrics:'Fabrics',accessories:'Accessories',trims:'Trims',yarns:'Yarns & Threads',oem:'OEM Services'}[p.cat]);
    const subcategory=productSubcategory(p);
    // A product is a destination, not another catalog level. The hierarchy
    // ends at L3 when available, or L2 when the product is not classified yet.
    const subcategoryUrl=subcategory?`${catUrl}/${subcategory[0]}`:'';
    const breadcrumbItems=[['Home','/'],['All categories','/categories'],[catLabel,subcategory?catUrl:'']];
    if(subcategory)breadcrumbItems.push([TR(subcategory[1]),subcategoryUrl]);
    const mobileBack=document.querySelector('.mobile-back');
    if(mobileBack){
      const backLabel=TR(subcategory?subcategory[1]:catLabel);
      mobileBack.href=subcategoryUrl||catUrl;
      mobileBack.setAttribute('aria-label',`Back to ${backLabel}`);
    }
    const supplierCity=String(loc||'').split(',')[0].trim();
    const supplierCountry=TR(String(p.origin_country||p.country||loc||'').split(',').pop().trim());
    const supplierParts=[seller,supplierCountry,supplierCity].filter((value,index,all)=>value&&all.indexOf(value)===index);
    const sanitizeRichText=window.ATELIX_sanitizeRichText||(value=>String(value||''));
    const productSummary=sanitizeRichText(p.description||TR(`A ${comp||catLabel.toLowerCase()} product for considered sourcing and development.`));
    const swatchFaq={question:T('Can I order a swatch?'),answer:T('Yes. Add a fabric swatch to your cart for a flat $4 to check whether the fabric is right for your project before placing a material order.')};
    const fallbackFaqs=[
      {question:T('How should I confirm colour and hand feel?'),answer:T('Add a $4 swatch to your cart before production. Screen colours and textile lots can vary.')},
      {question:T('What should I confirm before ordering?'),answer:T('Confirm the current specification, minimum order, lead time, care requirements, and intended application with the supplier.')}
    ];
    const sourceFaqs=(Array.isArray(p.faqs)&&p.faqs.length?p.faqs:fallbackFaqs).filter(item=>item&&item.question&&item.answer);
    const productFaqs=p.cat==='fabrics'
      ? [swatchFaq,...sourceFaqs.filter(item=>String(item.question).trim()!==swatchFaq.question)]
      : sourceFaqs;
    const productSpecs=[
      [T('Material'),publicValue(comp)],[T('Construction'),publicValue(p.construction)],
      [T('Weight'),publicValue(p.gsm)],[T('Width'),publicValue(p.fabric_width)],
      [T('Roll length'),publicValue(p.roll_length)],[T('Style code'),publicValue(p.style_code)],
      [T('Category'),catLabel+(p.subcategory?` · ${TR(p.subcategory)}`:'')],
      [T('Best for'),applicationIcons(p,T,TR,html)||publicValue(null),true],[T('Season'),publicValue(p.season)],
      [T('Colour family'),publicValue(p.color_family)],[T('Certifications'),publicValue(certs)]
    ];
    const sourcingSpecs=[[T('Order unit'),publicValue(p.unit)],['MOQ',publicValue(p.moq)],['Lead time',publicValue(p.lead_time||p.lt)],['Origin',publicValue(p.origin_country||p.country||String(p.loc||'').split(',').pop().trim())]];

    const verifiedSupplier=p.supplierVerified!==false;
    const trustRow=verifiedSupplier?`<div class="pdp-trust">
      <span class="pdp-trust-badge"><svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>${T('Verified supplier')}</span>
      ${(p.certs||[]).slice(0,3).map(c=>`<span class="pdp-trust-cert">${html(TR(c))}</span>`).join('')}
    </div>`:''

    const root=document.getElementById('pdpRoot');
    root.classList.remove('pdp-loading');
    root.setAttribute('aria-busy','false');
    root.innerHTML=`
    <nav class="crumbs" aria-label="Breadcrumb"><ol>${breadcrumbItems.map(([label,href],index)=>`<li>${href?`<a href="${href}">${label}</a>`:`<span aria-current="page">${label}</span>`}</li>`).join('')}</ol></nav>
    <div class="pdp">
      <!-- Gallery: col 1 row 1 desktop · top mobile -->
      <div class="pdp-gallery-col">
        <div class="gallery">
          <div class="main">${isOEM?`<span class="badge b-oem">OEM</span>`:''}<img data-gallery-main src="${productAsset({img:galleryImages[0]||p.img})}" alt="${nm}" loading="eager" decoding="async" fetchpriority="high">
            ${supplierHighlight ? `<div class="supplier-highlight" aria-label="${T('Supplier highlight')}: ${supplierHighlight}">${IC.factory}<span><small>${T('Supplier highlight')}</small><b>${supplierHighlight}</b></span></div>` : ''}
          </div>
          ${galleryImages.length>1?`<div class="pdp-thumbnails" aria-label="${T('Product images')}">${galleryImages.map((image,index)=>`<button type="button" data-gallery-image="${productAsset({img:image})}" aria-label="${nm}, ${T('view')} ${index+1}" aria-pressed="${index===0}"><img src="${productAsset({img:image})}" alt="" loading="lazy" decoding="async"></button>`).join('')}</div>`:''}
        </div>
      </div>
      <!-- Sticky panel: col 2 spans rows desktop · second on mobile -->
      <div class="pdp-sticky-panel">
        <div class="titlebar">
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
            ${isOEM
              ? `<span class="badge b-oem-soft"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block"></span> ${p.cat==='oem'?T('OEM Service'):T('OEM Available')}</span>`
              : `<span class="badge b-nonoem">${T('Non-OEM')}</span>`}
          </div>
        </div>
        <h1>${nm}</h1>
        <p class="desc pdp-supplier-line">${supplierParts.join(' · ')}</p>
        ${trustRow}
        ${purchasable?`<div class="price-box">
          <div><div class="big">${productMoney(p)} <small>/${TR(p.unit)}</small></div></div>
          <p class="pdp-price-note">Price varies by quantity and specs. Confirm with supplier.</p>
        </div>`:''}
        ${productOptions.length?`<div class="pdp-options" aria-label="${T('Product options')}">${productOptions.map((option,optionIndex)=>`<div class="pdp-option-group" data-product-option="${optionIndex}"><div class="pdp-option-head"><span>${html(option.name)}</span><small class="muted">${option.values.length} ${T('options')}</small></div><div class="pdp-option-scroll" role="group" aria-label="${html(option.name)}">${option.values.map((value,valueIndex)=>`<label class="pdp-option-pill"><input type="radio" name="product-option-${optionIndex}" value="${html(value)}" ${valueIndex===0?'checked':''}><span>${html(value)}</span></label>`).join('')}</div></div>`).join('')}</div>`:''}
        ${purchasable?`<div class="buy-row"><div class="buy-qty"><label class="buy-qty-lbl" for="pdpQuantity">${T('Quantity')}</label>
          <div class="qty" data-qty id="pdpQty"><button type="button" data-dec aria-label="${T('Decrease quantity')}">−</button><input type="number" id="pdpQuantity" value="${minimumOrder}" min="${minimumOrder}" max="${window.ARCANA_MAX_QTY}" maxlength="${String(window.ARCANA_MAX_QTY).length}" step="1" inputmode="numeric" aria-label="${T('Quantity')}"><button type="button" data-inc aria-label="${T('Increase quantity')}">+</button></div>
        </div></div>`:''}
        <div class="pdp-cta${purchasable?'':' pdp-cta--quote'}">
          ${purchasable
            ? `<button class="btn btn-gold" type="button" id="addBtn">${IC.cart} <span class="cta-full">${T('Add to Cart')}</span><span class="cta-short">+ Cart</span></button><button class="btn btn-green" type="button" id="buyBtn">${T('Buy Now')}</button>
               ${swatchable?`<button class="btn btn-out" type="button" id="swatchBtn">${IC.cart} ${T('Add swatch')} · ${money(4)}</button>`:''}
               <button class="btn btn-out" type="button" id="emailBtn">${IC.msg} <span class="cta-full">${T('Message supplier')}</span></button>`
            : `${swatchable?`<button class="btn btn-out" type="button" id="swatchBtn">${IC.cart} ${T('Add swatch')} · ${money(4)}</button>`:''}<button class="btn btn-gold" type="button" id="emailBtn">${IC.msg} ${T('Message supplier')}</button>`}
        </div>
        <div class="pdp-mini">
          <button class="fav pdp-save" data-fav-id="${p.id}" aria-pressed="${Store.isSaved(p.id)}">${IC.heart} <span>${T('Wishlist')}</span></button>
          <button class="pdp-share" data-share>${IC.share} ${T('Share')}</button>
        </div>
        <a class="pdp-supplier" href="${facId?`supplier.html?id=${facId}`:catUrl}">
          <span class="ps-logo">${IC.factory}</span>
          <span class="ps-info"><b>${seller}</b><span>${[loc,p.supplierVerified===false?T('Supplier'):T('Verified supplier')].filter(Boolean).join(' · ')}</span></span>
          <span class="ps-view">${facId?T('View factory'):T('View supplier')} ${IC.chevR}</span>
        </a>
      </div>
      <!-- Tabbed specs: col 1 row 2 desktop · third on mobile -->
      <div class="pdp-details">
        <div class="pdp-tab-list" role="tablist" aria-label="${T('Product details')}">
          <button class="pdp-tab-btn" role="tab" aria-selected="true" aria-controls="pdp-tab-about" id="pdp-tbtn-about">${T('About')}</button>
          <button class="pdp-tab-btn" role="tab" aria-selected="false" aria-controls="pdp-tab-specs" id="pdp-tbtn-specs">${T('Specifications')}</button>
          <button class="pdp-tab-btn" role="tab" aria-selected="false" aria-controls="pdp-tab-sourcing" id="pdp-tbtn-sourcing">${T('Sourcing')}</button>
        </div>
        <div class="pdp-tab-panel" role="tabpanel" id="pdp-tab-about" aria-labelledby="pdp-tbtn-about">
          <div class="pdp-about"><div class="rich-content">${productSummary}</div></div>
        </div>
        <div class="pdp-tab-panel" role="tabpanel" id="pdp-tab-specs" aria-labelledby="pdp-tbtn-specs" hidden>
          <section class="pdp-spec-panel"><dl>${productSpecs.filter(([,v])=>v&&v!=='—').map(([label,value,isHtml])=>`<div><dt>${label}</dt><dd>${isHtml?value:html(value)}</dd></div>`).join('')}</dl></section>
        </div>
        <div class="pdp-tab-panel" role="tabpanel" id="pdp-tab-sourcing" aria-labelledby="pdp-tbtn-sourcing" hidden>
          <section class="pdp-spec-panel pdp-sourcing"><dl>${sourcingSpecs.filter(([,v])=>v&&v!=='—').map(([label,value])=>`<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>${p.handling_notes?`<div class="pdp-handling"><b>${T('Handling')}</b><div class="rich-content">${sanitizeRichText(p.handling_notes)}</div></div>`:''}${productFaqs.length?`<div class="pdp-handling"><b>${T('Important to read')}</b><div class="help-faqs">${productFaqs.map((item,index)=>`<details${index===0?' open':''}><summary>${html(item.question)}<span aria-hidden="true">+</span></summary><div><p>${html(item.answer)}</p></div></details>`).join('')}</div></div>`:''}</section>
        </div>
      </div>
    </div>
    ${isOEM && p.cat!=='oem' ? oemSection(T,TR,money) : ''}
    ${(()=>{const sp=PRODUCTS.filter(x=>x.seller===p.seller&&x.id!==p.id).slice(0,8);return sp.length?`<section class="section pdp-supplier-strip"><div class="sec-head"><h2>${T('More from')} ${html(seller)}</h2>${facId?`<a class="link-arrow" href="supplier.html?id=${facId}">${T('View factory')} ${IC.chevR}</a>`:''}</div><div class="pdp-hscroll">${sp.map(x=>window.ARCANA_card(x,{href:'product.html?id='+x.id})).join('')}</div></section>`:''})()}
    <section class="section">
      <div class="sec-head"><h2 style="font-family:var(--sans);font-size:1.25rem;font-weight:600">${T('More in')} ${catLabel}</h2><a class="link-arrow" href="${catUrl}">${T('View all')} ${IC.chevR}</a></div>
      <div class="prod-grid">${PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,6).map(x=>window.ARCANA_card(x,{href:'product.html?id='+x.id})).join('')||`<p class="muted">—</p>`}</div>
    </section>
    <!-- Lightbox -->
    <dialog class="pdp-lightbox" id="pdpLightbox" aria-label="${T('Image viewer')}">
      <div class="lb-inner">
        <img class="lb-img" src="${productAsset({img:galleryImages[0]||p.img})}" alt="${nm}" id="lbImg">
        <button class="lb-close" id="lbClose" aria-label="${T('Close')}">×</button>
        <button class="lb-prev" id="lbPrev" aria-label="${T('Previous image')}" hidden>‹</button>
        <button class="lb-next" id="lbNext" aria-label="${T('Next image')}" hidden>›</button>
      </div>
    </dialog>`;

    // ── Tab wiring ──
    const tabBtns=[...document.querySelectorAll('.pdp-tab-btn')];
    const tabPanels=[...document.querySelectorAll('.pdp-tab-panel')];
    tabBtns.forEach((btn,i)=>{
      btn.addEventListener('click',()=>{
        tabBtns.forEach((b,j)=>{b.setAttribute('aria-selected',String(i===j));tabPanels[j].hidden=i!==j;});
      });
    });

    // ── Quantity stepper wiring ──
    const qi=document.querySelector('#pdpQty input');
    const clampQty=v=>window.ARCANA_clampQty(v,minimumOrder);
    if(qi){
      document.querySelector('#pdpQty [data-dec]').onclick=()=>qi.value=clampQty((+qi.value||minimumOrder)-1);
      document.querySelector('#pdpQty [data-inc]').onclick=()=>qi.value=clampQty((+qi.value||minimumOrder)+1);
      qi.addEventListener('input',()=>{if(qi.value.length>qi.maxLength)qi.value=qi.value.slice(0,qi.maxLength);});
      qi.addEventListener('change',()=>{qi.value=clampQty(qi.value);});
    }

    // ── CTA wiring ──
    const add=document.getElementById('addBtn');
    if(add) add.addEventListener('click',()=>{Store.addToCart(p.id,clampQty(qi.value),selectedOptions);toast(`${TR(p.name)} — ${T('Added to cart')}`,{href:'cart.html',label:T('View cart')});});
    const buy=document.getElementById('buyBtn');
    if(buy) buy.addEventListener('click',()=>{Store.addToCart(p.id,clampQty(qi.value),selectedOptions);Store.beginCheckout?.();location.href='checkout.html';});
    const swatch=document.getElementById('swatchBtn');
    if(swatch) swatch.addEventListener('click',()=>{Store.addToCart(p.id,1,selectedOptions,'swatch');toast(`${TR(p.name)} — ${T('Swatch added to cart')}`,{href:'cart.html',label:T('View cart')});});
    const emailBtn=document.getElementById('emailBtn');
    if(emailBtn) emailBtn.addEventListener('click', e=>{
      e.preventDefault();
      if(p.factoryId && window.ARCANA_chatDrawer){
        window.ARCANA_chatDrawer.open({factoryId:p.factoryId, factoryName:seller, factoryLogo:factory&&(factory.logo_img||factory.img)});
      } else {
        window.ARCANA_contactEmail({subjectPrefix:T('Product request'), bodyLines:productLines(qi?.value)});
      }
    });

    // ── Product options wiring ──
    document.querySelectorAll('[data-product-option]').forEach((el,optionIndex)=>{
      const option=productOptions[optionIndex];
      el.querySelectorAll('input[type="radio"]').forEach(input=>input.addEventListener('change',()=>{
        if(!input.checked)return;
        selectedOptions[option.name]=input.value;
      }));
    });

    // ── Gallery thumbnail wiring ──
    const galleryMain=document.querySelector('[data-gallery-main]');
    document.querySelectorAll('[data-gallery-image]').forEach(button=>button.addEventListener('click',()=>{
      galleryMain.src=button.dataset.galleryImage;
      document.querySelectorAll('[data-gallery-image]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    }));

    // ── Lightbox wiring ──
    const lightbox=document.getElementById('pdpLightbox');
    const lbImg=document.getElementById('lbImg');
    const lbClose=document.getElementById('lbClose');
    const lbPrev=document.getElementById('lbPrev');
    const lbNext=document.getElementById('lbNext');
    let lbIndex=0;
    function openLightbox(index){
      lbIndex=Math.max(0,Math.min(index,galleryImages.length-1));
      lbImg.src=productAsset({img:galleryImages[lbIndex]});
      if(lbPrev) lbPrev.hidden=galleryImages.length<=1;
      if(lbNext) lbNext.hidden=galleryImages.length<=1;
      lightbox?.showModal();
    }
    function closeLightbox(){ lightbox?.close(); }
    if(lightbox){
      galleryMain.addEventListener('click',()=>openLightbox(lbIndex));
      lbClose?.addEventListener('click',closeLightbox);
      lbPrev?.addEventListener('click',()=>{ lbIndex=(lbIndex-1+galleryImages.length)%galleryImages.length; lbImg.src=productAsset({img:galleryImages[lbIndex]}); });
      lbNext?.addEventListener('click',()=>{ lbIndex=(lbIndex+1)%galleryImages.length; lbImg.src=productAsset({img:galleryImages[lbIndex]}); });
      lightbox.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLightbox(); if(e.key==='ArrowLeft') lbPrev?.click(); if(e.key==='ArrowRight') lbNext?.click(); });
      lightbox.addEventListener('click',e=>{ if(e.target===lightbox) closeLightbox(); });
      document.querySelectorAll('[data-gallery-image]').forEach((button,i)=>{
        button.addEventListener('click',()=>{ lbIndex=i+1; });
      });
    }

    // ── OEM package wiring ──
    const oemBtn=document.getElementById('oemContactBtn');
    if(oemBtn) oemBtn.addEventListener('click', ()=>{
      if(p.factoryId && window.ARCANA_chatDrawer){
        window.ARCANA_chatDrawer.open({factoryId:p.factoryId, factoryName:seller, factoryLogo:factory&&(factory.logo_img||factory.img)});
      } else {
        window.ARCANA_contactEmail({subjectPrefix:T('OEM request'), bodyLines:productLines(qi?.value)});
      }
    });

    // ── Wishlist + share wiring ──
    const sv=document.querySelector('.pdp-save'); sv.classList.toggle('on',Store.isSaved(p.id));
    sv.addEventListener('click',e=>{e.preventDefault();const on=Store.toggleSaved(p.id);sv.classList.toggle('on',on);sv.setAttribute('aria-pressed',String(on));toast(on?T('Saved to your list'):T('Removed from list'), on?{href:'wishlist.html',label:T('View wishlist')}:undefined);});
    document.querySelector('[data-share]').addEventListener('click',async()=>{
      try{
        if(navigator.clipboard?.writeText) await navigator.clipboard.writeText(location.href);
        else{
          const copy=document.createElement('textarea');
          copy.value=location.href;copy.setAttribute('readonly','');copy.style.position='fixed';copy.style.opacity='0';
          document.body.appendChild(copy);copy.select();
          const copied=document.execCommand('copy');copy.remove();
          if(!copied) throw new Error('copy unavailable');
        }
        toast(T('Product link copied'));
      }catch(_){toast(T('Could not copy product link'));}
    });
    document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();toast(b.dataset.toast);}));
    window.ARCANA_wireCards(document.querySelector('.prod-grid'));

    // ── Copilot match panel ──
    // Only for a product that was ACTUALLY in the most recent Copilot result set
    // (scoped to this tab, see components.js's ARCANA_getCopilotMatchFor).
    const brief=window.ARCANA_Copilot&&window.ARCANA_Copilot.getBrief();
    const r=window.ARCANA_getCopilotMatchFor&&window.ARCANA_getCopilotMatchFor(p.id);
    if(r&&brief&&brief.text){
      const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 4 4 10-11"/></svg>';
      const DSH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14"/></svg>';
      const hits=r.hits.map(h=>`<span class="cop-hit">${CHK}${h}</span>`).join('');
      const miss=r.miss.map(m=>`<span class="cop-missc">${DSH}${m}</span>`).join('');
      const panel=document.createElement('div'); panel.className='cop-match cop-reveal';
      panel.innerHTML=`
        <div class="cm-head">
          <div class="cop-score" style="--v:${r.score}"><b>${r.score}</b></div>
          <div class="cm-title">Matches your Athelia search · ${r.score}%<span>"${brief.text}"</span></div>
        </div>
        <div class="cop-chips">${hits}${miss}</div>`;
      const sg=document.querySelector('.pdp-details'); if(sg) sg.insertAdjacentElement('afterend',panel);
      requestAnimationFrame(()=>requestAnimationFrame(()=>panel.classList.add('in')));
    }
  }

  function oemSection(T,TR,money){
    const pk=(n,title,tag,bullets,price)=>`<div class="pkg" data-pkg><input class="pkg-radio" type="radio" name="oem-package" value="${n}" aria-label="${n}. ${title}"${n===1?' checked':''}><span class="pnum">${IC.factory}</span><h4>${n}. ${title}</h4><div class="tag">${tag}</div><ul>${bullets.map(b=>`<li>${b}</li>`).join('')}</ul><div class="from">${price}</div></div>`;
    return `
    <section class="oem-section section" data-pkg-group>
      <div class="oem-intro"><h2>${T('OEM Services')}</h2><span class="badge b-oem-soft" style="margin-top:14px">${T('Built for Your Brand')}</span>
        <p>${T('oemIntroPre')}${TR(p.seller)}${T('oemIntroPost')}</p>
        <button class="btn btn-gold" id="oemContactBtn" style="margin-top:18px">${IC.msg||''} ${T('Contact us')}</button></div>
      <div class="oem-packages" role="radiogroup" aria-label="${T('OEM Services')}">
        ${pk(1,T('Sampling Package'),T('Validate quality & design'),[T('Up to 3 samples'),T('Swatch & color cards'),T('Lab testing support'),`5–7 ${TR('days')} ${T('turnaround')}`],`<b>${money(45)}</b>`)}
        ${pk(2,T('Private Label'),T('Build your brand identity'),[T('Custom labels & tags'),T('Branded packaging'),T('Care label customization'),`10–14 ${TR('days')} ${T('turnaround')}`],`<b>${money(180)}</b>`)}
        ${pk(3,T('Color Matching'),T('Match your exact shade'),[T('Custom color development'),T('Lab dip & approval'),T('Fastness testing'),`10–14 ${TR('days')} ${T('turnaround')}`],`<b>${money(120)}</b>`)}
        ${pk(4,T('Bulk Production'),T('Scale with confidence'),[T('Bulk production'),T('In-line QC'),T('Final inspection (AQL)'),T('On-time delivery')],`<b>${T('Custom')}</b>`)}
      </div>
    </section>`;
  }

  build();
  window.ARCANA_onLang(build);

  const convoParam=new URLSearchParams(location.search).get('convo');
  if(convoParam && window.ARCANA_chatDrawer){
    window.ARCANA_chatDrawer.openConversation(convoParam, seller);
  }
};
</script>
</body>
</html>
