<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue release progress</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/pages.css"><style>body{background:var(--bg);color:var(--ink)}main{max-width:720px;margin:clamp(32px,8vw,88px) auto;padding:0 20px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:clamp(20px,4vw,32px)}h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px;letter-spacing:-.025em}p{color:var(--muted)}.count{font-size:clamp(44px,10vw,82px);font-weight:600;letter-spacing:-.04em;margin:32px 0 4px}.bar{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden;margin:18px 0}.bar span{display:block;height:100%;background:var(--green);transition:width .35s ease}.stats{display:flex;justify-content:space-between;gap:16px;font-size:14px}.status{font-size:13px;margin-top:24px}a{color:var(--ink)}</style></head><body><main><a href="/">← Atelix</a><section class="panel" aria-live="polite"><h1>Catalogue release</h1><p>Live verified products in the current release.</p><div class="count" id="count">—</div><div id="label">Loading…</div><div class="bar" aria-hidden="true"><span id="bar"></span></div><div class="stats"><span id="remaining">— remaining</span><span id="suppliers">— suppliers</span></div><p class="status" id="status">Refreshes every 5 seconds.</p></section></main><script>const $=id=>document.getElementById(id);async function refresh(){try{const r=await fetch('/__local_catalog/release-progress',{cache:'no-store'}),d=await r.json();if(!r.ok)throw Error(d.error);$('count').textContent=d.verified_products.toLocaleString();$('label').textContent=`of ${d.total_products.toLocaleString()} products verified`;$('bar').style.width=`${d.verified_products/d.total_products*100}%`;$('remaining').textContent=`${d.remaining_products.toLocaleString()} remaining`;$('suppliers').textContent=`${d.verified_suppliers}/${d.total_suppliers} suppliers`;$('status').textContent=`Updated ${new Date(d.updated_at).toLocaleTimeString()}`;}catch(e){$('status').textContent=`Tracker unavailable: ${e.message}`}}refresh();setInterval(refresh,5000);</script></body></html>
