<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Atelix</title>
<meta name="description" content="Review shipping details and submit an Atelix sourcing order.">
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-catalog data-hdr="b" data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap" style="padding-bottom:40px">
  <div id="coRoot" class="checkout-loading" aria-busy="true" aria-live="polite">
    <div class="checkout-loading-flow" aria-hidden="true">
      <div class="checkout-loading-block"><i class="checkout-sk-line checkout-sk-line--heading"></i><i class="checkout-sk-line checkout-sk-line--wide"></i><i class="checkout-sk-line checkout-sk-line--medium"></i></div>
      <div class="checkout-loading-block checkout-loading-items"><i class="checkout-sk-line checkout-sk-line--heading"></i><i class="checkout-sk-line checkout-sk-line--wide"></i><i class="checkout-sk-line checkout-sk-line--wide"></i><i class="checkout-sk-line checkout-sk-line--medium"></i></div>
      <div class="checkout-loading-block checkout-loading-note"><i class="checkout-sk-line checkout-sk-line--wide"></i><i class="checkout-sk-line checkout-sk-line--medium"></i></div>
    </div>
    <aside class="checkout-loading-summary" aria-hidden="true"><i class="checkout-sk-line checkout-sk-line--heading"></i><i class="checkout-sk-line"></i><i class="checkout-sk-line"></i><i class="checkout-sk-line checkout-sk-line--medium"></i><i class="checkout-sk-button"></i></aside>
    <span class="sr-only">Loading checkout details</span>
  </div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/components.js?v=20260816-swatch"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script src="../js/address-book.js"></script>
<script>
window.ARCANA_PAGE = async function({ASSET,IC,Store,toast}){
  const M=window.ARCANA_PRODUCT_MAP, root=document.getElementById('coRoot');
  const productMoney=(p,qty=1)=>window.ATELIX_productMoney(p,qty);
  const productAmount=(p,qty=1)=>window.ATELIX_productAmount(p,qty);
  const currencyMoney=n=>window.ATELIX_currencyMoney(n);
  const TR=window.ARCANA_TR, T=window.ARCANA_T;
  const text=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const optionSummary=item=>Object.entries(item.options||{}).map(([name,value])=>`${text(name)}: ${text(value)}`).join(' · ');
  const isSwatch=item=>item.lineType==='swatch';
  const itemMinimum=(product,item)=>isSwatch(item)?1:Math.max(1,Math.ceil(Number.parseFloat(product.moq)||1));
  const swatchUnit=()=>productAmount({price:4},1);
  const unitPrice=(product,item)=>isSwatch(item)?swatchUnit():productAmount(product,1);
  const lineAmount=(product,item)=>unitPrice(product,item)*item.qty;
  const itemName=(product,item)=>isSwatch(item)?`${T('Swatch')} — ${TR(product.name)}`:TR(product.name);
  const renderRoot=html=>{root.setAttribute('aria-busy','false');root.classList.remove('checkout-loading');root.innerHTML=html;};
  // Read the cart captured at checkout intent so an in-flight account sync
  // cannot replace the buyer's local selection during page navigation.
  const cart=(Store.checkoutCart?Store.checkoutCart():Store.cart()).filter(i=>M[i.id]);
  cart.forEach(i=>{
    const minimum=itemMinimum(M[i.id],i);
    if(i.qty<minimum){i.qty=minimum;Store.setQty(i.key||i.id,minimum);}
  });
  const subtotal=cart.reduce((sum,item)=>sum+lineAmount(M[item.id],item),0);
  const fee=+(subtotal*0.05).toFixed(2);
  const baseTotal=subtotal+fee;
  const defaultShippingQuote=country=>({id:null,country_code:null,country_name:country||'',service_name:'Standard shipping',flat_rate_usd:10,eta_min_days:null,eta_max_days:null,is_default:true});
  let selectedAddress=null;
  let shippingQuote=defaultShippingQuote();
  let quoteLoading=false;
  let addressBook=null;

  if(!cart.length){
    renderRoot(`<div class="panel cart-empty"><span class="ce-ic">${IC.cart}</span><h1>${T('Nothing to check out')}</h1><p>${T('Your cart is empty.')}</p><a class="btn btn-green" href="/categories/fabrics">${T('Browse fabrics')}</a></div>`);
    return;
  }
  if(cart.some(item=>!isSwatch(item)&&(M[item.id].pricingMode==='quote'||!(M[item.id].price>0)))){
    renderRoot(`<div class="panel cart-empty"><span class="ce-ic">${IC.msg}</span><h1>${T('Contact supplier')}</h1><p>${T('Volume pricing shared on quote')}</p><a class="btn btn-green" href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent('Quote request from cart')}">${T('Contact supplier')}</a><a class="btn btn-out" href="cart.html">${T('View cart')}</a></div>`);
    return;
  }

  // Checkout requires a signed-in buyer because place_order is account-scoped.
  const profile = await window.ARCANA_API.getSessionProfile();
  if(!profile){
    renderRoot(`<div class="panel cart-empty" style="max-width:520px;margin:0 auto">
      <span class="ce-ic">${IC.lock}</span>
      <h1>Log in to check out</h1>
      <p>Sign in to your Atelix account to submit this order. Your cart is saved.</p>
      <a class="btn btn-green" href="login.html?next=checkout.html">Log in to continue</a>
      <p style="margin-top:14px;font-size:.9375rem;color:var(--muted)">New to Atelix? <a href="signup.html" style="color:var(--green);font-weight:600">Create an account</a></p>
    </div>`);
    return;
  }
  const rates=await window.ARCANA_API.getShippingRates();
  const paymentNote=`<strong>Secure payment with Stripe</strong><span>After you confirm the order, you’ll be redirected to Stripe Checkout to review and pay securely.</span>`;
  const groups=[];
  cart.forEach(item=>{
    const product=M[item.id],key=product.factoryId||product.seller||'supplier';
    let group=groups.find(entry=>String(entry.key)===String(key));
    if(!group){group={key,name:product.seller||'Supplier',items:[]};groups.push(group);}
    group.items.push(item);
  });
  const supplierItems=groups.map(group=>`<div class="checkout-supplier">
    <header><span aria-hidden="true">${IC.factory}</span><strong>${text(group.name)}</strong></header>
    ${group.items.map(item=>{const product=M[item.id],options=optionSummary(item),itemIndex=cart.indexOf(item),swatch=isSwatch(item);return `<div class="checkout-item">
      <img src="${window.ATELIX_productAsset(product)}" alt="${text(product.name)}">
      <div><a href="product.html?id=${encodeURIComponent(product.id)}">${text(itemName(product,item))}</a>${options?`<p>${options}</p>`:''}<p>${item.qty} × ${swatch?currencyMoney(swatchUnit()):productMoney(product)}</p></div>
      <strong>${currencyMoney(lineAmount(product,item))}</strong>
      <label class="checkout-item-note"><span>Note for supplier <small>Optional</small></span><textarea maxlength="300" data-item-note="${itemIndex}" aria-label="Note for ${text(itemName(product,item))}" placeholder="Color matching, packaging, or handling instructions for this item"></textarea><small><span data-item-note-count>0</span>/300</small></label>
    </div>`;}).join('')}
  </div>`).join('');
  const shippingAmount=()=>{
    const lang=document.documentElement.lang||'en',fx=window.ARCANA_FX[lang]||window.ARCANA_FX.en;
    const raw=Number(shippingQuote.flat_rate_usd||0)*fx.rate,increment=Number(fx.increment)||.01;
    return Math.ceil((raw-Number.EPSILON)/increment)*increment;
  };

  renderRoot(`<header class="checkout-page-head"><h1>Checkout</h1><p>Confirm delivery and review the final total before placing your order.</p></header>
    <div class="co-wrap">
      <div class="checkout-flow">
        <section class="panel checkout-block" aria-labelledby="deliveryTitle">
          <header class="checkout-block-head"><div><span class="checkout-step">1</span><h2 id="deliveryTitle">Delivery address</h2></div><button class="btn btn-out" type="button" data-address-picker>Change</button></header>
          <div id="selectedAddress" class="checkout-address"></div>
        </section>
        <section class="panel checkout-block" aria-labelledby="itemsTitle">
          <header class="checkout-block-head"><div><span class="checkout-step">2</span><h2 id="itemsTitle">Items (${cart.length})</h2></div><a href="cart.html">Edit cart</a></header>
          <div class="checkout-suppliers">${supplierItems}</div>
        </section>
        <section class="checkout-payment-note" aria-label="Payment information">${IC.shield}<p>${paymentNote}</p></section>
      </div>
      <aside><section class="panel summary checkout-summary">
        <h3>${T('Order Summary')}</h3>
        <div class="sum-row"><span class="k">${T('Subtotal')}</span><span>${currencyMoney(subtotal)}</span></div>
        <div class="sum-row"><span class="k">${T('Service fee (5%)')}</span><span>${currencyMoney(fee)}</span></div>
        <div class="sum-row"><span class="k">${T('Shipping')}</span><span id="summaryShipping">${window.ARCANA_money(10)}</span></div>
        <div class="checkout-promo" aria-labelledby="promoLabel"><label id="promoLabel" for="checkoutPromo">Discount code</label><div class="checkout-promo-row"><input id="checkoutPromo" autocomplete="off" placeholder="Enter code"><button class="btn btn-out" type="button" data-promo-apply>Apply</button></div><p id="promoHelp" class="checkout-place-help" aria-live="polite">Applied securely at payment.</p></div>
        <div class="cart-summary-total"><span>${T('Total')}</span><strong id="summaryTotal">${currencyMoney(baseTotal+shippingAmount())}</strong></div>
        <button class="btn btn-gold btn-block cart-summary-action" type="button" data-place disabled>Review and pay</button>
        <p class="checkout-place-help" id="placeHelp">Select an address to continue.</p>
        <div class="secure-note"><span>${IC.lock} Order details are sent over an encrypted connection</span></div>
      </section></aside>
    </div>
    <dialog class="address-picker" aria-labelledby="addressPickerTitle">
      <div class="address-picker-shell">
        <header class="address-picker-head"><div><h2 id="addressPickerTitle">Choose a delivery address</h2><p>Select, add, or update a saved address.</p></div><button type="button" data-picker-close aria-label="Close address list">×</button></header>
        <div class="address-picker-tools"><label class="address-search"><span class="sr-only">Search saved addresses</span><input id="checkoutAddressSearch" type="search" placeholder="Search by label, city, or country"></label><button class="btn btn-green" type="button" id="checkoutAddAddress">+ Add address</button></div>
        <div id="checkoutAddressList" class="address-list address-picker-list"></div>
      </div>
    </dialog>`);

  const picker=root.querySelector('.address-picker');
  const pickerTrigger=root.querySelector('[data-address-picker]');
  const promoInput=root.querySelector('#checkoutPromo'),promoHelp=root.querySelector('#promoHelp');
  promoInput.value=sessionStorage.getItem('arcana_checkout_promo')||'';
  function savePromo(){const value=promoInput.value.trim();if(value){sessionStorage.setItem('arcana_checkout_promo',value);promoHelp.textContent='Code saved. Stripe will validate it before payment.';}else{sessionStorage.removeItem('arcana_checkout_promo');promoHelp.textContent='Applied securely at payment.';}}

  function updateAddress(){
    const target=document.getElementById('selectedAddress');
    if(!selectedAddress){
      pickerTrigger.hidden=false;
      pickerTrigger.textContent='Add address';
      target.innerHTML=`<div class="checkout-empty-address"><div><strong>No delivery address selected</strong><p>Add an address to continue with the $10 default shipping rate.</p></div></div>`;
      return;
    }
    pickerTrigger.hidden=false;
    pickerTrigger.textContent='Change';
    target.innerHTML=`<div class="checkout-address-title"><strong>${text(selectedAddress.label||'Delivery address')}</strong>${selectedAddress.is_default?'<span class="address-badge">Default</span>':''}</div><p><b>${text(selectedAddress.recipient_name)}</b>${selectedAddress.phone?` · ${text(selectedAddress.phone)}`:''}</p><p>${text(window.ATELIX_formatAddress(selectedAddress))}</p>`;
  }

  async function updateShipping(){
    const place=root.querySelector('[data-place]'),help=document.getElementById('placeHelp');
    shippingQuote=defaultShippingQuote(selectedAddress?.country);
    if(!selectedAddress){
      document.getElementById('summaryShipping').textContent=window.ARCANA_money(10);document.getElementById('summaryTotal').textContent=currencyMoney(baseTotal+shippingAmount());place.disabled=true;help.textContent='Select an address to continue.';return;
    }
    quoteLoading=true;place.disabled=true;help.textContent='Checking the destination shipping rate…';
    const result=await window.ARCANA_API.getShippingQuote(selectedAddress.country);
    quoteLoading=false;
    shippingQuote=result?.quote||defaultShippingQuote(selectedAddress.country);
    const displayShipping=shippingAmount(),total=baseTotal+displayShipping;
    document.getElementById('summaryShipping').textContent=window.ARCANA_money(Number(shippingQuote.flat_rate_usd));document.getElementById('summaryTotal').textContent=currencyMoney(total);place.disabled=false;help.textContent='';
  }

  async function placeOrder(){
    const place=root.querySelector('[data-place]');
    if(!selectedAddress||quoteLoading) return;
    const orig = place ? place.innerHTML : '';
    if(place){ place.disabled=true; place.textContent='Confirming order…'; }
    const { orderNo, paymentPath, error } = await window.ARCANA_API.placeOrder({
      items: cart.map((i,index)=>({id:i.id,qty:i.qty,key:i.key||i.id,lineType:i.lineType||'product',options:i.options||{},note:root.querySelector(`[data-item-note="${index}"]`)?.value.trim()||null})),
      addressId: selectedAddress.id,
      notes: null,
      qc: false, insurance: false
    });
    if(error || !orderNo){
      const msg=(error && error.message) || 'Please try again.';
      toast(`Could not place order — ${msg}`);
      if(place){ place.disabled=false; place.innerHTML=orig; }
      return;
    }
    // place_order cleared the DB cart server-side; clear the local mirror too.
    Store.clearCart();
    if(paymentPath==='stripe'){
      if(place) place.textContent='Redirecting to secure payment…';
      const payment=await window.ARCANA_API.createStripeCheckout(orderNo,promoInput.value.trim()||null);
      if(!payment.error&&payment.url){
        sessionStorage.removeItem('arcana_checkout_promo');
        location.assign(payment.url);
        return;
      }
      toast(`Order created, but secure payment could not start — ${payment.error?.message||payment.error||'open your order to try again.'}`);
    }
    location.href='order.html?no='+encodeURIComponent(orderNo);
  }

  pickerTrigger.addEventListener('click',()=>picker.showModal());
  picker.querySelector('[data-picker-close]').addEventListener('click',()=>picker.close());
  picker.addEventListener('click',event=>{if(event.target===picker)picker.close();});
  root.querySelector('[data-place]').addEventListener('click',placeOrder);
  root.querySelector('[data-promo-apply]').addEventListener('click',savePromo);
  promoInput.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();savePromo();}});
  root.querySelectorAll('[data-item-note]').forEach(note=>note.addEventListener('input',()=>note.closest('.checkout-item-note').querySelector('[data-item-note-count]').textContent=note.value.length));
  addressBook=window.ATELIX_createAddressBook({
    api:window.ARCANA_API,
    list:document.getElementById('checkoutAddressList'),
    addButton:document.getElementById('checkoutAddAddress'),
    searchInput:document.getElementById('checkoutAddressSearch'),
    toast,
    selectable:true,
    countries:rates,
    onSelect:address=>{selectedAddress=address;updateAddress();updateShipping();if(picker.open)picker.close();}
  });
  updateAddress();
  await addressBook.load();
};
</script>
</body>
</html>
