<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Atelix</title>
<meta name="description" content="Review shipping details and submit an Atelix sourcing order.">
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-catalog data-hdr="b" data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap" style="padding-bottom:40px">
  <nav class="crumbs"><a href="../index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><a href="cart.html">Cart</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span class="cur">Checkout</span></nav>
  <div id="coRoot"></div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script src="../js/address-book.js"></script>
<script>
window.ARCANA_PAGE = async function({ASSET,IC,Store,toast}){
  const M=window.ARCANA_PRODUCT_MAP, root=document.getElementById('coRoot');
  const productMoney=(p,qty=1)=>window.ATELIX_productMoney(p,qty);
  const productAmount=(p,qty=1)=>window.ATELIX_productAmount(p,qty);
  const currencyMoney=n=>window.ATELIX_currencyMoney(n);
  const TR=window.ARCANA_TR, T=window.ARCANA_T;
  const text=value=>String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const optionSummary=item=>Object.entries(item.options||{}).map(([name,value])=>`${text(name)}: ${text(value)}`).join(' · ');
  const cart=Store.cart().filter(i=>M[i.id]);
  cart.forEach(i=>{
    const minimum=Math.max(1,Math.ceil(Number.parseFloat(M[i.id].moq)||1));
    if(i.qty<minimum){i.qty=minimum;Store.setQty(i.key||i.id,minimum);}
  });
  const subtotal=cart.reduce((sum,item)=>sum+productAmount(M[item.id],item.qty),0);
  const fee=+(subtotal*0.05).toFixed(2);
  const baseTotal=subtotal+fee;
  let selectedAddress=null;
  let shippingQuote=null;
  let quoteLoading=false;
  let addressBook=null;

  if(!cart.length){
    root.innerHTML=`<div class="panel cart-empty"><span class="ce-ic">${IC.cart}</span><h1>${T('Nothing to check out')}</h1><p>${T('Your cart is empty.')}</p><a class="btn btn-green" href="/categories/fabrics">${T('Browse fabrics')}</a></div>`;
    return;
  }
  if(cart.some(item=>M[item.id].pricingMode==='quote'||!(M[item.id].price>0))){
    root.innerHTML=`<div class="panel cart-empty"><span class="ce-ic">${IC.msg}</span><h1>${T('Contact supplier')}</h1><p>${T('Volume pricing shared on quote')}</p><a class="btn btn-green" href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent('Quote request from cart')}">${T('Contact supplier')}</a><a class="btn btn-out" href="cart.html">${T('View cart')}</a></div>`;
    return;
  }

  // Checkout requires a signed-in buyer because place_order is account-scoped.
  const profile = await window.ARCANA_API.getSessionProfile();
  if(!profile){
    root.innerHTML=`<div class="panel cart-empty" style="max-width:520px;margin:0 auto">
      <span class="ce-ic">${IC.lock}</span>
      <h1>Log in to check out</h1>
      <p>Sign in to your Atelix account to submit this order. Your cart is saved.</p>
      <a class="btn btn-green" href="login.html?next=checkout.html">Log in to continue</a>
      <p style="margin-top:14px;font-size:.9375rem;color:var(--muted)">New to Atelix? <a href="signup.html" style="color:var(--green);font-weight:600">Create an account</a></p>
    </div>`;
    return;
  }
  const rates=await window.ARCANA_API.getShippingRates();
  const groups=[];
  cart.forEach(item=>{
    const product=M[item.id],key=product.factoryId||product.seller||'supplier';
    let group=groups.find(entry=>String(entry.key)===String(key));
    if(!group){group={key,name:product.seller||'Supplier',items:[]};groups.push(group);}
    group.items.push(item);
  });
  const supplierItems=groups.map(group=>`<div class="checkout-supplier">
    <header><span aria-hidden="true">${IC.factory}</span><strong>${text(group.name)}</strong></header>
    ${group.items.map(item=>{const product=M[item.id],options=optionSummary(item);return `<div class="checkout-item">
      <img src="${window.ATELIX_productAsset(product)}" alt="${text(product.name)}">
      <div><a href="product.html?id=${encodeURIComponent(product.id)}">${text(TR(product.name))}</a>${options?`<p>${options}</p>`:''}<p>${item.qty} × ${productMoney(product)}</p></div>
      <strong>${productMoney(product,item.qty)}</strong>
    </div>`;}).join('')}
  </div>`).join('');

  root.innerHTML=`<header class="checkout-page-head"><h1>Checkout</h1><p>Confirm delivery and review the final total before placing your order.</p></header>
    <div class="co-wrap">
      <div class="checkout-flow">
        <section class="panel checkout-block" aria-labelledby="deliveryTitle">
          <header class="checkout-block-head"><div><span class="checkout-step">1</span><h2 id="deliveryTitle">Delivery address</h2></div><button class="btn btn-out" type="button" data-address-picker>Change</button></header>
          <div id="selectedAddress" class="checkout-address"></div>
        </section>
        <section class="panel checkout-block" aria-labelledby="shippingTitle">
          <header class="checkout-block-head"><div><span class="checkout-step">2</span><h2 id="shippingTitle">Delivery service</h2></div></header>
          <div id="shippingStatus" class="checkout-shipping" role="status" aria-live="polite"></div>
        </section>
        <section class="panel checkout-block" aria-labelledby="itemsTitle">
          <header class="checkout-block-head"><div><span class="checkout-step">3</span><h2 id="itemsTitle">Items (${cart.length})</h2></div><a href="cart.html">Edit cart</a></header>
          <div class="checkout-suppliers">${supplierItems}</div>
        </section>
        <section class="panel checkout-block" aria-labelledby="noteTitle">
          <header class="checkout-block-head"><div><span class="checkout-step">4</span><h2 id="noteTitle">Order note</h2></div><span>Optional</span></header>
          <label class="checkout-note"><span class="sr-only">Order note for suppliers</span><textarea id="orderNote" maxlength="500" placeholder="Add delivery access details or instructions for your suppliers."></textarea><small><span id="noteCount">0</span>/500</small></label>
        </section>
        <section class="checkout-payment-note" aria-label="Payment information">${IC.shield}<p><strong>Payment after order review</strong><span>Verified payment instructions appear on your order page when available. Never pay using details from an unverified message.</span></p></section>
      </div>
      <aside><section class="panel summary checkout-summary">
        <h3>${T('Order Summary')}</h3>
        <div class="sum-row"><span class="k">${T('Subtotal')}</span><span>${currencyMoney(subtotal)}</span></div>
        <div class="sum-row"><span class="k">${T('Service fee (5%)')}</span><span>${currencyMoney(fee)}</span></div>
        <div class="sum-row"><span class="k">${T('Shipping')}</span><span id="summaryShipping">—</span></div>
        <div class="cart-summary-total"><span>${T('Total')}</span><strong id="summaryTotal">${currencyMoney(baseTotal)}</strong></div>
        <button class="btn btn-gold btn-block cart-summary-action" type="button" data-place disabled>Place order</button>
        <p class="checkout-place-help" id="placeHelp">Select an address to continue.</p>
        <div class="secure-note"><span>${IC.lock} Order details are sent over an encrypted connection</span></div>
      </section></aside>
    </div>
    <dialog class="address-picker" aria-labelledby="addressPickerTitle">
      <div class="address-picker-shell">
        <header class="address-picker-head"><div><h2 id="addressPickerTitle">Choose a delivery address</h2><p>Select, add, or update a saved address.</p></div><button type="button" data-picker-close aria-label="Close address list">×</button></header>
        <div class="address-picker-tools"><label class="address-search"><span class="sr-only">Search saved addresses</span><input id="checkoutAddressSearch" type="search" placeholder="Search by label, city, or country"></label><button class="btn btn-green" type="button" id="checkoutAddAddress">+ Add address</button></div>
        <div id="checkoutAddressList" class="address-list address-picker-list"></div>
      </div>
    </dialog>`;

  const picker=root.querySelector('.address-picker');
  const pickerTrigger=root.querySelector('[data-address-picker]');
  const shippingAmount=()=>{
    if(!shippingQuote) return 0;
    const lang=document.documentElement.lang||'en',fx=window.ARCANA_FX[lang]||window.ARCANA_FX.en;
    const raw=Number(shippingQuote.flat_rate_usd||0)*fx.rate,increment=Number(fx.increment)||.01;
    return Math.ceil((raw-Number.EPSILON)/increment)*increment;
  };

  function updateAddress(){
    const target=document.getElementById('selectedAddress');
    if(!selectedAddress){
      target.innerHTML=`<div class="checkout-empty-address"><div><strong>No delivery address selected</strong><p>Add an address so Atelix can calculate shipping.</p></div><button class="btn btn-green" type="button" data-empty-address>Add address</button></div>`;
      target.querySelector('[data-empty-address]').onclick=()=>addressBook.openForm();
      pickerTrigger.textContent='Add address';
      return;
    }
    pickerTrigger.textContent='Change';
    target.innerHTML=`<div class="checkout-address-title"><strong>${text(selectedAddress.label||'Delivery address')}</strong>${selectedAddress.is_default?'<span class="address-badge">Default</span>':''}</div><p><b>${text(selectedAddress.recipient_name)}</b>${selectedAddress.phone?` · ${text(selectedAddress.phone)}`:''}</p><p>${text(window.ATELIX_formatAddress(selectedAddress))}</p>`;
  }

  async function updateShipping(){
    const status=document.getElementById('shippingStatus'),place=root.querySelector('[data-place]'),help=document.getElementById('placeHelp');
    shippingQuote=null;
    if(!selectedAddress){
      status.innerHTML='<div class="shipping-state"><strong>Address needed</strong><p>Choose a delivery address to see the available service and final total.</p></div>';
      document.getElementById('summaryShipping').textContent='—';document.getElementById('summaryTotal').textContent=currencyMoney(baseTotal);place.disabled=true;help.textContent='Select an address to continue.';return;
    }
    quoteLoading=true;place.disabled=true;help.textContent='Calculating shipping…';status.setAttribute('aria-busy','true');status.innerHTML='<div class="shipping-state"><strong>Calculating shipping…</strong><p>Checking the configured service for this destination.</p></div>';
    const result=await window.ARCANA_API.getShippingQuote(selectedAddress.country);
    quoteLoading=false;status.removeAttribute('aria-busy');
    if(result?.error||!result?.quote){
      const message=result?.error?.message||`Shipping to ${selectedAddress.country} is not configured yet.`;
      status.innerHTML=`<div class="shipping-state is-error"><strong>Shipping unavailable</strong><p>${text(message)}</p><button class="btn btn-out" type="button" data-change-country>Choose another address</button></div>`;
      status.querySelector('[data-change-country]').onclick=()=>picker.showModal();
      document.getElementById('summaryShipping').textContent='Unavailable';document.getElementById('summaryTotal').textContent=currencyMoney(baseTotal);place.disabled=true;help.textContent='Choose an address in a supported destination.';return;
    }
    shippingQuote=result.quote;
    const displayShipping=shippingAmount(),total=baseTotal+displayShipping;
    status.innerHTML=`<div class="shipping-service"><div><strong>${text(shippingQuote.service_name)}</strong><p>${text(shippingQuote.country_name)} · Estimated ${Number(shippingQuote.eta_min_days)}–${Number(shippingQuote.eta_max_days)} business days</p></div><b>${window.ARCANA_money(Number(shippingQuote.flat_rate_usd))}</b></div>`;
    document.getElementById('summaryShipping').textContent=window.ARCANA_money(Number(shippingQuote.flat_rate_usd));document.getElementById('summaryTotal').textContent=currencyMoney(total);place.disabled=false;help.textContent='Shipping and item totals are verified again when you place the order.';
  }

  async function placeOrder(){
    const place=root.querySelector('[data-place]');
    if(!selectedAddress||!shippingQuote||quoteLoading) return;
    const orig = place ? place.innerHTML : '';
    if(place){ place.disabled=true; place.textContent='Placing order…'; }
    const shipAddress=[selectedAddress.recipient_name,selectedAddress.phone,window.ATELIX_formatAddress(selectedAddress)].filter(Boolean).join(' · ');
    const { orderNo, error } = await window.ARCANA_API.placeOrder({
      items: cart.map(i=>({id:i.id,qty:i.qty,key:i.key||i.id,options:i.options||{}})),
      shipCountry: selectedAddress.country,
      shipAddress,
      notes: document.getElementById('orderNote').value.trim()||null,
      qc: false, insurance: false
    });
    if(error || !orderNo){
      const msg=(error && error.message) || 'Please try again.';
      toast(`Could not place order — ${msg}`);
      if(place){ place.disabled=false; place.innerHTML=orig; }
      return;
    }
    // place_order cleared the DB cart server-side; clear the local mirror too.
    Store.clearCart();
    location.href='order.html?no='+encodeURIComponent(orderNo);
  }

  pickerTrigger.addEventListener('click',()=>picker.showModal());
  picker.querySelector('[data-picker-close]').addEventListener('click',()=>picker.close());
  picker.addEventListener('click',event=>{if(event.target===picker)picker.close();});
  root.querySelector('[data-place]').addEventListener('click',placeOrder);
  const note=document.getElementById('orderNote');note.addEventListener('input',()=>document.getElementById('noteCount').textContent=note.value.length);
  addressBook=window.ATELIX_createAddressBook({
    api:window.ARCANA_API,
    list:document.getElementById('checkoutAddressList'),
    addButton:document.getElementById('checkoutAddAddress'),
    searchInput:document.getElementById('checkoutAddressSearch'),
    toast,
    selectable:true,
    countries:rates,
    onSelect:address=>{selectedAddress=address;updateAddress();updateShipping();if(picker.open)picker.close();}
  });
  updateAddress();
  await addressBook.load();
};
</script>
</body>
</html>
