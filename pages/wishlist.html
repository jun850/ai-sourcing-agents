<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — Atelix</title>
<meta name="description" content="Your saved fabrics, trims and OEM packages on Atelix — review quantities and move items to cart.">
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body class="wishlist-page" data-catalog data-hdr="b" data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap">
  <nav class="crumbs"><span class="cur">Wishlist</span></nav>

  <div id="wlRoot" class="wl-loading" aria-busy="true" aria-live="polite">
    <div class="wl-skeleton" aria-hidden="true">
      <div class="wl-skeleton-toolbar"><i></i><i></i><i></i></div>
      <div class="wl-skeleton-row"><i class="check"></i><i class="product"></i><i class="meta"></i><i class="action"></i></div>
      <div class="wl-skeleton-row"><i class="check"></i><i class="product"></i><i class="meta"></i><i class="action"></i></div>
      <div class="wl-skeleton-row"><i class="check"></i><i class="product"></i><i class="meta"></i><i class="action"></i></div>
      <div class="wl-skeleton-row"><i class="check"></i><i class="product"></i><i class="meta"></i><i class="action"></i></div>
    </div>
    <span class="sr-only">Loading wishlist</span>
  </div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/copilot.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script src="../js/copilot-llm.js"></script>
<script>
window.ARCANA_PAGE = function({ASSET,IC,Store,toast}){
  const M=window.ARCANA_PRODUCT_MAP, root=document.getElementById('wlRoot');
  const productAsset=window.ATELIX_productAsset;
  const money=n=>window.ARCANA_money(n);
  const TR=window.ARCANA_TR, T=window.ARCANA_T;
  const CAT_LABEL={fabrics:'Fabrics', accessories:'Accessories', trims:'Trims', yarns:'Yarns & Threads', oem:'OEM Services'};
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  let q='', cat='all', sort='recent', remoteSkus=null, searchTimer=0, searchRequest=0;
  const selected=new Set();
  const reco=window.ARCANA_recommended(8); // computed once so it doesn't reshuffle on re-render

  function render(){
    root.classList.remove('wl-loading');
    root.setAttribute('aria-busy','false');
    const saved=Store.saved().filter(i=>M[i.id]);
    if(!saved.length){
      root.innerHTML=`<div class="panel cart-empty">
        <span class="ce-ic">${IC.heart}</span>
        <h3>${T('Your wishlist is empty')}</h3>
        <p>${T('Save fabrics, trims and OEM packages you like — they’ll show up here.')}</p>
      </div>
      <section class="section" style="margin-top:32px">
        <div class="sec-head"><h2 style="font-family:var(--sans);font-size:24px;font-weight:600">${T('Recommended for you')}</h2></div>
        <div class="prod-grid" id="wlRecoGrid">${reco.map(p=>window.ARCANA_card(p)).join('')}</div>
      </section>`;
      window.ARCANA_wireCards(document.getElementById('wlRecoGrid'));
      return;
    }

    const cats=[...new Set(saved.map(i=>M[i.id].cat).filter(Boolean))];
    if(cat!=='all' && !cats.includes(cat)) cat='all';

    let list=saved.map(i=>({...i, p:M[i.id]}));
    if(cat!=='all') list=list.filter(i=>i.p.cat===cat);
    if(q.trim()){
      const needle=q.trim().toLowerCase();
      list=list.filter(i=>remoteSkus ? remoteSkus.has(i.p.id) : [i.p.name,i.p.seller,i.p.comp,i.p.loc].some(v=>TR(v||'').toLowerCase().includes(needle)));
    }
    if(sort==='recent') list=list.slice().reverse(); // saved() is oldest-first; newest saved shown first
    else if(sort==='name') list=list.slice().sort((a,b)=>TR(a.p.name).localeCompare(TR(b.p.name)));
    else if(sort==='priceAsc') list=list.slice().sort((a,b)=>a.p.price-b.p.price);
    else if(sort==='priceDesc') list=list.slice().sort((a,b)=>b.p.price-a.p.price);

    const savedIds=new Set(saved.map(i=>i.id));
    [...selected].forEach(id=>{ if(!savedIds.has(id)) selected.delete(id); });
    const visibleIds=list.map(i=>i.id);
    const selectedVisible=visibleIds.filter(id=>selected.has(id)).length;
    const selectedIds=saved.map(i=>i.id).filter(id=>selected.has(id));
    const rows=list.map(i=>{const p=i.p; return `
      <tr data-row="${p.id}" class="${selected.has(p.id)?'is-selected':''}">
        <td class="wl-check-cell"><input class="wl-check" type="checkbox" data-select="${p.id}" ${selected.has(p.id)?'checked':''} aria-label="${esc(T('Select'))} ${esc(TR(p.name))}"></td>
        <td data-label="${T('Product')}"><div class="wl-prod"><img src="${productAsset(p)}" alt=""><div><h4><a href="product.html?id=${p.id}">${TR(p.name)}</a></h4><div class="m">${TR(p.seller)} · ${TR(p.loc)}</div></div></div></td>
        <td data-label="${T('Unit price')}">${p.pricingMode==='quote'||!(p.price>0)?T('Contact supplier'):window.ATELIX_productMoney(p)}${p.pricingMode==='quote'||!(p.price>0)?'':`<small class="wl-unit"> /${TR(p.unit)}</small>`}</td>
        <td class="wl-actions">
          ${p.pricingMode==='quote'||!(p.price>0)?`<a class="btn btn-out" href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent(`Quote request: ${p.name}`)}">${T('Contact supplier')}</a>`:`<button class="btn btn-out" data-add-one="${p.id}" type="button">${T('Add to cart')}</button>`}
          <button class="ci-remove" type="button" data-remove="${p.id}" style="margin-left:12px">${T('Remove')}</button>
        </td>
      </tr>`;}).join('');

    root.innerHTML=`
      <div class="acct-head">
        <h1>${T('Wishlist')} <span class="muted" style="font-size:15px;font-family:var(--sans);font-weight:500">(${saved.length} ${T(saved.length===1?'item':'items')})</span></h1>
      </div>

      <div class="wl-toolbar">
        <div class="wl-search">${IC.search}<input type="search" id="wlSearch" placeholder="${T('Search your wishlist…')}" value="${esc(q)}"></div>
        ${cats.length>1?`<select class="wl-select" id="wlCat">
          <option value="all">${T('All categories')}</option>
          ${cats.map(c=>`<option value="${c}" ${c===cat?'selected':''}>${T(CAT_LABEL[c]||c)}</option>`).join('')}
        </select>`:''}
        <div class="sort-chips" id="wlSort">
          <button class="sort-chip${sort==='recent'?' on':''}" data-sort="recent" type="button">${T('Recently added')}</button>
          <button class="sort-chip${sort==='name'?' on':''}" data-sort="name" type="button">${T('Name A–Z')}</button>
          <button class="sort-chip${sort==='priceAsc'?' on':''}" data-sort="priceAsc" type="button">${T('Price: Low to High')}</button>
          <button class="sort-chip${sort==='priceDesc'?' on':''}" data-sort="priceDesc" type="button">${T('Price: High to Low')}</button>
        </div>
        <label class="wl-mobile-sort"><span>${T('Sort by')}</span><select id="wlSortSelect"><option value="recent" ${sort==='recent'?'selected':''}>${T('Recently added')}</option><option value="name" ${sort==='name'?'selected':''}>${T('Name A–Z')}</option><option value="priceAsc" ${sort==='priceAsc'?'selected':''}>${T('Price: Low to High')}</option><option value="priceDesc" ${sort==='priceDesc'?'selected':''}>${T('Price: High to Low')}</option></select></label>
      </div>

      <div class="wl-selection" role="group" aria-label="${T('Wishlist selection')}">
        <label class="wl-select-all" for="wlSelectAll">
          <input id="wlSelectAll" class="wl-check" type="checkbox" ${visibleIds.length&&selectedVisible===visibleIds.length?'checked':''} ${visibleIds.length?'':'disabled'}>
          <span>${T('Select all')}</span>
        </label>
        <span class="wl-selected-count" aria-live="polite">${selectedIds.length} ${T('selected')}</span>
        <button class="btn btn-green" id="wlAddSelected" type="button" ${selectedIds.length?'':'disabled'}>${T('Add selected to cart')}${selectedIds.length?` (${selectedIds.length})`:''}</button>
      </div>

      <section class="panel wl-list-panel">
        <div style="overflow-x:auto">
          <table class="admin-tbl wl-tbl">
            <thead><tr><th><span class="visually-hidden">${T('Select')}</span></th><th>${T('Product')}</th><th>${T('Unit price')}</th><th></th></tr></thead>
            <tbody>${rows || `<tr><td colspan="4" class="muted wl-no-match">${T('No items match your search.')}</td></tr>`}</tbody>
          </table>
        </div>
      </section>

      <div class="wl-summary">
        <span class="muted">${T('Showing')} ${list.length} ${T('of')} ${saved.length}</span>
      </div>
    `;

    const selectAll=root.querySelector('#wlSelectAll');
    if(selectAll){
      selectAll.indeterminate=selectedVisible>0 && selectedVisible<visibleIds.length;
      selectAll.addEventListener('change',()=>{
        visibleIds.forEach(id=>selectAll.checked?selected.add(id):selected.delete(id));
        render();
      });
    }
    root.querySelectorAll('[data-select]').forEach(input=>input.addEventListener('change',()=>{
      input.checked?selected.add(input.dataset.select):selected.delete(input.dataset.select);
      render();
    }));
    root.querySelectorAll('[data-remove]').forEach(a=>a.addEventListener('click',e=>{
      e.preventDefault(); selected.delete(a.dataset.remove); Store.removeSaved(a.dataset.remove); toast(T('Removed from wishlist')); render();
    }));
    root.querySelectorAll('[data-add-one]').forEach(b=>b.addEventListener('click',()=>{
      Store.addToCart(b.dataset.addOne,1);
      toast(T('Added to cart'), {href:'cart.html', label:T('View cart')});
    }));
    const addSelectedBtn=root.querySelector('#wlAddSelected');
    if(addSelectedBtn) addSelectedBtn.addEventListener('click',()=>{
      const ids=saved.map(i=>i.id).filter(id=>selected.has(id));
      ids.forEach(id=>Store.addToCart(id,1));
      selected.clear();
      toast(`${ids.length} ${T(ids.length===1?'item':'items')} ${T('added to cart')}`, {href:'cart.html', label:T('View cart')});
      render();
    });
    const searchEl=root.querySelector('#wlSearch');
    if(searchEl) searchEl.addEventListener('input',e=>{
      q=e.target.value; remoteSkus=null; const pos=e.target.selectionStart, request=++searchRequest;
      render();
      const el=root.querySelector('#wlSearch');
      if(el){ el.focus(); el.setSelectionRange(pos,pos); }
      clearTimeout(searchTimer);
      if(!q.trim()) return;
      searchTimer=setTimeout(async()=>{
        const result=await window.ARCANA_API.searchPrivateAlgolia('wishlist',q);
        if(request!==searchRequest || result.error || !result.hits.length) return;
        remoteSkus=new Set(result.hits.map(hit=>hit.sku).filter(Boolean)); render();
      },180);
    });
    const catEl=root.querySelector('#wlCat');
    if(catEl) catEl.addEventListener('change',()=>{ cat=catEl.value; render(); });
    const sortEl=root.querySelector('#wlSortSelect');
    if(sortEl) sortEl.addEventListener('change',()=>{ sort=sortEl.value; render(); });
    root.querySelectorAll('[data-sort]').forEach(c=>c.addEventListener('click',()=>{ sort=c.dataset.sort; render(); }));
  }

  render();
  window.ARCANA_onLang(render);
};
</script>
</body>
</html>
