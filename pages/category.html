<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Fabrics, Trims, Accessories & OEM — Atelix</title>
<meta name="description" content="Explore verified fabrics, accessories, trims, yarns and OEM services. Filter by material, price, MOQ and certifications, and source from audited factories.">
<link rel="canonical" href="https://marketplace-three-peach.vercel.app/pages/category.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Atelix">
<meta property="og:title" content="Browse Fabrics, Trims, Accessories & OEM — Atelix">
<meta property="og:description" content="Explore verified fabrics, accessories, trims, yarns and OEM services. Filter by material, price, MOQ and certifications.">
<meta property="og:url" content="https://marketplace-three-peach.vercel.app/pages/category.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Browse Fabrics, Trims, Accessories & OEM — Atelix">
<meta name="twitter:description" content="Verified fabrics, trims, accessories, yarns and OEM services — filter by material, price, MOQ and certifications.">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-catalog data-marketplace-search data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap">
  <nav class="crumbs"><a href="../index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span class="cur" id="crumbCat">Fabrics</span></nav>

  <div class="listing">
    <!-- filter rail -->
    <aside class="filter-rail" aria-label="Product filters">
      <div class="frl-head"><b data-i18n="cat.filters">Filters</b><span><a href="#" id="clearFilters" data-i18n="cat.reset">Reset</a><button class="sheet-close" type="button" data-close-filters aria-label="Close filters">×</button></span></div>
      <div class="frl-block">
        <h5 data-i18n="cat.oemavail">OEM availability</h5>
        <label class="frl-opt"><input type="radio" name="avail" value="all" checked> <span data-i18n="cat.all">All</span></label>
        <label class="frl-opt"><input type="radio" name="avail" value="oem"> <span data-i18n="cat.oemAvailable">OEM available</span></label>
        <label class="frl-opt"><input type="radio" name="avail" value="nonoem"> <span data-i18n="cat.nonoem">Non-OEM</span></label>
      </div>
      <div class="frl-block">
        <h5 data-i18n="cat.material">Material</h5>
        <div id="matOpts"></div>
      </div>
      <div class="frl-block">
        <h5 data-i18n="cat.price">Price (US$ / unit)</h5>
        <div class="frl-price"><input type="number" id="pmin" placeholder="Min" min="0"><span class="muted">–</span><input type="number" id="pmax" placeholder="Max" min="0"></div>
      </div>
      <div class="frl-block" id="countryBlock">
        <h5>Country of Origin</h5>
        <div id="countryOpts"></div>
      </div>
      <div class="frl-block" id="regionBlock" style="display:none">
        <h5>Region</h5>
        <div id="regionOpts"></div>
      </div>
      <div class="frl-block">
        <h5 data-i18n="cat.certs">Certifications</h5>
        <label class="frl-opt"><input type="checkbox" disabled> GRS <span class="cnt">128</span></label>
        <label class="frl-opt"><input type="checkbox" disabled> Oeko-Tex <span class="cnt">340</span></label>
        <label class="frl-opt"><input type="checkbox" disabled> GOTS <span class="cnt">92</span></label>
      </div>
    </aside>

    <!-- main -->
    <div class="listing-main">
      <div class="list-top">
        <h1 id="listTitle">Fabrics</h1>
        <div class="cnt" id="listSub">Catalog options from verified suppliers</div>
      </div>
      <div class="mobile-list-tools" aria-label="Catalog controls">
        <button type="button" id="openFilters">Filters</button>
        <button type="button" id="openSort">Sort</button>
        <span id="mobileResCount" aria-live="polite"></span>
      </div>
      <div class="sortbar">
        <span class="lbl" data-i18n="cat.sort">Sort</span>
        <div class="sort-chips" id="sortChips">
          <button class="sort-chip on" data-sort="rec" data-i18n="sort.rec">Recommended</button>
          <button class="sort-chip" data-sort="new" data-i18n="sort.new">Newest</button>
          <button class="sort-chip" data-sort="moq" data-i18n="sort.moq">MOQ: Low</button>
          <button class="sort-chip" data-sort="price" data-i18n="sort.price">Price: Low</button>
        </div>
        <span class="count" id="resCount"></span>
        <button class="sheet-close" type="button" data-close-sort aria-label="Close sort">×</button>
      </div>
      <div class="prod-grid" id="grid"></div>
      <section class="oem-material-sources" id="oemMaterialSources" hidden aria-labelledby="oem-material-sources-title"></section>
    </div>
  </div>
  <div style="height:40px"></div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/copilot.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script src="../js/copilot-llm.js"></script>
<script>
window.ARCANA_PAGE = function({ASSET,IC,Store,toast}){
  // This one file renders three distinct page identities off one URL pattern —
  // keep them straight when touching filters, sort, badges or pricing below:
  //   · Category page — category.html?cat=<slug>            (default browse/listing)
  //   · SRP           — category.html?cat=<slug>&q=<term>   (keyword search results)
  //   · Copilot SRP   — category.html?copilot=1              (Athelia results)
  //   · Design Match  — category.html?design-match=1         (tech-pack / reference results)
  const qsAll=new URLSearchParams(location.search);
  const pageMode = qsAll.get('design-match')==='1' ? 'design-match' : (qsAll.get('copilot')==='1' ? 'copilot-srp' : (qsAll.get('q') ? 'srp' : 'category'));
  document.body.dataset.pageMode = pageMode;
  const filterRail=document.querySelector('.filter-rail'), sortbar=document.querySelector('.sortbar');
  document.getElementById('openFilters').addEventListener('click',()=>{filterRail.classList.add('sheet-open');document.body.classList.add('sheet-active');});
  document.getElementById('openSort').addEventListener('click',()=>{sortbar.classList.add('sheet-open');document.body.classList.add('sheet-active');});
  document.querySelector('[data-close-filters]').addEventListener('click',()=>{filterRail.classList.remove('sheet-open');document.body.classList.remove('sheet-active');});
  document.querySelector('[data-close-sort]').addEventListener('click',()=>{sortbar.classList.remove('sheet-open');document.body.classList.remove('sheet-active');});

  // ---- Design Match ----
  if(pageMode==='design-match'){ return runDesignMatch(); }

  function runDesignMatch(){
    const match=window.ARCANA_getDesignMatch&&window.ARCANA_getDesignMatch();
    const main=document.querySelector('main.wrap'), listing=document.querySelector('.listing');
    document.querySelector('.filter-rail').style.display='none';
    document.querySelector('.list-top').style.display='none';
    document.querySelector('.sortbar').style.display='none';
    listing.style.display='block'; document.getElementById('crumbCat').textContent='Design Match';
    const grid=document.getElementById('grid'); grid.className='design-match-results';
    if(!match || !match.brief || !match.results){
      grid.innerHTML=`<section class="dm-empty"><span>${IC.document}</span><h1>No active design match</h1><p>Upload a tech pack or reference from the search bar to create a private sourcing brief.</p><button class="btn btn-green" data-dm-start>Upload a design reference</button></section>`;
      grid.querySelector('[data-dm-start]').addEventListener('click',()=>window.ARCANA_openDesignMatch&&window.ARCANA_openDesignMatch()); return;
    }
    const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const brief=match.brief, results=match.results;
    const files=(match.files||[]).map(file=>`<span>${IC.document}${esc(file.name)}</span>`).join('');
    const bar=document.createElement('section'); bar.className='dm-result-bar'; main.insertBefore(bar,listing);
    const requirements=(list,type)=>list.map((item,index)=>`<div class="dm-req"><input data-dm-${type}-name="${index}" value="${esc(item.name)}" aria-label="${type} requirement"><input data-dm-${type}-spec="${index}" value="${esc(item.specification||'')}" placeholder="Specification"></div>`).join('')||`<p class="muted">No ${type} identified.</p>`;
    function renderBar(){
      bar.innerHTML=`<div class="dm-result-title"><span class="dm-mark">${IC.document}</span><div><p>Design Match <span>Gemini 3.6 Flash analysis</span></p><h1>${esc(brief.garmentType)}</h1><small>Source files are private to this browser session.</small></div><button class="btn btn-out" data-dm-new>New match</button></div>
        <div class="dm-file-strip">${files}</div>
        <form class="dm-brief-form" data-dm-brief><div class="dm-brief-copy"><h2>What Athelia read</h2><p>Adjust the sourcing brief and update supplier matches without uploading again.</p></div>
          <label>Garment<input name="garmentType" value="${esc(brief.garmentType)}"></label><label>Quantity / MOQ<input name="quantities" value="${esc(brief.quantities||'')}"></label><label>Size range<input name="sizes" value="${esc(brief.sizes||'')}"></label><label>Target region<input name="targetRegion" value="${esc(brief.targetRegion||'')}"></label><label class="dm-wide">Design notes<textarea name="description">${esc(brief.description||'')}</textarea></label>
          ${brief.colorways&&brief.colorways.length?`<div class="dm-colors"><b>Color references</b>${brief.colorways.map(color=>`<span>${esc(color.component)}: ${esc(color.color)}${color.code?` · ${esc(color.code)}`:''}</span>`).join('')}</div>`:''}
          <div class="dm-brief-requirements"><div><b>Fabric requirements</b>${requirements(brief.fabrics,'fabric')}</div><div><b>Trim requirements</b>${requirements(brief.trims,'trim')}</div></div>
          ${brief.unsupportedOrUnclear&&brief.unsupportedOrUnclear.length?`<p class="dm-unclear">Needs confirmation: ${brief.unsupportedOrUnclear.map(esc).join(' · ')}</p>`:''}
          <div class="dm-brief-actions"><button type="submit" class="btn btn-green">Update matches</button><a href="mailto:info@arcanawangsa.com?subject=${encodeURIComponent('Sourcing help — '+brief.garmentType)}" class="btn btn-out">Request sourcing help</a></div>
        </form>`;
      bar.querySelector('[data-dm-new]').addEventListener('click',()=>{window.ARCANA_clearDesignMatch&&window.ARCANA_clearDesignMatch();window.ARCANA_openDesignMatch&&window.ARCANA_openDesignMatch();});
      bar.querySelector('[data-dm-brief]').addEventListener('submit',async event=>{
        event.preventDefault(); const form=new FormData(event.currentTarget);
        ['garmentType','quantities','sizes','targetRegion','description'].forEach(key=>brief[key]=String(form.get(key)||'').trim());
        brief.fabrics.forEach((item,index)=>{item.name=String(bar.querySelector(`[data-dm-fabric-name="${index}"]`).value||'').trim();item.specification=String(bar.querySelector(`[data-dm-fabric-spec="${index}"]`).value||'').trim();});
        brief.trims.forEach((item,index)=>{item.name=String(bar.querySelector(`[data-dm-trim-name="${index}"]`).value||'').trim();item.specification=String(bar.querySelector(`[data-dm-trim-spec="${index}"]`).value||'').trim();});
        const button=bar.querySelector('[type=submit]');button.disabled=true;button.textContent='Updating…';
        const api=window.ARCANA_API; const response=api&&api.rematchDesign?await api.rematchDesign(brief):{error:{message:'unavailable'}};
        button.disabled=false;button.textContent='Update matches';
        if(response.error||!response.data||!response.data.ok){toast('Could not update supplier matches. Try again.');return;}
        match.brief=response.data.brief;match.results=response.data.results;sessionStorage.setItem('arcana_design_match',JSON.stringify(match));location.reload();
      });
    }
    const supplierCard=f=>`<a class="dm-supplier" href="supplier.html?id=${encodeURIComponent(f.id)}"><div class="dm-supplier-top"><span>${IC.factory}</span><div><b>${esc(f.name)}</b><small>${esc(f.type||'Verified supplier')} · ${esc(f.loc||f.region||'')}</small></div><em>${f.coverage||0}/${f.requirementCount||0} needs</em></div><p>${esc(f.bio||'Verified supplier matched against your design requirements.')}</p><div class="dm-supplier-meta"><span>${IC.shield} Verified</span><span>MOQ <b>${esc(f.moq||'On request')}</b></span><span>Lead <b>${esc(f.lead||'On request')}</b></span></div></a>`;
    const requirementSection=(title,groups)=>`<section class="dm-result-section"><div class="dm-section-head"><h2>${title}</h2><p>Matched to the requirements Athelia extracted from your design.</p></div>${groups.length?groups.map(group=>`<div class="dm-product-group"><h3>${esc(group.requirement.name)}${group.requirement.specification?` <span>${esc(group.requirement.specification)}</span>`:''}</h3><div class="prod-grid">${group.matches.length?group.matches.map(product=>window.ARCANA_card(product,{href:'product.html?id='+encodeURIComponent(product.id),fabricSpec:product.cat==='fabrics'})).join(''):`<p class="dm-no-match">No verified catalog match yet.</p>`}</div></div>`).join(''):`<p class="dm-no-match">No requirements identified.</p>`}</section>`;
    function renderResults(){
      grid.innerHTML=`<section class="dm-result-section dm-oem"><div class="dm-section-head"><div><h2>OEM factories for this design</h2><p>Ranked by verified capability and coverage of the sourcing brief.</p></div><span>${results.oems.length} verified matches</span></div><div class="dm-supplier-grid">${results.oems.length?results.oems.map(supplierCard).join(''):`<p class="dm-no-match">No OEM factory in the verified catalog currently matches this brief.</p>`}</div></section>${requirementSection('Fabric options',results.fabrics||[])}${requirementSection('Trim options',results.trims||[])}`;
      window.ARCANA_wireCards(grid);
    }
    renderBar();renderResults();
  }

  // ---- Copilot SRP ----
  if(pageMode==='copilot-srp'){ return runCopilot(); }

  function runCopilot(){
    const Cop=window.ARCANA_Copilot;

    // Copilot is a signed-in perk (basic catalog search stays open to everyone).
    // Defense in depth: components.js already gates the entry points that link
    // here, but a direct/shared ?copilot=1 link must be gated too.
    if(!Store.session()){
      document.querySelector('.filter-rail').style.display='none';
      document.querySelector('.list-top').style.display='none';
      document.querySelector('.sortbar').style.display='none';
      document.querySelector('.listing').style.display='block';
      document.getElementById('crumbCat').textContent='Athelia';
      const grid=document.getElementById('grid'); grid.className='';
      grid.innerHTML=`<div class="panel cart-empty cop-invite" style="max-width:520px;margin:40px auto">
        <div class="cop-gate-art" style="margin:0 auto 20px"><img src="${ASSET('copilot-gate.webp')}" alt="" width="168" height="168" loading="lazy"></div>
        <h3>Sign in to use Athelia</h3>
        <p>Athelia matches your brief against every verified SKU in the catalog and explains why. It's free for brand owners — sign in or create an account to see your ranked results.</p>
        <div style="display:flex;gap:12px;justify-content:center">
          <a class="btn btn-out" href="login.html?next=${encodeURIComponent('category.html?copilot=1')}">Log in</a>
          <a class="btn btn-green" href="signup.html">Sign up free</a>
        </div>
      </div>`;
      if(window.ARCANA_openCopilotGate) window.ARCANA_openCopilotGate();
      return;
    }

    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="m5 12 4 4 10-11"/></svg>';
    const DSH='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14"/></svg>';
    const SPARK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6.3 6.3l2.4 2.4M15.3 15.3l2.4 2.4M17.7 6.3l-2.4 2.4M8.7 15.3l-2.4 2.4"/><circle cx="12" cy="12" r="3"/></svg>';

    const main=document.querySelector('main.wrap');
    const listing=document.querySelector('.listing');
    document.querySelector('.filter-rail').style.display='none';
    document.querySelector('.list-top').style.display='none';
    document.querySelector('.sortbar').style.display='none';
    listing.style.display='block';
    document.getElementById('crumbCat').textContent='Athelia';
    const grid=document.getElementById('grid'); grid.className='cop-grid';

    const bar=document.createElement('section'); bar.className='cop-bar';
    main.insertBefore(bar, listing);

    function skeleton(){
      grid.innerHTML=Array.from({length:6}).map(()=>`
        <div class="sk"><div class="sk-img cop-shimmer"></div>
          <div class="sk-lines"><i class="cop-shimmer"></i><i class="cop-shimmer"></i><i class="cop-shimmer"></i></div></div>`).join('');
      grid.className='cop-skel';
    }
    function streamText(el, text){
      if(reduce){ el.textContent=text; return Promise.resolve(); }
      return new Promise(res=>{ let i=0; const tick=()=>{ i++; el.textContent=text.slice(0,i);
        if(i<text.length) setTimeout(tick, 11); else res(); }; tick(); });
    }
    function resultHTML(r,i){
      const p=r.p;
      const card=window.ARCANA_card(p,{href:'product.html?id='+p.id, fabricSpec:p.cat==='fabrics'});
      const lbl = r.total ? `${r.matched}/${r.total} criteria met` : 'Relevant to your brief';
      const hits=r.hits.map(h=>`<span class="cop-hit">${CHK}${h}</span>`).join('');
      const miss=r.miss.map(m=>`<span class="cop-missc">${DSH}${m}</span>`).join('');
      return `<div class="cop-result${i===0?' top':''}">${card}
        <div class="cop-reason">
          <div class="cop-reason-head">
            <div class="cop-score" style="--v:${r.score}"><b>${r.score}</b></div>
            <div class="cop-score-lbl"><b>${r.score}% match</b>${lbl}</div>
            ${i===0?'<span class="cop-topflag">Top match</span>':''}
          </div>
          <div class="cop-chips">${hits}${miss}</div>
        </div></div>`;
    }
    function sourcingRequest(brief, compact){
      const subject=`Request for ${String(brief||'').trim()}`;
      const body=`Hello Atelix,\n\nPlease help me source the following item:\n${String(brief||'').trim()}\n\nThank you.`;
      const href=`mailto:info@arcanawangsa.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      return `<div class="cop-request${compact?' compact':''}">${IC.msg}<div><b>Need an exact match?</b><p>Send us your sourcing brief and our team will help find it.</p></div><a class="btn btn-green" href="${href}">Request sourcing help</a></div>`;
    }

    let editing=false;
    function paintBar(brief, summaryText, intent){
      const chips = intent ? Cop.describe(intent) : [];
      bar.innerHTML=`
        <div class="cop-bar-top">
          <span class="cop-avatar">${SPARK}</span>
          <div style="flex:1;min-width:0">
            <div class="cop-role">Athelia</div>
            <div class="cop-summary" data-cop-summary role="status" aria-live="polite"></div>
          </div>
          <div class="cop-actions">
            <span class="cop-usage" data-cop-usage hidden></span>
            <button type="button" data-cop-refine>${SPARK.replace('width="1.6"','width="1.8"')} Refine</button>
            <button type="button" class="cop-clear" data-cop-clear>Clear</button>
          </div>
        </div>
        ${chips.length?`<div class="cop-brief"><span class="lbl">Reading your brief as</span>${chips.map(c=>`<span class="cop-tag">${c}</span>`).join('')}</div>`:''}
        <div class="cop-limitnote" data-cop-limitnote hidden></div>
        <form class="cop-editform" data-cop-edit hidden>
          <input type="text" value="${(brief||'').replace(/"/g,'&quot;')}" aria-label="Refine your sourcing brief" placeholder="Describe what you're sourcing…">
          <button class="cop-ask" type="submit">Search</button>
        </form>`;
      bar.querySelector('[data-cop-clear]').addEventListener('click',()=>{ Cop.clearBrief(); location.href='category.html'; });
      const editForm=bar.querySelector('[data-cop-edit]');
      bar.querySelector('[data-cop-refine]').addEventListener('click',()=>{
        editing=!editing; editForm.hidden=!editing; if(editing) editForm.querySelector('input').focus();
      });
      editForm.addEventListener('submit',e=>{ e.preventDefault();
        const v=editForm.querySelector('input').value.trim(); if(!v) return;
        Cop.setBrief(v); run(v);
      });
      return bar.querySelector('[data-cop-summary]');
    }

    function revealIn(el){
      el.hidden=false; el.classList.remove('in');
      requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
    }
    function paintUsage(usage){
      const el=bar.querySelector('[data-cop-usage]'); if(!el) return;
      if(!usage){ el.hidden=true; el.classList.remove('in'); return; }
      el.textContent=`${usage.callCount}/${usage.maxCalls} today`;
      el.title=`${usage.totalTokens.toLocaleString()} of ${usage.maxTokens.toLocaleString()} AI tokens used today`;
      revealIn(el);
    }
    function paintLimitNote(show){
      const el=bar.querySelector('[data-cop-limitnote]'); if(!el) return;
      if(!show){ el.hidden=true; el.classList.remove('in'); el.innerHTML=''; return; }
      el.innerHTML=`${IC.lock}<span>You've reached today's Athelia AI limit — showing catalog-matched results below, no AI summary. Resets tomorrow.</span>`;
      revealIn(el);
    }

    async function run(text){
      skeleton();
      const sumEl=paintBar(text, '', Cop.parse(text));
      const {matches, summary, meta}=await Cop.ask(text);
      grid.className='cop-grid';
      const list=matches.slice(0,12);
      const hasStrongMatch=list.some(r=>r.score>=72);
      window.ARCANA_setCopilotMatches(list);
      grid.innerHTML = list.length
        ? list.map(resultHTML).join('')
        : `<div class="cop-empty">${SPARK}<b>No verified matches yet</b><p>We don’t have an exact match in the catalog yet, but our sourcing team can look for it.</p>${sourcingRequest(text)}</div>`;
      if(list.length&&!hasStrongMatch) grid.insertAdjacentHTML('beforeend',sourcingRequest(text,true));
      window.ARCANA_wireCards(grid);
      paintUsage(meta && meta.usage);
      paintLimitNote(!!(meta && meta.code==='limit_reached'));
      await streamText(sumEl, summary);
    }

    const brief=Cop.getBrief();
    if(brief && brief.text){ run(brief.text); }
    else {
      grid.className='cop-grid'; grid.innerHTML='';
      const sumEl=paintBar('', '', null);
      sumEl.textContent='Describe what you’re sourcing and I’ll match it against every verified SKU.';
      editing=true; const ef=bar.querySelector('[data-cop-edit]'); ef.hidden=false; ef.querySelector('input').focus();
    }
  }

  // ---- Category page + SRP (keyword search shares the category layout/filters;
  // `q` is what makes this render as an SRP instead of a plain category browse) ----
  const M=window.ARCANA_PRODUCT_MAP;
  const META={
    fabrics:{title:'Fabrics',noun:'fabric options'},
    accessories:{title:'Accessories',noun:'accessory options'},
    trims:{title:'Trims',noun:'trim options'},
    yarns:{title:'Yarns & Threads',noun:'yarn & thread options'},
    oem:{title:'OEM Services',noun:'service packages'},
  };
  let cat=qsAll.get('cat'); if(!META[cat])cat='fabrics';
  const q=(qsAll.get('q')||'').trim().toLowerCase();
  const meta=META[cat];
  const heading = q ? q.replace(/\b\w/g,c=>c.toUpperCase()) : meta.title;
  document.getElementById('crumbCat').textContent=heading;
  document.getElementById('listTitle').textContent=heading;

  document.getElementById('listSub').innerHTML= q
    ? `${heading} in <a href="category.html?cat=${cat}" style="color:var(--green);font-weight:600">${meta.title}</a>`
    : '';
  const isFabric=cat==='fabrics';
  const items=window.ARCANA_PRODUCTS.filter(p=>p.cat===cat && (!q || (p.name+' '+p.comp+' '+p.spec).toLowerCase().includes(q)));
  const isNewSource=p=>/^(FAB-(13[7-9]|14[0-9]|15[0-4])|BUT-155|ZIP-15[6-7])$/.test(p.id);
  // deterministic mock rating/sold
  const rnd=(id,a,b)=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return a+(h%(Math.round((b-a)*10)+1))/10;};
  const soldOf=id=>[ '500+','1rb+','2rb+','5rb+','800+' ][id.charCodeAt(4)%5];
  // materials facet
  const mats=['Cotton','Polyester','Linen','Nylon','Wool','Viscose','Spandex'];
  document.getElementById('matOpts').innerHTML=mats.map(m=>{
    const n=items.filter(p=>p.comp.toLowerCase().includes(m.toLowerCase())).length;
    return `<label class="frl-opt"><input type="checkbox" value="${m}" ${n?'':'disabled'}> <span data-mat="${m}">${window.ARCANA_TR(m)}</span> <span class="cnt">${n}</span></label>`;
  }).join('');
  if(!items.some(p=>mats.some(m=>p.comp.toLowerCase().includes(m.toLowerCase())))) document.getElementById('matOpts').closest('.frl-block').style.display='none';

  const countryOf=p=>p.country||p.loc.split(',').pop().trim();
  const regionOf=p=>{const parts=p.loc.split(',').map(s=>s.trim().replace(/\s*\(.*?\)/g,''));return parts.length>=3?parts[parts.length-2]:parts[0];};

  // Country facet — show only if >1 country in category
  const allCountries=[...new Set(items.map(countryOf))].sort();
  const countryBlock=document.getElementById('countryBlock');
  if(allCountries.length<=1){countryBlock.style.display='none';}
  else{
    document.getElementById('countryOpts').innerHTML=
      `<label class="frl-opt"><input type="radio" name="ctry" value="all" checked> <span>All</span></label>`+
      allCountries.map(c=>`<label class="frl-opt"><input type="radio" name="ctry" value="${c}"> <span>${c}</span></label>`).join('');
  }

  let avail='all', sort='rec', mat=[], pmin=null, pmax=null, country='all', regionSel=[];
  const moqNum=s=>parseInt(String(s).replace(/\D/g,''))||0;
  const grid=document.getElementById('grid'), resCount=document.getElementById('resCount'), mobileResCount=document.getElementById('mobileResCount'), oemMaterialSources=document.getElementById('oemMaterialSources');

  function populateRegions(){
    const ctryItems=country==='all'?items:items.filter(p=>countryOf(p)===country);
    const regions=[...new Set(ctryItems.map(regionOf))].sort();
    const rb=document.getElementById('regionBlock');
    regionSel=[];
    if(regions.length<=1){rb.style.display='none';return;}
    rb.style.display='';
    document.getElementById('regionOpts').innerHTML=regions.map(r=>{
      const n=ctryItems.filter(p=>regionOf(p)===r).length;
      return `<label class="frl-opt"><input type="checkbox" value="${r}"> <span>${r}</span> <span class="cnt">${n}</span></label>`;
    }).join('');
    document.getElementById('regionOpts').addEventListener('change',()=>{
      regionSel=[...document.querySelectorAll('#regionOpts input:checked')].map(c=>c.value);render();
    });
  }
  populateRegions();

  function render(){
    const TR=window.ARCANA_TR, T=window.ARCANA_T;
    const heTitle = q ? heading : TR(meta.title);
    document.title = `${heTitle} — Atelix`;
    document.getElementById('crumbCat').textContent = heTitle;
    document.getElementById('listTitle').textContent = heTitle;
    // subtitle + material facet labels (re-translate on language switch)
    const categoryProducts=items.length;
    const categorySuppliers=new Set(items.map(product=>product.seller)).size;
    document.getElementById('listSub').innerHTML = q
      ? `${heading} in <a href="category.html?cat=${cat}" style="color:var(--green);font-weight:600">${TR(meta.title)}</a>`
      : `<b style="color:var(--ink)">${categoryProducts}</b> ${T('noun.'+cat)} · <b style="color:var(--ink)">${categorySuppliers}</b> ${T('cat.verified')}`;
    document.querySelectorAll('#matOpts [data-mat]').forEach(el=>{ el.textContent = TR(el.dataset.mat); });
    let list=items.filter(p=>{
      const isOemAvailable=p.badge==='oem';
      if(avail==='oem' && !isOemAvailable) return false;
      if(avail==='nonoem' && isOemAvailable) return false;
      if(mat.length && !mat.some(m=>p.comp.toLowerCase().includes(m.toLowerCase()))) return false;
      if(pmin!=null && p.price<pmin) return false;
      if(pmax!=null && p.price>pmax) return false;
      if(country!=='all' && countryOf(p)!==country) return false;
      if(regionSel.length && !regionSel.includes(regionOf(p))) return false;
      return true;
    });
    if(sort==='rec') list=[...list].sort((a,b)=>Number(isNewSource(b))-Number(isNewSource(a)));
    else if(sort==='price') list=[...list].sort((a,b)=>a.price-b.price);
    else if(sort==='moq') list=[...list].sort((a,b)=>moqNum(a.moq)-moqNum(b.moq));
    else if(sort==='new') list=[...list].reverse();
    const countText=`${list.length} ${T(list.length===1?'result':'results')}`;
    resCount.textContent=countText;
    mobileResCount.textContent=countText;

    grid.innerHTML = list.length
      ? list.map(p=>window.ARCANA_card(p,{href:'product.html?id='+p.id, fabricSpec:isFabric})).join('')
      : `<div style="grid-column:1/-1;padding:60px;text-align:center;color:var(--muted)">No ${meta.noun} match these filters. <a href="#" id="reset2" style="color:var(--green);font-weight:600">Reset filters</a></div>`;

    window.ARCANA_wireCards(grid);
    if(oemMaterialSources){
      const showMaterials=cat==='oem'&&!q;
      oemMaterialSources.hidden=!showMaterials;
      if(showMaterials){
        const materialList=window.ARCANA_PRODUCTS.filter(isNewSource).slice(0,6);
        oemMaterialSources.innerHTML=`<div class="sec-head"><div><h2 id="oem-material-sources-title">Material partners for OEM projects</h2><p class="muted" style="margin-top:5px">Source fabrics and components separately from your finished-goods manufacturer.</p></div><a class="link-arrow" href="category.html?cat=fabrics">Browse all materials ${IC.chevR}</a></div><div class="prod-grid">${materialList.map(p=>window.ARCANA_card(p,{href:'product.html?id='+p.id})).join('')}</div>`;
        window.ARCANA_wireCards(oemMaterialSources);
      }
    }
    const r2=document.getElementById('reset2'); if(r2) r2.addEventListener('click',e=>{e.preventDefault();resetAll();});
  }

  function resetAll(){ avail='all'; sort='rec'; mat=[]; pmin=pmax=null; country='all'; regionSel=[];
    document.querySelector('[name=avail][value=all]').checked=true;
    document.querySelectorAll('#matOpts input').forEach(c=>c.checked=false);
    document.getElementById('pmin').value=''; document.getElementById('pmax').value='';
    document.querySelectorAll('.sort-chip').forEach(c=>c.classList.toggle('on',c.dataset.sort==='rec'));
    const allCtry=document.querySelector('[name=ctry][value=all]'); if(allCtry) allCtry.checked=true;
    populateRegions();
    render();
  }

  document.querySelectorAll('[name=avail]').forEach(r=>r.addEventListener('change',()=>{avail=r.value;render();}));
  document.getElementById('matOpts').addEventListener('change',()=>{mat=[...document.querySelectorAll('#matOpts input:checked')].map(c=>c.value);render();});
  document.getElementById('countryOpts').addEventListener('change',e=>{
    const r=e.target; if(r.name==='ctry'){country=r.value;populateRegions();render();}
  });
  document.getElementById('pmin').addEventListener('input',e=>{pmin=e.target.value?+e.target.value:null;render();});
  document.getElementById('pmax').addEventListener('input',e=>{pmax=e.target.value?+e.target.value:null;render();});
  document.querySelectorAll('.sort-chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.sort-chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');sort=c.dataset.sort;sortbar.classList.remove('sheet-open');document.body.classList.remove('sheet-active');render();}));
  document.getElementById('clearFilters').addEventListener('click',e=>{e.preventDefault();resetAll();});
  render();
  window.ARCANA_onLang(render);
};
</script>
</body>
</html>
