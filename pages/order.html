<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCANA</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-catalog data-hdr="b" data-root=".." data-search="Search fabrics, materials, suppliers…">
<div id="hdr"></div>

<main class="wrap" style="padding-bottom:40px">
  <nav class="crumbs"><a href="../index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><a href="brand-owner.html#orders">My Orders</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span class="cur" id="ordCrumb">Order</span></nav>
  <div id="ordRoot"></div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script>
window.ARCANA_PAGE = async function({IC,Store,toast}){
  const money=n=>window.ARCANA_money(n);
  const root=document.getElementById('ordRoot');
  const no=new URLSearchParams(location.search).get('no');
  const API=window.ARCANA_API;

  // Require login: orders are RLS-scoped to their buyer.
  const profile = await API.getSessionProfile();
  if(!profile){
    root.innerHTML=`<div class="panel cart-empty" style="max-width:520px;margin:0 auto">
      <span class="ce-ic">${IC.lock}</span><h3>Log in to view this order</h3>
      <p>Your orders are private to your account. Sign in to see the details and payment status.</p>
      <a class="btn btn-green" href="login.html?next=${encodeURIComponent('order.html'+location.search)}">Log in</a>
    </div>`;
    return;
  }

  // Platform escrow bank account (from platform_bank_accounts).
  const bank = await API.getBankAccount();
  const PLATFORM_BANK = bank
    ? { bank:bank.bank_name, account:bank.account_number, holder:bank.account_name, swift:bank.swift||'—' }
    : { bank:'—', account:'—', holder:'ARCANA', swift:'—' };

  // Load the order (header + snapshot items) and map to the render shape.
  let order=null;
  async function load(){
    if(!no) return;
    const { order:o, items, error } = await API.getOrder(no);
    if(error || !o){ order=null; return; }
    order={
      no:o.order_no, placedAt:o.placed_at, status:o.status,
      items:(items||[]).map(it=>({ name:it.name_snapshot, seller:it.seller_snapshot, qty:Number(it.qty), price:Number(it.unit_price) })),
      subtotal:Number(o.subtotal), fee:Number(o.fee), ship:Number(o.ship),
      qcFee:Number(o.qc_fee), insFee:Number(o.ins_fee), total:Number(o.total)
    };
  }
  await load();

  const STATUS_META={
    awaiting_payment:{label:'Pending payment', cls:'b-prem'},
    payment_declared:{label:'Payment declared', cls:'b-prem'},
    payment_verified:{label:'Payment verified', cls:'b-std'},
    fulfilling:{label:'In fulfillment', cls:'b-std'},
    completed:{label:'Completed', cls:'b-ok'},
    cancelled:{label:'Cancelled', cls:'b-nonoem'},
    disputed:{label:'Disputed', cls:'b-nonoem'},
    refunded:{label:'Refunded', cls:'b-nonoem'}
  };

  const STEPS=[
    ['Pending payment','Awaiting bank transfer confirmation'],
    ['Payment verified',"We've matched your transfer"],
    ['In production','Supplier(s) confirmed and began production'],
    ['Shipped','Tracking shared once dispatched'],
    ['Delivered','Confirm receipt to complete your order'],
    ['Completed',"Thanks — review your supplier(s)"]
  ];
  const STEP_INDEX={awaiting_payment:0, payment_declared:0, payment_verified:1, fulfilling:2, completed:5};

  const fmtDate=ts=>new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

  function bankPanel(o){
    if(o.status==='awaiting_payment') return `
      <section class="panel ord-bank">
        <h2>Bank transfer required</h2>
        <p class="ph">Transfer ${money(o.total)} to ARCANA's account to complete your order.</p>
        <div class="pay-detail" style="margin-top:0">
          <div class="bank-row"><span class="k">Bank</span><span class="v">${PLATFORM_BANK.bank}</span></div>
          <div class="bank-row"><span class="k">Account</span><span class="v">${PLATFORM_BANK.account}</span></div>
          <div class="bank-row"><span class="k">Beneficiary</span><span class="v">${PLATFORM_BANK.holder}</span></div>
          <div class="bank-row"><span class="k">SWIFT</span><span class="v">${PLATFORM_BANK.swift}</span></div>
        </div>
        <p class="ord-ref">Use <b>${o.no}</b> as your transfer reference.</p>
        <div class="ord-bank-actions">
          <button class="btn btn-gold" data-transferred>${IC.lock} I have transferred</button>
        </div>
      </section>`;
    if(o.status==='payment_declared') return `
      <section class="panel ord-bank">
        <h2>Payment declared</h2>
        <p class="ph">We're verifying your transfer of ${money(o.total)} against our bank statement — this usually takes up to 2 business days.</p>
      </section>`;
    if(o.status==='cancelled') return `
      <section class="panel ord-bank">
        <h2>Order cancelled</h2>
        <p class="ph" style="margin-bottom:0">This order was cancelled and no payment is required.</p>
      </section>`;
    return '';
  }

  function itemsCard(o){
    const bySeller={};
    o.items.forEach(i=>{(bySeller[i.seller]=bySeller[i.seller]||[]).push(i);});
    return `<section class="panel summary">
      <h3>Items</h3>
      ${Object.entries(bySeller).map(([seller,items])=>`
        <div class="co-rev-block"><div class="rt"><b>Sourced from ${seller}</b></div>
          ${items.map(i=>`<div class="rl" style="display:flex;justify-content:space-between"><span>${i.name} × ${i.qty}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
        </div>`).join('')}
    </section>`;
  }

  function costCard(o){
    return `<section class="panel summary">
      <h3>Cost</h3>
      <div class="sum-row"><span class="k">Items</span><span>${money(o.subtotal)}</span></div>
      <div class="sum-row"><span class="k">Service fee</span><span>${money(o.fee)}</span></div>
      ${o.qcFee?`<div class="sum-row"><span class="k">QC Inspection</span><span>${money(o.qcFee)}</span></div>`:''}
      ${o.insFee?`<div class="sum-row"><span class="k">Insurance</span><span>${money(o.insFee)}</span></div>`:''}
      <div class="sum-row"><span class="k">Shipping</span><span>${money(o.ship)}</span></div>
      <div class="total-box" style="margin-top:10px"><div class="lbl">Total</div><div class="amt">${money(o.total)}</div></div>
    </section>`;
  }

  function statusCard(o){
    if(['cancelled','disputed','refunded'].includes(o.status)){
      return `<section class="panel summary"><h3>Status</h3><p style="color:var(--muted);font-size:13.5px">${STATUS_META[o.status].label} — ${o.status==='cancelled'?'this order will not be processed further.':'contact ARCANA support for details.'}</p></section>`;
    }
    const cur=STEP_INDEX[o.status] ?? 0;
    return `<section class="panel summary"><h3>Status</h3><div class="timeline" style="margin-top:14px;max-width:none">
      ${STEPS.map((s,i)=>`<div class="tl-row ${i<=cur?'cur':''}"><span class="tl-dot">${i<cur?IC.check:''}</span><div><b>${s[0]}</b><p>${s[1]}</p></div></div>`).join('')}
    </div></section>`;
  }

  function render(){
    if(!order){
      root.innerHTML=`<div class="panel cart-empty"><span class="ce-ic">${IC.box}</span><h3>Order not found</h3><p>We couldn't find that order. Check the link or view your order history.</p><a class="btn btn-green" href="brand-owner.html#orders">View my orders</a></div>`;
      return;
    }
    document.getElementById('ordCrumb').textContent=order.no;
    const meta=STATUS_META[order.status]||STATUS_META.awaiting_payment;
    root.innerHTML=`
      <section class="panel ord-hd">
        <div><h1>${order.no}</h1><span class="ord-date">Placed ${fmtDate(order.placedAt)}</span></div>
        <span class="badge ${meta.cls}">${meta.label}</span>
      </section>
      ${bankPanel(order)}
      <div class="co-wrap" style="margin-top:20px">${itemsCard(order)}${costCard(order)}</div>
      <div style="margin-top:20px">${statusCard(order)}</div>
    `;
    bind();
  }

  function bind(){
    const t=root.querySelector('[data-transferred]');
    if(t) t.addEventListener('click',async ()=>{
      t.disabled=true; const orig=t.innerHTML; t.textContent='Confirming…';
      const { error } = await API.declarePayment(order.no);
      if(error){ toast(`Could not confirm — ${error.message||'please try again.'}`); t.disabled=false; t.innerHTML=orig; return; }
      await load();
      toast("Marked as transferred — we'll verify and update this page.");
      render();
    });
  }
  render();
};
</script>
</body>
</html>
