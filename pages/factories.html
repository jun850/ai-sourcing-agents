<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCANA</title>
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
</head>
<body data-root=".." data-search="Search factories, mills, suppliers…">
<div id="hdr"></div>

<main class="wrap">
  <nav class="crumbs"><a href="../index.html">Home</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg><span class="cur">Factories</span></nav>

  <div class="listing">
    <aside class="filter-rail">
      <div class="frl-head"><b>Filters</b><a href="#" id="clearFilters">Reset</a></div>
      <div class="frl-block">
        <h5>Business type</h5>
        <div id="typeOpts"></div>
      </div>
      <div class="frl-block">
        <h5>Region</h5>
        <div id="regionOpts"></div>
      </div>
      <div class="frl-block">
        <h5>Certifications</h5>
        <div id="certOpts"></div>
      </div>
    </aside>

    <div class="listing-main">
      <div class="list-top">
        <h1>Factories</h1>
        <div class="cnt"><b style="color:var(--ink)">520+</b> verified fabric mills and OEM factories, audited for identity, license &amp; capability</div>
      </div>
      <div class="sortbar">
        <span class="lbl">Sort</span>
        <div class="sort-chips" id="sortChips">
          <button class="sort-chip on" data-sort="rec">Recommended</button>
          <button class="sort-chip" data-sort="rating">Top rated</button>
          <button class="sort-chip" data-sort="orders">Most orders</button>
          <button class="sort-chip" data-sort="years">Most established</button>
        </div>
        <span class="count" id="resCount"></span>
      </div>
      <div class="fac-grid" id="grid"></div>
    </div>
  </div>
  <div style="height:40px"></div>
</main>

<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/copilot.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script>
window.ARCANA_PAGE = function({ASSET,IC,Store,toast}){
  const F=window.ARCANA_FACTORIES;
  const uniq=(k)=>[...new Set(F.map(f=>f[k]))];
  const types=uniq('type'), regions=uniq('region');
  const certs=[...new Set(F.flatMap(f=>f.certs))];
  const optRow=(name,val,n)=>`<label class="frl-opt"><input type="checkbox" name="${name}" value="${val}"> ${val} <span class="cnt">${n}</span></label>`;
  document.getElementById('typeOpts').innerHTML=types.map(t=>optRow('type',t,F.filter(f=>f.type===t).length)).join('');
  document.getElementById('regionOpts').innerHTML=regions.map(r=>optRow('region',r,F.filter(f=>f.region===r).length)).join('');
  document.getElementById('certOpts').innerHTML=certs.map(c=>optRow('cert',c,F.filter(f=>f.certs.includes(c)).length)).join('');

  let sort='rec';
  const sel=name=>[...document.querySelectorAll(`[name=${name}]:checked`)].map(c=>c.value);
  const grid=document.getElementById('grid'), resCount=document.getElementById('resCount');

  function render(){
    const ty=sel('type'), rg=sel('region'), ct=sel('cert');
    let list=F.filter(f=>(!ty.length||ty.includes(f.type))&&(!rg.length||rg.includes(f.region))&&(!ct.length||ct.some(c=>f.certs.includes(c))));
    if(sort==='rating') list=[...list].sort((a,b)=>b.rating-a.rating);
    else if(sort==='orders') list=[...list].sort((a,b)=>parseInt(b.orders)-parseInt(a.orders));
    else if(sort==='years') list=[...list].sort((a,b)=>b.years-a.years);
    resCount.textContent=`${list.length} factor${list.length===1?'y':'ies'}`;
    grid.innerHTML=list.map(f=>`
      <a class="fcard" href="supplier.html?id=${f.id}">
        <div class="fthumb"><img src="${ASSET(f.img+'.webp')}" alt="${f.name}" loading="lazy">${f.verified?`<span class="fveric">${IC.shield} Verified Factory</span>`:''}</div>
        <div class="fbody">
          <div class="fname">${f.name}</div>
          <span class="ftype">${f.type}</span>
          <div class="fmeta"><span class="star">★</span> ${f.rating.toFixed(1)} <span class="dot">·</span> ${f.orders} orders <span class="dot">·</span> ${f.years} yrs</div>
          <div class="floc">${IC.pin}<span>${f.loc}</span></div>
          <div class="ftags">${f.tags.map(t=>`<span>${t}</span>`).join('')}</div>
          <div class="ffoot"><div>MOQ<b>${f.moq}</b></div><div>Lead time<b>${f.lead}</b></div></div>
          <span class="btn btn-out btn-block">View factory</span>
        </div></a>`).join('');
  }
  render();
  document.querySelectorAll('.filter-rail input').forEach(i=>i.addEventListener('change',render));
  document.querySelectorAll('.sort-chip').forEach(c=>c.addEventListener('click',()=>{document.querySelectorAll('.sort-chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');sort=c.dataset.sort;render();}));
  document.getElementById('clearFilters').addEventListener('click',e=>{e.preventDefault();document.querySelectorAll('.filter-rail input').forEach(i=>i.checked=false);sort='rec';document.querySelectorAll('.sort-chip').forEach(x=>x.classList.toggle('on',x.dataset.sort==='rec'));render();});
};
</script>
</body>
</html>
