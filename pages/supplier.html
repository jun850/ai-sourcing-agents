<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verified Supplier Profile — Atelix</title>
<meta name="description" content="Explore a verified factory's capabilities, certifications, MOQ, lead time and catalog, and contact them directly on Atelix.">
<link rel="canonical" href="https://marketplace-three-peach.vercel.app/pages/supplier.html">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="Atelix">
<meta property="og:title" content="Verified Supplier Profile — Atelix">
<meta property="og:description" content="A verified factory's capabilities, certifications, MOQ, lead time and catalog on Atelix.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Verified Supplier Profile — Atelix">
<meta name="twitter:description" content="A verified factory's capabilities, certifications, MOQ, lead time and catalog on Atelix.">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/pages.css">
<style>.map-svg{position:absolute;inset:0;width:100%;height:100%}</style>
</head>
<body data-catalog data-root=".." data-search="Search fabrics, trims, accessories, factories…">
<div id="hdr"></div>
<main class="wrap"><div id="supRoot">
  <div class="sup-hero supplier-loading" aria-busy="true" aria-live="polite">
    <section class="panel sup-main" aria-hidden="true">
      <div class="supplier-sk-cover skeleton-shimmer"></div>
      <div class="supplier-sk-top"><div class="supplier-sk-identity"><i class="supplier-sk-logo skeleton-shimmer"></i><div><i class="supplier-sk-line supplier-sk-line--title skeleton-shimmer"></i><i class="supplier-sk-line supplier-sk-line--meta skeleton-shimmer"></i><i class="supplier-sk-line supplier-sk-line--copy skeleton-shimmer"></i><i class="supplier-sk-line supplier-sk-line--copy short skeleton-shimmer"></i></div></div><div class="supplier-sk-contact"><i class="supplier-sk-line skeleton-shimmer"></i><i class="supplier-sk-line skeleton-shimmer"></i><i class="supplier-sk-line short skeleton-shimmer"></i></div></div>
      <div class="metrics"><i class="supplier-sk-metric skeleton-shimmer"></i><i class="supplier-sk-metric skeleton-shimmer"></i><i class="supplier-sk-metric skeleton-shimmer"></i></div>
      <div class="sup-actions"><i class="supplier-sk-action skeleton-shimmer"></i><i class="supplier-sk-action short skeleton-shimmer"></i></div>
    </section>
    <section class="panel map-panel" aria-hidden="true"><i class="supplier-sk-heading skeleton-shimmer"></i><div class="supplier-sk-map skeleton-shimmer"></div><div class="map-facts"><i class="supplier-sk-fact skeleton-shimmer"></i><i class="supplier-sk-fact skeleton-shimmer"></i><i class="supplier-sk-fact skeleton-shimmer"></i></div></section>
  </div>
  <div class="feat-fabrics supplier-loading-products" aria-hidden="true"><section class="panel" style="padding:26px 28px"><div class="sec-head" style="margin-bottom:20px"><i class="supplier-sk-heading skeleton-shimmer"></i></div><div class="prod-grid"><div class="tcard-skeleton"><div class="sk-img"></div><div class="sk-body"><i class="sk-line"></i><i class="sk-line"></i><i class="sk-line"></i></div></div><div class="tcard-skeleton"><div class="sk-img"></div><div class="sk-body"><i class="sk-line"></i><i class="sk-line"></i><i class="sk-line"></i></div></div><div class="tcard-skeleton"><div class="sk-img"></div><div class="sk-body"><i class="sk-line"></i><i class="sk-line"></i><i class="sk-line"></i></div></div><div class="tcard-skeleton"><div class="sk-img"></div><div class="sk-body"><i class="sk-line"></i><i class="sk-line"></i><i class="sk-line"></i></div></div><div class="tcard-skeleton"><div class="sk-img"></div><div class="sk-body"><i class="sk-line"></i><i class="sk-line"></i><i class="sk-line"></i></div></div></div></section><span class="sr-only">Loading supplier details and products</span></div>
</div><div style="height:40px"></div></main>
<div id="ftr"></div>
<script src="../js/data.js"></script>
<script src="../js/copilot.js"></script>
<script src="../js/components.js"></script>
<script defer src="../js/analytics.bundle.js"></script>
<script src="../js/supabase-client.bundle.js"></script>
<script src="../js/api.js"></script>
<script src="../js/copilot-llm.js"></script>
<script>
window.ARCANA_PAGE = async function({ASSET,IC,Store,toast}){
  const FMAP=window.ARCANA_FACTORY_MAP, PRODUCTS=window.ARCANA_PRODUCTS;
  const api=window.ARCANA_API;
  const T=window.ARCANA_T||(x=>x), TR=window.ARCANA_TR||(x=>x);
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const id=new URLSearchParams(location.search).get('id');
  if(id&&!FMAP[id]&&api?.getPublicFactory){const remoteFactory=await api.getPublicFactory(id).catch(()=>null);if(remoteFactory){FMAP[id]=remoteFactory;window.ARCANA_FACTORIES.push(remoteFactory);}}
  if(!id || !FMAP[id]){
    document.title='Supplier not found — Atelix';
    document.getElementById('supRoot').innerHTML='<section class="panel empty-state"><h1>Supplier not found</h1><p>This supplier may have been removed or the link may be incorrect.</p><a class="btn btn-green" href="factories.html">Browse factories</a></section>';
    return;
  }
  const f=FMAP[id];
  const displayLoc=window.ATELIX_factoryLocation(f);
  const belongsToSupplier=p=>String(p.factorySlug||'')===String(f.id)||Boolean(p.factoryId&&f.databaseId&&String(p.factoryId)===String(f.databaseId));
  let feat=PRODUCTS.filter(belongsToSupplier).slice(0,5);
  if(api?.fetchCatalogPage){const supplierProducts=await api.fetchCatalogPage({supplierSlug:f.id,pageSize:5}).catch(()=>null);if(supplierProducts)feat=supplierProducts.products||[];}
  const card=x=>window.ARCANA_card(x,{href:'product.html?id='+x.id, shop:false});
  const format=(key,vars)=>T(key).replace(/\{(\w+)\}/g,(_,name)=>vars&&vars[name]!=null?vars[name]:'');
  const websiteHref=value=>{try{const url=new URL(String(value||''));return /^(?:https?:)$/.test(url.protocol)?url.href:null;}catch(_){return null;}};

  function render(){
    const card=x=>window.ARCANA_card(x,{href:'product.html?id='+x.id, shop:false});
    const ask=T('Contact supplier');
    const has=v=>Array.isArray(v)?v.length>0:v!=null&&String(v).trim()!=='';
    const value=v=>has(v)?(Array.isArray(v)?v.join(', '):String(v)):ask;
    const supplierName=window.ATELIX_supplierText(f,'name');
    const supplierType=window.ATELIX_supplierText(f,'supplierType')||value(f.type);
    const location=value(displayLoc), bio=value(window.ATELIX_supplierText(f,'description')||f.bio);
    const publicWebsite=websiteHref(f.web);
    document.title = `${supplierName} — Atelix`;
    document.getElementById('supRoot').innerHTML=`
  <div class="sup-hero">
    <section class="panel sup-main">
      ${(f.page_img||(!f.logo_img&&f.img))?`<div class="sup-company-image"><img src="${esc(window.ATELIX_factoryPageAsset(f))}" alt="${esc(supplierName)} company"></div>`:''}
      <div class="sup-top">
        <div class="sup-name">
          <div class="sup-identity">${f.logo_img?`<img class="sup-logo" src="${esc(window.ATELIX_factoryAsset(f))}" alt="${esc(supplierName)} logo">`:''}<div><h1>${esc(supplierName)}${f.verified?`<span class="verified-mark" title="${T('sp.verified')}" aria-label="${T('sp.verified')}">${IC.check}</span>`:''}</h1>
          <div class="role">${esc(supplierType)} · ${esc(TR(location))}</div></div></div>
          <p class="bio">${esc(bio)}</p>
        </div>
        <div class="sup-contact" style="min-width:230px">
          <div class="sc-row"><span class="ci">${IC.user}</span><div><span>${T('sp.salesContact')}</span><b>${esc(value(f.sales))}</b><div class="muted" style="font-size:12px">${esc(value(f.phone))}</div></div></div>
          <div class="sc-row"><span class="ci">${IC.globe}</span><div><span>${T('sp.website')}</span>${publicWebsite?`<a class="supplier-website" href="${esc(publicWebsite)}" target="_blank" rel="noopener noreferrer">${esc(f.web)}</a>`:`<b>${esc(ask)}</b>`}</div></div>
          <div class="sc-row"><span class="ci">${IC.factory}</span><div><span>${T('sp.businessType')}</span><b>${esc(supplierType)}</b></div></div>
        </div>
      </div>
      <div class="metrics">
        <div class="metric"><span>${T('MOQ')}</span><b>${esc(TR(value(f.moq)))}</b></div>
        <div class="metric"><span>${T('Lead Time')}</span><b>${esc(TR(value(f.lead)))}</b></div>
        <div class="metric"><span>${T('sp.inBusiness')}</span><b>${has(f.years)?`${esc(f.years)} ${T('sp.years')}`:esc(ask)}</b></div>
      </div>
      <div class="sup-actions">
        <button class="btn btn-green" data-contact-factory>${IC.msg||''} ${T('Message supplier')}</button>
        <button class="btn btn-out fav" data-fac-fav>${IC.bookmark} ${T('Save Supplier')}</button>
        <button class="btn btn-out" data-share>${T('Share')}</button>
      </div>
    </section>
    <section class="panel map-panel">
      <h3>${T('sp.location')}</h3>
      <div class="map-box">
        <svg class="map-svg" viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice"><rect width="400" height="210" fill="#eef1ec"/><path d="M250 0 L285 40 L300 90 L285 140 L320 210 L400 210 L400 0 Z" fill="#cfe0ec"/><path d="M0 60 Q90 55 150 90 T280 120" stroke="#dcdcd2" stroke-width="2" fill="none"/><path d="M120 20 L200 100 L160 200" stroke="#e2c9a0" stroke-width="2" fill="none"/></svg>
        <div class="pin" style="left:56%;top:52%"><div style="background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;display:flex;gap:8px;align-items:center"><span style="color:var(--green)"><svg viewBox="0 0 24 24" fill="var(--green)" width="18" height="18"><path d="M12 2C8 2 5 5 5 9c0 5 7 13 7 13s7-8 7-13c0-4-3-7-7-7z"/></svg></span><span style="font-size:12px"><b>${esc(supplierName)}</b><br><span class="muted">${esc(TR(location))}</span></span></div></div>
      </div>
      <div class="map-facts">
        <div class="map-fact">${IC.pin}<span>${T('sp.region')}</span><b>${esc(TR(value(f.region)))}</b></div>
        <div class="map-fact">${IC.factory}<span>${T('sp.factoryArea')}</span><b>${esc(value(f.area))}</b></div>
        <div class="map-fact">${IC.user}<span>${T('sp.employees')}</span><b>${esc(value(f.employees))}</b></div>
      </div>
    </section>
  </div>

  <div class="feat-fabrics">
    <section class="panel" style="padding:26px 28px">
      <div class="sec-head" style="margin-bottom:20px"><h2 class="supplier-products-title">${T('sp.productsFrom')}</h2>${feat.length?`<a class="link-arrow" href="/categories/${feat[0].cat}">${T('View all')} ${IC.chevR}</a>`:''}</div>
      ${feat.length?`<div class="prod-grid">${feat.map(card).join('')}</div>`:`<div class="empty-state supplier-products-empty"><h3>${T('No products listed yet')}</h3><p>${T('This supplier has no linked products in the catalogue.')}</p></div>`}
    </section>
  </div>`;

  // interactions
    const facFav=document.querySelector('[data-fac-fav]'); facFav.classList.toggle('on',Store.isSaved(f.id));
    facFav.addEventListener('click',()=>{const on=Store.toggleSaved(f.id);facFav.classList.toggle('on',on);toast(on?T('sp.saved'):T('sp.removed'));});
    document.querySelector('[data-share]').addEventListener('click',()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);toast(T('sp.linkCopied'));});
    document.querySelectorAll('[data-contact-factory]').forEach(b=>b.addEventListener('click',()=>{
      if(f.databaseId && window.ARCANA_chatDrawer){
        window.ARCANA_chatDrawer.open({factoryId:f.databaseId, factoryName:supplierName, factoryLogo:f.logo_img||f.img});
      } else {
        window.ARCANA_contactEmail({subjectPrefix:'Product Request', bodyLines:[
          `${T('sp.emailSupplier')}: ${supplierName}`,
          `${T('sp.emailLocation')}: ${location}`,
          `${T('MOQ')}: ${value(f.moq)}`,
          `${T('sp.emailLead')}: ${value(f.lead)}`,
        ]});
      }
    }));
    const productGrid=document.querySelector('.prod-grid');
    if(productGrid)window.ARCANA_wireCards(productGrid);
  }
  render();
  window.ARCANA_onLang(render);

  const convoParam=new URLSearchParams(window.location.search).get('convo');
  if(convoParam && window.ARCANA_chatDrawer){
    window.ARCANA_chatDrawer.openConversation(convoParam, supplierName);
  }
};
</script>
</body>
</html>
